<style>
  :root{
    --paper:#FBFAF5;
    --grid:#E2EAF0;
    --rule:#B0C2D2;
    --ink:#1B3A5C;
    --ink-soft:#546B87;
    --teal:#0C6F62;
    --teal-wash:#E2F0ED;
    --terracotta:#B44F35;
    --terra-wash:#F9E7E1;
    --amber:#A9760A;
    --amber-wash:#F9EFD8;
    --panel:#FFFFFF;
    --shadow:0 1px 0 #CBD8E3, 0 2px 12px rgba(27,58,92,.06);
    --sans:"Atkinson Hyperlegible", "Verdana", "Helvetica Neue", Arial, sans-serif;
    --mono:"Roboto Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }

  body{
    background:
      repeating-linear-gradient(0deg, var(--grid) 0 1px, transparent 1px 28px),
      repeating-linear-gradient(90deg, var(--grid) 0 1px, transparent 1px 28px),
      var(--paper);
    color:var(--ink);
    font-family:var(--sans);
    font-size:18px;
    line-height:1.4;
    -webkit-text-size-adjust:100%;
  }

  .sheet{ max-width:1520px; margin:0 auto; padding:14px 18px 24px;
          display:flex; flex-direction:column; gap:12px; }

  header{ display:flex; align-items:baseline; flex-wrap:wrap; gap:4px 18px;
          border-bottom:2px solid var(--rule); padding-bottom:7px; }
  h1{ font-size:26px; margin:0; font-weight:700; letter-spacing:-.2px; text-wrap:balance; }
  .subtitle{ font-size:17px; color:var(--ink-soft); margin:0; }

  .layout{ display:grid; grid-template-columns:minmax(345px, 415px) 1fr; gap:16px; align-items:start; }
  @media (max-width:880px){ .layout{ grid-template-columns:1fr; } }

  .panel{ background:var(--panel); border:1.5px solid var(--rule); border-radius:4px;
          box-shadow:var(--shadow); padding:12px 14px 14px; }
  .panel > h2{
    font-size:17px; font-weight:700; text-transform:uppercase; letter-spacing:.7px;
    margin:0 0 9px; color:var(--ink-soft);
    display:flex; justify-content:space-between; align-items:baseline; gap:10px;
  }
  .panel > h2 .hint{ font-size:16px; text-transform:none; letter-spacing:0; font-weight:400; color:var(--ink-soft); }
  .panel > h2 .hint b{ font-family:var(--mono); font-weight:500; color:var(--ink); }

  /* ---------- table ---------- */
  .caption{ font-size:17px; color:var(--ink); margin:0 0 8px; }
  .given{
    font-size:16px; margin:0 0 10px; padding:8px 10px;
    background:var(--amber-wash); border-left:4px solid var(--amber); border-radius:0 3px 3px 0;
  }
  .given b{ font-family:var(--mono); font-weight:500; }
  .given .rule{ display:block; margin-top:5px; }

  table{ border-collapse:collapse; width:100%; }
  th,td{ border:1px solid var(--rule); padding:4px 7px; text-align:left; font-size:17px; }
  th{ background:#EEF3F8; font-weight:700; font-size:16px; text-align:center; }
  th:first-child{ text-align:left; }
  td.cls{ font-family:var(--mono); font-size:16px; white-space:nowrap; }
  td.cf, td.wd{ font-family:var(--mono); font-size:16px; text-align:center; color:var(--ink-soft); }
  td.freq{ width:82px; padding:3px 4px; }
  tr.total td{ background:#EEF3F8; font-weight:700; }
  tr.total td.cf{ color:var(--ink); }
  .wcol{ display:none; }
  body.unequal .wcol{ display:table-cell; }

  input.f{
    width:100%; box-sizing:border-box; font-family:var(--mono); font-size:17px;
    text-align:center; min-height:44px; padding:4px 2px;
    border:1.5px solid #CBD8E3; border-radius:3px; background:#FDFEFF; color:var(--ink);
  }
  input.f:focus{ outline:3px solid var(--teal); outline-offset:1px; }

  .note{ font-size:16px; color:var(--ink-soft); margin:9px 0 0; }

  .datactrl{ display:flex; flex-wrap:wrap; gap:9px; margin-top:11px; padding-top:11px;
             border-top:1.5px solid var(--rule); }

  /* ---------- charts ---------- */
  svg{ display:block; width:100%; height:auto; overflow:visible; }
  svg text{ font-family:var(--sans); fill:var(--ink); }
  .tick{ font-size:26px; fill:var(--ink-soft); font-family:var(--mono); }
  .axlabel{ font-size:29px; fill:var(--ink); font-weight:700; }
  .conlabel{ font-size:26px; fill:var(--amber); font-family:var(--mono); }
  .placeholder{ font-size:29px; fill:var(--ink-soft); }
  .vallabel{ font-size:27px; font-family:var(--mono); font-weight:500; }

  /* ---------- answers ---------- */
  .answers{
    display:grid; grid-template-columns:repeat(5, 1fr); gap:10px;
    margin-top:10px; padding-top:12px; border-top:1.5px solid var(--rule);
  }
  body.alevel .answers{ grid-template-columns:repeat(6, 1fr); }
  @media (max-width:660px){
    .answers, body.alevel .answers{ grid-template-columns:repeat(2, 1fr); }
  }
  .ansbox{ display:flex; flex-direction:column; gap:5px; }
  .ansbox.iqr{ display:none; }
  body.alevel .ansbox.iqr{ display:flex; }
  .ansbox label{ font-size:16px; color:var(--ink-soft); }
  .ansbox label b{ color:var(--ink); font-weight:700; }
  input.a{
    font-family:var(--mono); font-size:21px; text-align:center; min-height:52px; padding:4px;
    border:2px solid #CBD8E3; border-radius:4px; background:#FDFEFF; color:var(--ink);
    width:100%; box-sizing:border-box;
    transition:background-color .15s, border-color .15s, color .15s;
  }
  input.a:focus{ outline:3px solid var(--ink); outline-offset:1px; }
  input.a.correct{ border-color:var(--teal); background:var(--teal-wash); color:var(--teal); font-weight:500; }
  input.a.wrong{ border-color:var(--terracotta); background:var(--terra-wash); color:var(--terracotta); font-weight:500; }
  input.a.revealed{ border-color:var(--amber); background:var(--amber-wash); color:var(--amber); font-weight:500; }

  /* ---------- controls ---------- */
  .controls{
    display:flex; flex-wrap:wrap; gap:10px; align-items:center;
    margin-top:12px; padding-top:12px; border-top:1.5px solid var(--rule);
  }
  button{
    font-family:var(--sans); font-size:17px; font-weight:700; padding:10px 18px;
    min-height:48px; border-radius:4px; border:1.5px solid var(--ink);
    background:#fff; color:var(--ink); cursor:pointer; box-shadow:0 2px 0 #CBD8E3;
  }
  button:hover{ background:#F1F6FA; }
  button:active{ transform:translateY(1px); box-shadow:none; }
  button:focus-visible{ outline:3px solid var(--amber); outline-offset:2px; }
  button.primary{ background:var(--ink); color:#fff; box-shadow:0 2px 0 #10273F; }
  button.primary:hover{ background:#28527D; }
  button.primary:disabled{ background:#E7ECF1; color:#8FA1B4; border-color:#C6D1DB; cursor:not-allowed; box-shadow:none; }
  button.on{ background:var(--amber-wash); border-color:var(--amber); color:var(--amber); }
  button.sm{ font-size:16px; padding:8px 13px; min-height:44px; }

  .seg{ display:inline-flex; border:1.5px solid var(--ink); border-radius:4px; overflow:hidden; box-shadow:0 2px 0 #CBD8E3; }
  .seg button{ border:none; border-radius:0; box-shadow:none; padding:10px 16px; }
  .seg button + button{ border-left:1.5px solid var(--ink); }
  .seg button[aria-pressed="true"]{ background:var(--ink); color:#fff; }
  .seg button[aria-pressed="true"]:hover{ background:#28527D; }

  .tol{ display:flex; align-items:center; gap:8px; font-size:16px; color:var(--ink-soft); }
  select{
    font-family:var(--sans); font-size:17px; padding:8px 10px; min-height:48px;
    border:1.5px solid var(--rule); border-radius:4px; background:#fff; color:var(--ink);
  }
  .spacer{ flex:1 1 auto; }
  .status{ font-size:17px; color:var(--ink-soft); }
  .status.good{ color:var(--teal); font-weight:700; }
  .status.warn{ color:var(--terracotta); font-weight:700; }

  @media (prefers-reduced-motion:reduce){ *{ transition:none !important; } }
</style>

<div class="sheet">
  <header>
    <h1>Box Plots from Grouped Data</h1>
    <p class="subtitle" id="modeNote">&nbsp;</p>
  </header>

  <div class="layout">
    <section class="panel">
      <h2>The data <span class="hint">n = <b id="nLine">0</b></span></h2>
      <p class="caption" id="tableCaption">&nbsp;</p>
      <p class="given" id="givenLine">&nbsp;</p>
      <table>
        <thead>
          <tr>
            <th id="classHead">Class</th>
            <th class="wcol">Width</th>
            <th>Freq</th>
            <th>CF</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
        <tfoot>
          <tr class="total">
            <td>Total</td>
            <td class="wcol"></td>
            <td class="cf" id="totalCell">0</td>
            <td></td>
          </tr>
        </tfoot>
      </table>
      <p class="note" id="tableNote"></p>
      <div class="datactrl">
        <button class="sm" id="newBtn">New table</button>
        <button class="sm" id="widthBtn">Unequal classes</button>
        <button class="sm" id="discBtn">Discrete data</button>
      </div>
    </section>

    <section class="panel">
      <h2>The diagram <span class="hint" id="chartHint"></span></h2>

      <div id="histWrap" hidden>
        <svg id="histSvg" viewBox="0 0 1000 336" role="img" aria-label="Histogram showing frequency density"></svg>
      </div>
      <div id="cfWrap" hidden>
        <svg id="cfSvg" viewBox="0 0 1000 352" role="img" aria-label="Cumulative frequency graph"></svg>
      </div>
      <svg id="boxSvg" viewBox="0 0 1000 274" role="img" aria-label="Box plot and axis"></svg>

      <div class="answers" id="answers"></div>

      <div class="controls">
        <div class="seg" role="group" aria-label="Method">
          <button id="gcseBtn" aria-pressed="true">GCSE</button>
          <button id="alevBtn" aria-pressed="false">A-level</button>
        </div>
        <button class="primary" id="drawBtn" disabled>Draw the box plot</button>
        <button id="histBtn">Show histogram</button>
        <button id="cfBtn">Show CF graph</button>
        <button id="revealBtn">Reveal answers</button>
        <div class="tol">
          <label for="tolSel">Accept within</label>
          <select id="tolSel">
            <option value="half">&frac12; square</option>
            <option value="one">1 square</option>
            <option value="dp">Exact (1 d.p.)</option>
          </select>
        </div>
        <span class="spacer"></span>
        <span class="status" id="status"></span>
      </div>
    </section>
  </div>
</div>

<script>
(function(){
  "use strict";

  // `unit` is the base step: every class boundary and every axis tick is a multiple of it.
  var CONTINUOUS = [
    {title:"Time taken by @ students to complete a puzzle", sym:"t", label:"seconds", start:0,   unit:10},
    {title:"Mass of @ apples picked from an orchard",       sym:"m", label:"grams",   start:100, unit:20},
    {title:"Height of @ sunflowers in a school plot",       sym:"h", label:"cm",      start:120, unit:10},
    {title:"Length of @ leaves collected on a field trip",  sym:"L", label:"mm",      start:20,  unit:5},
    {title:"Speed of @ cars passing the school gate",       sym:"v", label:"mph",     start:20,  unit:5},

    {title:"Time spent on homework by @ pupils",            sym:"h", label:"minutes", start:0,   unit:15}
  ];

  // Discrete data: classes are written 0–9, 10–19, so the true boundaries sit at −0.5, 9.5, 19.5
  var DISCRETE = [
    {title:"Marks scored by @ candidates in a test",         sym:"m", label:"marks",   start:0, unit:10},
    {title:"Texts sent in a day by @ students",              sym:"x", label:"texts",   start:0, unit:10},
    {title:"Runs scored by a batter in @ innings",           sym:"r", label:"runs",    start:0, unit:10},
    {title:"Words per sentence in @ sampled sentences",      sym:"w", label:"words",   start:0, unit:5},
    {title:"Books read in a year by @ pupils",               sym:"b", label:"books",   start:0, unit:5}
  ];

  var ALL = ["min","q1","med","q3","max","iqr"];
  var LABELS = {
    min:["Lowest", "min"],
    q1: ["Lower quartile", "Q₁"],
    med:["Median", "Q₂"],
    q3: ["Upper quartile", "Q₃"],
    max:["Highest", "max"],
    iqr:["Interquartile range", "IQR"]
  };

  var state = {
    ctx:null, k:0, tick:10, bounds:[], freqs:[], n:0,
    minOff:0.2, maxOff:0.8, given:{min:0, max:0},
    exact:{}, status:{}, drawn:false,
    showCF:true, showHist:false, mode:"gcse", tolKey:"half",
    unequal:false, discrete:false
  };

  function keys(){ return state.mode === "alevel" ? ALL : ALL.slice(0,5); }

  /* =====================  class boundaries  ===================== */
  function randInt(a,b){ return a + Math.floor(Math.random()*(b-a+1)); }

  function makeBounds(k, unit, start, unequal){
    var mult = [], i;
    for(i=0;i<k;i++) mult.push(1);
    if(unequal){
      mult[0] = 2; mult[k-1] = 2;                  // broad tails, as exam questions use
      // and one wide class near the middle — the one that looks tall on a frequency
      // chart but short once you divide by its width
      var j = Math.max(1, Math.min(k-2, Math.round(k/2) - 1 + randInt(0,1)));
      mult[j] = 2;
      if(k <= 6 && Math.random() < 0.4) mult[0] = 3;
    }
    var b = [start];
    for(i=0;i<k;i++) b.push(b[i] + mult[i]*unit);
    return b;
  }

  // Nominal boundaries are what the table prints; true boundaries are what the
  // mathematics uses. For discrete classes they differ by a half.
  function shift(){ return state.discrete ? -0.5 : 0; }
  function lower(i){ return state.bounds[i] + shift(); }
  function upper(i){ return state.bounds[i+1] + shift(); }
  function widthOf(i){ return state.bounds[i+1] - state.bounds[i]; }
  function dLo(){ return lower(0); }
  function dHi(){ return upper(state.k-1); }
  function nomLo(){ return state.bounds[0]; }
  function nomHi(){ return state.bounds[state.k]; }

  /* =====================  random generation  ===================== */
  function erf(x){                                   // Abramowitz & Stegun 7.1.26
    var s = x < 0 ? -1 : 1; x = Math.abs(x);
    var t = 1/(1+0.3275911*x);
    var y = 1 - (((((1.061405429*t - 1.453152027)*t) + 1.421413741)*t - 0.284496736)*t + 0.254829592)*t*Math.exp(-x*x);
    return s*y;
  }
  function normCdf(x, mu, sd){ return 0.5*(1+erf((x-mu)/(sd*Math.SQRT2))); }

  function generate(){
    var list = state.discrete ? DISCRETE : CONTINUOUS;
    var ctx = list[randInt(0, list.length-1)];
    var k = randInt(6,8), n = randInt(40,60), i;

    state.ctx = ctx; state.k = k; state.tick = ctx.unit;
    state.bounds = makeBounds(k, ctx.unit, ctx.start, state.unequal);

    var a = dLo(), z = dHi();
    var mu = a + (z-a)*(0.42 + Math.random()*0.16);
    var sd = (z-a)*(0.13 + Math.random()*0.08);

    var p = [], tot = 0;
    for(i=0;i<k;i++){
      var c1 = normCdf(lower(i), mu, sd), c2 = normCdf(upper(i), mu, sd);
      p.push(Math.max(c2-c1, 0.0001)); tot += p[i];
    }
    for(i=0;i<k;i++) p[i] /= tot;

    var raw = p.map(function(v){ return v*n; });          // largest-remainder rounding,
    var f = raw.map(Math.floor);                          // so the frequencies total n exactly
    var used = f.reduce(function(s,v){ return s+v; },0);
    var order = raw.map(function(v,idx){ return {idx:idx, rem:v-Math.floor(v)}; })
                   .sort(function(x,y){ return y.rem-x.rem; });
    var j = 0;
    while(used < n){ f[order[j % k].idx]++; used++; j++; }

    for(i=0;i<k;i++){                                     // no empty classes at the outset
      if(f[i] === 0){
        var big = 0;
        for(var m=1;m<k;m++) if(f[m] > f[big]) big = m;
        if(f[big] > 1){ f[big]--; f[i]++; }
      }
    }

    state.freqs = f;
    state.n = f.reduce(function(s,v){ return s+v; },0);
    // Where inside the first and last classes the true extremes sit. Exam questions
    // state these, because grouped data cannot recover them.
    state.minOff = 0.08 + Math.random()*0.34;
    state.maxOff = 0.58 + Math.random()*0.34;
    state.nextOffLo = Math.random();      // where the next non-outlier sits inside the fence
    state.nextOffHi = Math.random();
  }

  /* =====================  the data  ===================== */
  function cumulative(){
    var c = [], run = 0;
    for(var i=0;i<state.freqs.length;i++){ run += state.freqs[i]; c.push(run); }
    return c;
  }
  function firstUsed(){
    for(var i=0;i<state.k;i++) if(state.freqs[i] > 0) return i;
    return 0;
  }
  function lastUsed(){
    for(var i=state.k-1;i>=0;i--) if(state.freqs[i] > 0) return i;
    return state.k-1;
  }

  /* ---- A-level route: linear interpolation (straight-line CF graph) ---- */
  function interpolate(pos){
    var c = cumulative();
    for(var i=0;i<state.k;i++){
      if(c[i] >= pos && state.freqs[i] > 0){
        var before = i === 0 ? 0 : c[i-1];
        return lower(i) + ((pos - before)/state.freqs[i])*widthOf(i);
      }
    }
    return upper(lastUsed());
  }

  /* ---- GCSE route: read off a smooth cumulative frequency curve ---- */
  // Monotone cubic Hermite (Fritsch–Carlson): smooth, as Edexcel expects, but it still
  // passes through every plotted point and never doubles back.
  function knots(){
    var c = cumulative(), fu = firstUsed(), lu = lastUsed();
    var xs = [lower(fu)], ys = [fu === 0 ? 0 : c[fu-1]];
    for(var i=fu;i<=lu;i++){ xs.push(upper(i)); ys.push(c[i]); }
    return {xs:xs, ys:ys};
  }

  function slopes(xs, ys){
    var nk = xs.length, d = [], m = [], i;
    for(i=0;i<nk-1;i++) d.push((ys[i+1]-ys[i])/(xs[i+1]-xs[i]));
    m.push(d[0]);
    for(i=1;i<nk-1;i++) m.push((d[i-1]+d[i])/2);
    m.push(d[nk-2]);
    for(i=0;i<nk-1;i++){
      if(d[i] === 0){ m[i] = 0; m[i+1] = 0; continue; }
      var a = m[i]/d[i], b = m[i+1]/d[i], s = a*a + b*b;
      if(s > 9){ var tau = 3/Math.sqrt(s); m[i] = tau*a*d[i]; m[i+1] = tau*b*d[i]; }
    }
    return m;
  }

  function evalSpline(sp, x){
    var xs = sp.xs, ys = sp.ys, m = sp.m, i = 0;
    if(x <= xs[0]) return ys[0];
    if(x >= xs[xs.length-1]) return ys[ys.length-1];
    while(i < xs.length-2 && x > xs[i+1]) i++;
    var h = xs[i+1]-xs[i], t = (x-xs[i])/h, t2 = t*t, t3 = t2*t;
    return (2*t3-3*t2+1)*ys[i] + (t3-2*t2+t)*h*m[i] + (-2*t3+3*t2)*ys[i+1] + (t3-t2)*h*m[i+1];
  }

  function spline(){
    var kn = knots();
    if(kn.xs.length < 2) return null;
    kn.m = slopes(kn.xs, kn.ys);
    return kn;
  }

  function readOffCurve(pos){                 // invert the smooth curve by bisection
    var sp = spline();
    if(!sp) return lower(firstUsed());
    var xs = sp.xs, ys = sp.ys, i;
    if(pos <= ys[0]) return xs[0];
    if(pos >= ys[ys.length-1]) return xs[xs.length-1];
    for(i=0;i<xs.length-1;i++) if(ys[i+1] >= pos) break;
    var a = xs[i], b = xs[i+1];
    for(var it=0; it<48; it++){
      var mid = (a+b)/2;
      if(evalSpline(sp, mid) < pos) a = mid; else b = mid;
    }
    return (a+b)/2;
  }

  function computeStats(){
    state.n = state.freqs.reduce(function(s,v){ return s+v; },0);
    var n = state.n, fu = firstUsed(), lu = lastUsed();

    // Stated extremes: whole values inside the first and last occupied classes.
    var mn = Math.round(state.bounds[fu]   + state.minOff*widthOf(fu));
    var mx = Math.round(state.bounds[lu]   + state.maxOff*widthOf(lu));
    var mnHi = state.discrete ? state.bounds[fu+1]-1 : state.bounds[fu+1];
    var mxHi = state.discrete ? state.bounds[lu+1]-1 : state.bounds[lu+1];
    mn = Math.max(state.bounds[fu], Math.min(mn, mnHi));
    mx = Math.max(state.bounds[lu], Math.min(mx, mxHi));
    if(mx <= mn) mx = mn + 1;
    state.given.min = mn; state.given.max = mx;

    var q = state.mode === "gcse" ? readOffCurve : interpolate;
    var q1 = q(n/4), q3 = q(3*n/4);
    state.exact = { min:mn, q1:q1, med:q(n/2), q3:q3, max:mx, iqr:q3-q1 };

    // When an extreme is an outlier the question also states the next value in,
    // so the whisker can be drawn to a real observation rather than to the fence.
    state.next = { low:null, high:null };
    if(state.mode === "alevel"){
      var iqr = q3 - q1, fl = q1 - 1.5*iqr, fh = q3 + 1.5*iqr, raw, v;
      // A whole number where one fits between the fence and the quartile; otherwise
      // the exact value, so the stated figure is never itself an outlier.
      if(mn < fl){
        raw = Math.min(Math.max(fl + state.nextOffLo*0.28*iqr, fl), q1);
        v = Math.round(raw);
        state.next.low = (v >= fl && v <= q1) ? v : raw;
      }
      if(mx > fh){
        raw = Math.max(Math.min(fh - state.nextOffHi*0.28*iqr, fh), q3);
        v = Math.round(raw);
        state.next.high = (v <= fh && v >= q3) ? v : raw;
      }
    }
  }

  // A-level only: Q1 − 1.5 × IQR and Q3 + 1.5 × IQR
  function fences(){
    var iqr = state.exact.q3 - state.exact.q1;
    return { lo: state.exact.q1 - 1.5*iqr, hi: state.exact.q3 + 1.5*iqr };
  }
  function outliers(){
    if(state.mode !== "alevel") return {low:false, high:false, f:null};
    var f = fences();
    return { low: state.exact.min < f.lo, high: state.exact.max > f.hi, f:f };
  }

  function tolerance(){
    if(state.tolKey === "dp")  return 0.05;
    if(state.tolKey === "one") return state.tick/10;
    return state.tick/20;                              // half a small square
  }

  function fmt(v){
    var r = Math.round(v*10)/10;
    return (Math.abs(r - Math.round(r)) < 1e-9) ? String(Math.round(r)) : r.toFixed(1);
  }

  /* =====================  table  ===================== */
  var tbody = document.getElementById("tbody");
  function classLabel(i){
    if(state.discrete) return state.bounds[i] + " – " + (state.bounds[i+1]-1);
    return state.bounds[i] + " ≤ " + state.ctx.sym + " < " + state.bounds[i+1];
  }

  function renderTable(){
    var c = cumulative();
    tbody.innerHTML = "";
    for(var i=0;i<state.k;i++){
      var tr = document.createElement("tr");

      var td1 = document.createElement("td");
      td1.className = "cls";
      td1.textContent = classLabel(i);

      var tdw = document.createElement("td");
      tdw.className = "wd wcol";
      tdw.textContent = widthOf(i);

      var td2 = document.createElement("td");
      td2.className = "freq";
      var inp = document.createElement("input");
      inp.className = "f";
      inp.type = "number"; inp.min = "0"; inp.max = "40"; inp.step = "1";
      inp.value = state.freqs[i];
      inp.setAttribute("aria-label", "Frequency for " + classLabel(i));
      inp.dataset.i = i;
      inp.addEventListener("input", onFreqInput);
      td2.appendChild(inp);

      var td3 = document.createElement("td");
      td3.className = "cf";
      td3.textContent = c[i];

      tr.appendChild(td1); tr.appendChild(tdw); tr.appendChild(td2); tr.appendChild(td3);
      tbody.appendChild(tr);
    }
    document.getElementById("classHead").textContent =
      state.ctx.label.charAt(0).toUpperCase() + state.ctx.label.slice(1);

    var bits = [];
    if(state.unequal) bits.push("Unequal class widths.");
    if(state.discrete) bits.push("Discrete data — the class boundaries are at "
      + fmt(lower(0)) + ", " + fmt(upper(0)) + ", …");
    bits.push("The frequencies stay editable; every diagram follows.");
    document.getElementById("tableNote").textContent = bits.join(" ");
    refreshTotals();
  }

  function refreshTotals(){
    var c = cumulative(), rows = tbody.querySelectorAll("tr");
    for(var i=0;i<rows.length;i++) rows[i].children[3].textContent = c[i];
    document.getElementById("totalCell").textContent = state.n;
    document.getElementById("nLine").textContent = state.n;
    document.getElementById("tableCaption").textContent = state.ctx.title.replace("@", state.n);

    var html = "The smallest value was <b>" + state.given.min + "</b> " + state.ctx.label +
               " and the largest was <b>" + state.given.max + "</b> " + state.ctx.label + ".";
    if(state.mode === "alevel"){
      var extra = [];
      if(state.next && state.next.low !== null)
        extra.push("The next smallest value was <b>" + fmt(state.next.low) + "</b> " + state.ctx.label + ".");
      if(state.next && state.next.high !== null)
        extra.push("The next largest value was <b>" + fmt(state.next.high) + "</b> " + state.ctx.label + ".");
      if(extra.length) html += " " + extra.join(" ");
      html += "<span class='rule'>An outlier is a value less than " +
              "<b>Q₁ − 1.5 × IQR</b> or greater than <b>Q₃ + 1.5 × IQR</b>.</span>";
    }
    document.getElementById("givenLine").innerHTML = html;
  }

  function onFreqInput(e){
    var i = +e.target.dataset.i;
    var v = parseInt(e.target.value, 10);
    if(isNaN(v) || v < 0) v = 0;
    if(v > 40) v = 40;
    state.freqs[i] = v;
    computeStats();
    refreshTotals();
    keys().forEach(function(key){                     // demonstration mode: the values
      var box = document.getElementById("in-" + key);  // refill with the new correct answers
      box.value = fmt(state.exact[key]);
      setStatus(key, "revealed");
    });
    updateGate();
    draw();
    setMessage("Table edited — diagrams updated.", "good");
  }

  /* =====================  answer boxes  ===================== */
  var answers = document.getElementById("answers");

  function buildAnswers(){
    answers.innerHTML = "";
    ALL.forEach(function(key){
      var wrap = document.createElement("div");
      wrap.className = "ansbox" + (key === "iqr" ? " iqr" : "");

      var lab = document.createElement("label");
      lab.setAttribute("for", "in-" + key);
      lab.innerHTML = LABELS[key][0] + " <b>" + LABELS[key][1] + "</b>";

      var inp = document.createElement("input");
      inp.className = "a";
      inp.id = "in-" + key;
      inp.type = "text"; inp.inputMode = "decimal"; inp.autocomplete = "off";
      inp.addEventListener("input", function(){ mark(key, false); });
      inp.addEventListener("blur",  function(){ mark(key, true); });
      inp.addEventListener("keydown", function(ev){
        if(ev.key === "Enter"){ mark(key, true); inp.blur(); }
      });

      wrap.appendChild(lab); wrap.appendChild(inp);
      answers.appendChild(wrap);
      state.status[key] = "empty";
    });
  }

  function setStatus(key, s){
    state.status[key] = s;
    var node = document.getElementById("in-" + key);
    node.classList.remove("correct","wrong","revealed");
    if(s !== "empty") node.classList.add(s);
  }

  function mark(key, onBlur){        // green as soon as it is right; red only on leaving the box
    var node = document.getElementById("in-" + key);
    var txt = node.value.trim();
    if(txt === ""){ setStatus(key, "empty"); updateGate(); return; }
    var v = parseFloat(txt);
    if(isNaN(v)){ if(onBlur) setStatus(key, "wrong"); updateGate(); return; }
    // Stated extremes must be copied exactly; readings allow the chosen tolerance,
    // and the IQR twice that, since it is the difference of two of them.
    var tol = (key === "min" || key === "max") ? 1e-9
            : (key === "iqr" ? 2*tolerance() : tolerance());
    if(Math.abs(v - state.exact[key]) <= tol + 1e-9) setStatus(key, "correct");
    else if(onBlur) setStatus(key, "wrong");
    else setStatus(key, "empty");
    updateGate();
  }

  function remarkAll(){
    keys().forEach(function(key){ if(state.status[key] !== "revealed") mark(key, true); });
  }

  function updateGate(){
    var ok = keys().every(function(k){
      return state.status[k] === "correct" || state.status[k] === "revealed";
    });
    document.getElementById("drawBtn").disabled = !ok;
    if(ok && !state.drawn) setMessage("All correct — now draw it.", "good");
  }

  function setMessage(text, cls){
    var s = document.getElementById("status");
    s.textContent = text || "";
    s.className = "status" + (cls ? " " + cls : "");
  }

  /* =====================  shared horizontal scale  ===================== */
  var PL = 145, PR = 952;   // left margin clears the rotated axis titles
  function X(v){
    var a = dLo() - state.tick/2, b = dHi() + state.tick/2;
    return PL + (v - a)/(b - a)*(PR - PL);
  }
  function tickCount(){ return Math.round((nomHi() - nomLo())/state.tick); }

  var SVGNS = "http://www.w3.org/2000/svg";
  function el(name, attrs, text){
    var e = document.createElementNS(SVGNS, name);
    for(var k in attrs) e.setAttribute(k, attrs[k]);
    if(text !== undefined) e.textContent = text;
    return e;
  }

  // Every diagram carries its own numbered axis, so each can be read on its own —
  // and they still line up, sharing the scale down the column.
  function xAxis(g, baseY){
    var nT = tickCount();
    for(var i=0;i<=nT;i++){
      var v = nomLo() + i*state.tick;
      g.appendChild(el("line", {x1:X(v), y1:baseY, x2:X(v), y2:baseY+10, stroke:"#1B3A5C", "stroke-width":2.5}));
      g.appendChild(el("text", {x:X(v), y:baseY+37, "text-anchor":"middle", class:"tick"}, String(v)));
    }
    g.appendChild(el("text", {
      x:(PL+PR)/2, y:baseY+72, "text-anchor":"middle", class:"axlabel"
    }, state.ctx.sym + "  (" + state.ctx.label + ")"));
  }

  /* =====================  box plot  ===================== */
  var boxSvg = document.getElementById("boxSvg");
  var AXIS_Y = 192, BOX_TOP = 72, BOX_BOT = 148, MID = 110;

  function cross(g, x, y){
    var r = 13;
    g.appendChild(el("line", {x1:x-r, y1:y-r, x2:x+r, y2:y+r, stroke:"#B44F35", "stroke-width":4}));
    g.appendChild(el("line", {x1:x-r, y1:y+r, x2:x+r, y2:y-r, stroke:"#B44F35", "stroke-width":4}));
  }

  function drawBoxPlot(){
    boxSvg.innerHTML = "";
    var g = el("g", {});

    if((state.showCF || state.showHist) && state.drawn){
      ["q1","med","q3"].forEach(function(key){
        g.appendChild(el("line", {
          x1:X(state.exact[key]), y1:0, x2:X(state.exact[key]), y2:AXIS_Y,
          stroke:"#A9760A", "stroke-width":1.6, "stroke-dasharray":"6 6", opacity:".5"
        }));
      });
    }

    if(state.drawn){
      var e = state.exact, o = outliers();
      // Whiskers stop at the most extreme value that is not an outlier — the value
      // the question states when an extreme fails the rule.
      var lEnd = o.low  ? state.next.low  : e.min;
      var rEnd = o.high ? state.next.high : e.max;

      g.appendChild(el("rect", {
        x:X(e.q1), y:BOX_TOP, width:Math.max(X(e.q3)-X(e.q1), 1), height:BOX_BOT-BOX_TOP,
        fill:"#E2F0ED", stroke:"#0C6F62", "stroke-width":3
      }));
      g.appendChild(el("line", {x1:X(lEnd), y1:MID, x2:X(e.q1), y2:MID, stroke:"#0C6F62", "stroke-width":3}));
      g.appendChild(el("line", {x1:X(e.q3), y1:MID, x2:X(rEnd), y2:MID, stroke:"#0C6F62", "stroke-width":3}));
      g.appendChild(el("line", {x1:X(lEnd), y1:BOX_TOP+10, x2:X(lEnd), y2:BOX_BOT-10, stroke:"#0C6F62", "stroke-width":3}));
      g.appendChild(el("line", {x1:X(rEnd), y1:BOX_TOP+10, x2:X(rEnd), y2:BOX_BOT-10, stroke:"#0C6F62", "stroke-width":3}));
      g.appendChild(el("line", {x1:X(e.med), y1:BOX_TOP, x2:X(e.med), y2:BOX_BOT, stroke:"#B44F35", "stroke-width":4}));

      [["q1",e.q1],["med",e.med],["q3",e.q3],["l",lEnd],["r",rEnd]].forEach(function(p){
        g.appendChild(el("text", {
          x:X(p[1]), y:BOX_TOP-13, "text-anchor":"middle", class:"vallabel",
          fill: p[0] === "med" ? "#B44F35" : "#0C6F62"
        }, fmt(p[1])));
      });

      if(o.low){
        cross(g, X(e.min), MID);
        g.appendChild(el("text", {x:X(e.min), y:BOX_BOT+30, "text-anchor":"middle",
          class:"vallabel", fill:"#B44F35"}, fmt(e.min)));
      }
      if(o.high){
        cross(g, X(e.max), MID);
        g.appendChild(el("text", {x:X(e.max), y:BOX_BOT+30, "text-anchor":"middle",
          class:"vallabel", fill:"#B44F35"}, fmt(e.max)));
      }
      if(o.low || o.high){
        g.appendChild(el("text", {x:PL, y:26, class:"tick", fill:"#B44F35"},
          "× outlier — whisker drawn to the next value that is not an outlier"));
      }
    } else {
      g.appendChild(el("text", {
        x:(PL+PR)/2, y:MID+10, "text-anchor":"middle", class:"placeholder"
      }, "The box plot will be drawn here."));
    }

    g.appendChild(el("line", {x1:PL-16, y1:AXIS_Y, x2:PR+16, y2:AXIS_Y, stroke:"#1B3A5C", "stroke-width":2.5}));
    xAxis(g, AXIS_Y);
    boxSvg.appendChild(g);
  }

  /* =====================  histogram: frequency density  ===================== */
  var histSvg = document.getElementById("histSvg");
  var H_TOP = 34, H_BOT = 240;

  function niceStep(max){
    var steps = [0.01,0.02,0.025,0.05,0.1,0.2,0.25,0.5,1,2,2.5,5,10,20,25,50,100];
    for(var i=0;i<steps.length;i++){ if(max/steps[i] <= 6) return steps[i]; }
    return 200;
  }

  function drawHist(){
    histSvg.innerHTML = "";
    var g = el("g", {}), i, j;
    var dens = state.freqs.map(function(f, idx){ return f/widthOf(idx); });
    var maxD = Math.max.apply(null, dens.concat([0.0001]));
    var step = niceStep(maxD);
    var yMax = Math.max(Math.ceil(maxD/step)*step, step);
    function Y(v){ return H_BOT - (v/yMax)*(H_BOT-H_TOP); }

    for(j=0; j*step <= yMax + 1e-9; j++){
      var yv = j*step;
      g.appendChild(el("line", {x1:PL, y1:Y(yv), x2:PR, y2:Y(yv), stroke:"#E2EAF0", "stroke-width":1.5}));
      g.appendChild(el("line", {x1:PL-10, y1:Y(yv), x2:PL, y2:Y(yv), stroke:"#1B3A5C", "stroke-width":2.5}));
      g.appendChild(el("text", {x:PL-16, y:Y(yv)+9, "text-anchor":"end", class:"tick"},
                     String(Math.round(yv*1000)/1000)));
    }

    for(i=0;i<state.k;i++){
      if(state.freqs[i] <= 0) continue;
      var top = Y(dens[i]), h = H_BOT - top, mx = (X(lower(i))+X(upper(i)))/2;
      g.appendChild(el("rect", {
        x:X(lower(i)), y:top, width:Math.max(X(upper(i))-X(lower(i)), 1), height:h,
        fill:"#CBDBE9", stroke:"#1B3A5C", "stroke-width":2.5
      }));
      g.appendChild(el("text", {
        x:mx, y:top-11, "text-anchor":"middle", class:"tick", fill:"#1B3A5C"
      }, String(Math.round(dens[i]*100)/100)));
      if(h > 46){                                   // area = frequency, so name it inside the bar
        g.appendChild(el("text", {
          x:mx, y:top+34, "text-anchor":"middle", class:"tick", fill:"#1B3A5C"
        }, "f = " + state.freqs[i]));
      }
    }

    if(state.drawn){
      [["q1","#A9760A"],["med","#B44F35"],["q3","#A9760A"]].forEach(function(t){
        g.appendChild(el("line", {
          x1:X(state.exact[t[0]]), y1:H_TOP-10, x2:X(state.exact[t[0]]), y2:H_BOT,
          stroke:t[1], "stroke-width":2.5, "stroke-dasharray":"6 6", opacity:".85"
        }));
      });
    }

    g.appendChild(el("line", {x1:PL, y1:H_TOP-10, x2:PL, y2:H_BOT, stroke:"#1B3A5C", "stroke-width":2.5}));
    g.appendChild(el("line", {x1:PL, y1:H_BOT, x2:PR+16, y2:H_BOT, stroke:"#1B3A5C", "stroke-width":2.5}));
    xAxis(g, H_BOT);
    g.appendChild(el("text", {
      x:22, y:(H_TOP+H_BOT)/2, "text-anchor":"middle", class:"axlabel",
      transform:"rotate(-90 22 " + ((H_TOP+H_BOT)/2) + ")"
    }, "Frequency density"));

    histSvg.appendChild(g);
  }

  /* =====================  cumulative frequency graph  ===================== */
  var cfSvg = document.getElementById("cfSvg");
  var CF_TOP = 34, CF_BOT = 250;

  function drawCF(){
    cfSvg.innerHTML = "";
    var g = el("g", {});
    var n = state.n, i;
    function Y(v){ return n > 0 ? CF_BOT - (v/n)*(CF_BOT-CF_TOP) : CF_BOT; }

    // graph paper: ten small squares to one axis step, so half a square is tick/20
    var sm = state.tick/10, nT = tickCount();
    for(i=0;i<=nT*10;i++){
      var xv = nomLo() + i*sm, major = (i % 10 === 0);
      g.appendChild(el("line", {
        x1:X(xv), y1:CF_TOP-10, x2:X(xv), y2:CF_BOT,
        stroke: major ? "#D3E0EA" : "#EDF2F6", "stroke-width": major ? 1.6 : 1
      }));
    }
    for(i=0;i<=n;i+=2){
      g.appendChild(el("line", {
        x1:X(nomLo()), y1:Y(i), x2:X(nomHi()), y2:Y(i),
        stroke: (i % 10 === 0) ? "#D3E0EA" : "#EDF2F6", "stroke-width": (i % 10 === 0) ? 1.6 : 1
      }));
    }

    g.appendChild(el("line", {x1:PL, y1:CF_TOP-10, x2:PL, y2:CF_BOT, stroke:"#1B3A5C", "stroke-width":2.5}));
    g.appendChild(el("line", {x1:PL, y1:CF_BOT, x2:PR+16, y2:CF_BOT, stroke:"#1B3A5C", "stroke-width":2.5}));
    xAxis(g, CF_BOT);

    [0, 0.25, 0.5, 0.75, 1].forEach(function(p){
      var v = p*n;
      g.appendChild(el("line", {x1:PL-10, y1:Y(v), x2:PL, y2:Y(v), stroke:"#1B3A5C", "stroke-width":2.5}));
      g.appendChild(el("text", {x:PL-16, y:Y(v)+9, "text-anchor":"end", class:"tick"}, fmt(v)));
    });
    g.appendChild(el("text", {
      x:22, y:(CF_TOP+CF_BOT)/2, "text-anchor":"middle", class:"axlabel",
      transform:"rotate(-90 22 " + ((CF_TOP+CF_BOT)/2) + ")"
    }, "Cumulative frequency"));

    [["q1",0.25,"n÷4"],["med",0.5,"n÷2"],["q3",0.75,"3n÷4"]].forEach(function(t){
      var v = state.exact[t[0]], h = t[1]*n;
      g.appendChild(el("line", {x1:PL, y1:Y(h), x2:X(v), y2:Y(h), stroke:"#A9760A", "stroke-width":2, "stroke-dasharray":"6 6"}));
      g.appendChild(el("line", {x1:X(v), y1:Y(h), x2:X(v), y2:CF_BOT, stroke:"#A9760A", "stroke-width":2, "stroke-dasharray":"6 6"}));
      g.appendChild(el("text", {x:PL+10, y:Y(h)-10, class:"conlabel"}, t[2] + " = " + fmt(h)));
    });

    // GCSE: a smooth curve through the points. A-level: the straight-line graph that
    // linear interpolation actually assumes.
    var sp = spline(), d = "", pts = [];
    if(sp){
      if(state.mode === "gcse"){
        var x0 = sp.xs[0], x1 = sp.xs[sp.xs.length-1], steps = 240;
        for(i=0;i<=steps;i++){
          var xx = x0 + (x1-x0)*i/steps;
          d += (i ? "L" : "M") + X(xx) + " " + Y(evalSpline(sp, xx));
        }
      } else {
        d = sp.xs.map(function(xv2, idx){ return (idx?"L":"M") + X(xv2) + " " + Y(sp.ys[idx]); }).join(" ");
      }
      for(i=0;i<sp.xs.length;i++) pts.push([sp.xs[i], sp.ys[i]]);
    }
    g.appendChild(el("path", {d:d, fill:"none", stroke:"#1B3A5C", "stroke-width":3, "stroke-linejoin":"round"}));
    pts.forEach(function(p){
      g.appendChild(el("circle", {cx:X(p[0]), cy:Y(p[1]), r:5, fill:"#FFFFFF", stroke:"#1B3A5C", "stroke-width":2.5}));
    });

    cfSvg.appendChild(g);
  }

  function draw(){
    computeStats();
    drawBoxPlot();
    if(state.showHist) drawHist();
    if(state.showCF) drawCF();
  }

  /* =====================  modes and controls  ===================== */
  function applyMode(){
    var gcse = state.mode === "gcse";
    document.body.classList.toggle("alevel", !gcse);
    document.getElementById("gcseBtn").setAttribute("aria-pressed", gcse ? "true" : "false");
    document.getElementById("alevBtn").setAttribute("aria-pressed", gcse ? "false" : "true");
    document.getElementById("modeNote").textContent = gcse
      ? "GCSE method: read the median and quartiles off the cumulative frequency curve at n÷4, n÷2 and 3n÷4."
      : "A-level method: linear interpolation at n÷4, n÷2 and 3n÷4, then test the extremes against the outlier rule.";
    state.showCF = gcse;
    document.getElementById("cfWrap").hidden = !state.showCF;
    var cfBtn = document.getElementById("cfBtn");
    cfBtn.textContent = state.showCF ? "Hide CF graph" : "Show CF graph";
    cfBtn.classList.toggle("on", state.showCF);
    state.tolKey = gcse ? "half" : "dp";
    document.getElementById("tolSel").value = state.tolKey;
    computeStats();
    refreshTotals();
    remarkAll();
    updateGate();
    draw();
  }

  document.getElementById("gcseBtn").addEventListener("click", function(){
    if(state.mode === "gcse") return;
    state.mode = "gcse"; applyMode();
    setMessage("GCSE method — reading off the curve.", "");
  });
  document.getElementById("alevBtn").addEventListener("click", function(){
    if(state.mode === "alevel") return;
    state.mode = "alevel"; applyMode();
    setMessage("A-level method — interpolation, with outliers.", "");
  });

  document.getElementById("drawBtn").addEventListener("click", function(){
    state.drawn = true;
    document.getElementById("chartHint").textContent = "edit any frequency and watch it move";
    draw();
    var o = outliers();
    if(o.low || o.high){
      setMessage("Box plot drawn — " + ((o.low && o.high) ? "both extremes are" :
                 "one extreme is") + " an outlier.", "warn");
    } else {
      setMessage("Box plot drawn.", "good");
    }
  });

  document.getElementById("revealBtn").addEventListener("click", function(){
    keys().forEach(function(key){
      document.getElementById("in-" + key).value = fmt(state.exact[key]);
      setStatus(key, "revealed");
    });
    updateGate();
    setMessage("Answers revealed.", "");
  });

  document.getElementById("histBtn").addEventListener("click", function(){
    state.showHist = !state.showHist;
    document.getElementById("histWrap").hidden = !state.showHist;
    this.textContent = state.showHist ? "Hide histogram" : "Show histogram";
    this.classList.toggle("on", state.showHist);
    draw();
  });

  document.getElementById("cfBtn").addEventListener("click", function(){
    state.showCF = !state.showCF;
    document.getElementById("cfWrap").hidden = !state.showCF;
    this.textContent = state.showCF ? "Hide CF graph" : "Show CF graph";
    this.classList.toggle("on", state.showCF);
    draw();
  });

  document.getElementById("widthBtn").addEventListener("click", function(){
    state.unequal = !state.unequal;
    this.textContent = state.unequal ? "Equal classes" : "Unequal classes";
    this.classList.toggle("on", state.unequal);
    document.body.classList.toggle("unequal", state.unequal);
    reset();
    setMessage(state.unequal ? "Unequal class widths." : "Equal class widths.", "");
  });

  document.getElementById("discBtn").addEventListener("click", function(){
    state.discrete = !state.discrete;
    this.textContent = state.discrete ? "Continuous data" : "Discrete data";
    this.classList.toggle("on", state.discrete);
    reset();
    setMessage(state.discrete
      ? "Discrete classes — interpolate across the true boundaries."
      : "Continuous classes.", "");
  });

  document.getElementById("tolSel").addEventListener("change", function(){
    state.tolKey = this.value;
    remarkAll();
  });

  document.getElementById("newBtn").addEventListener("click", function(){ reset(); });

  function reset(){
    generate();
    computeStats();
    renderTable();
    ALL.forEach(function(key){
      document.getElementById("in-" + key).value = "";
      setStatus(key, "empty");
    });
    state.drawn = false;
    document.getElementById("chartHint").textContent = "fill in the values, then draw";
    updateGate();
    draw();
    setMessage("", "");
  }

  buildAnswers();
  generate();
  computeStats();
  renderTable();
  applyMode();
  reset();
})();
</script>

</body>
</html>
