  const center = [bestPoint[0]+dir[0]*targetDist, bestPoint[1]+dir[1]*targetDist];
  return {center, angle: roadAngle, roadPoint: bestPoint, roadDist: bestDist};
}

/* Same idea as frontOntoRoad, but generalised to front onto whichever
   obstacle in a given list is nearest — alleys included — rather than only
   real roads. Used for the industry-low second pass, which is explicitly
   meant to front onto alleyways or any other nearby infrastructure once the
   first pass's own alleys already exist as options. */
function frontOntoAnyBoundary(candidateCenter, w, h, clearance, obstacles){
  let best = null, bestDist = Infinity;
  obstacles.forEach(ob=>{
    const hit = distToPolyline(candidateCenter, ob.points);
    if(hit.dist < bestDist){ bestDist = hit.dist; best = {point:hit.point, seg:hit.seg, halfWidth:ob.halfWidth}; }
  });
  if(!best) return null;
  const boundaryAngle = Math.atan2(best.seg[1][1]-best.seg[0][1], best.seg[1][0]-best.seg[0][0]);
  let dir = [candidateCenter[0]-best.point[0], candidateCenter[1]-best.point[1]];
  const dlen = Math.hypot(dir[0],dir[1]) || 1;
  dir = [dir[0]/dlen, dir[1]/dlen];
  const halfExtent = projectedHalfExtent(w,h,boundaryAngle,dir);
  const targetDist = best.halfWidth + clearance + halfExtent;
  const center = [best.point[0]+dir[0]*targetDist, best.point[1]+dir[1]*targetDist];
  return {center, angle: boundaryAngle, boundaryPoint: best.point, boundaryDist: bestDist};
}

function polygonArea(pts){
  let a=0;
  for(let i=0;i<pts.length;i++){
    const p1=pts[i], p2=pts[(i+1)%pts.length];
    a += p1[0]*p2[1]-p2[0]*p1[1];
  }
  return Math.abs(a)/2;
}

/* Finds a plain rectangular footprint that fits whatever space is actually
   free — inside the zone polygon and clear of every obstacle — by
   rasterising a small local grid (aligned to the candidate's own angle) and
   greedily growing the largest all-clear rectangle out from its centre.
   Used whenever the full-size rectangle doesn't fit, so boundary plots still
   get a real, genuinely rectangular building — smaller than ideal, not an
   irregular jagged shape — rather than being skipped or left with a
   staircase edge from the raster grid. */
function clipRectFootprint(center, w, h, angle, zonePoints, obstacles, cellSize){
  cellSize = cellSize || 2;
  const cosA = Math.cos(angle), sinA = Math.sin(angle); // local (u,v) -> world
  const halfW = w/2 + cellSize, halfH = h/2 + cellSize;
  const cols = Math.max(1, Math.round((halfW*2)/cellSize));
  const rows = Math.max(1, Math.round((halfH*2)/cellSize));
  if(cols*rows > 20000) return null; // safety cap; shouldn't happen at building scale
  const mask = new Uint8Array(cols*rows);
  const idx = (x,y)=>y*cols+x;
  let filled = 0;
  for(let gy=0; gy<rows; gy++){
    for(let gx=0; gx<cols; gx++){
      const lu = -halfW + (gx+0.5)*cellSize, lv = -halfH + (gy+0.5)*cellSize;
      if(Math.abs(lu) > w/2 || Math.abs(lv) > h/2) continue; // stay within the original candidate
      const wx = center[0] + lu*cosA - lv*sinA;
      const wy = center[1] + lu*sinA + lv*cosA;
      if(!pointInPoly([wx,wy], zonePoints)) continue;
      let blocked = false;
      for(const ob of obstacles){
        if(distToPolyline([wx,wy], ob.points).dist <= ob.halfWidth){ blocked=true; break; }
      }
      if(blocked) continue;
      mask[idx(gx,gy)] = 1;
      filled++;
    }
  }
  const minCells = Math.max(4, (w*h*0.2)/(cellSize*cellSize));
  if(filled < minCells) return null;

  const rect = largestRectNearCentre(mask, cols, rows);
  if(!rect) return null;
  const rw = rect.w*cellSize, rh = rect.h*cellSize;
  if(rw < w*0.22 || rh < h*0.22) return null; // too sliver-thin to bother with

  const ru0 = -halfW + rect.x*cellSize, rv0 = -halfH + rect.y*cellSize;
  const ruC = ru0 + rw/2, rvC = rv0 + rh/2;
  return {
    center: [center[0] + ruC*cosA - rvC*sinA, center[1] + ruC*sinA + rvC*cosA],
    w: rw, h: rh
  };
}
/* Greedily grows the largest all-filled axis-aligned rectangle outward from
   the grid's centre cell (spiralling out to the nearest filled cell first if
   the centre itself is blocked), expanding whichever side is still valid one
   step at a time until none can grow further. Not guaranteed globally
   maximal, but simple, fast, and reliably rectangular. */
function largestRectNearCentre(mask, cols, rows){
  const idx = (x,y)=>y*cols+x;
  const cx = Math.floor(cols/2), cy = Math.floor(rows/2);
  let startX=cx, startY=cy;
  if(!mask[idx(cx,cy)]){
    let found = null;
    const maxR = Math.max(cols,rows);
    outer:
    for(let r=1; r<maxR; r++){
      for(let dx=-r; dx<=r; dx++){
        for(let dy=-r; dy<=r; dy++){
          if(Math.max(Math.abs(dx),Math.abs(dy)) !== r) continue;
          const x=cx+dx, y=cy+dy;
          if(x<0||y<0||x>=cols||y>=rows) continue;
          if(mask[idx(x,y)]){ found=[x,y]; break outer; }
        }
      }
    }
    if(!found) return null;
    startX=found[0]; startY=found[1];
  }
  let left=startX, right=startX, top=startY, bottom=startY;
  let expanded = true;
  while(expanded){
    expanded = false;
    if(left>0){
      let ok=true;
      for(let y=top;y<=bottom;y++) if(!mask[idx(left-1,y)]){ ok=false; break; }
      if(ok){ left--; expanded=true; }
    }
    if(right<cols-1){
      let ok=true;
      for(let y=top;y<=bottom;y++) if(!mask[idx(right+1,y)]){ ok=false; break; }
      if(ok){ right++; expanded=true; }
    }
    if(top>0){
      let ok=true;
      for(let x=left;x<=right;x++) if(!mask[idx(x,top-1)]){ ok=false; break; }
      if(ok){ top--; expanded=true; }
    }
    if(bottom<rows-1){
      let ok=true;
      for(let x=left;x<=right;x++) if(!mask[idx(x,bottom+1)]){ ok=false; break; }
      if(ok){ bottom++; expanded=true; }
    }
  }
  return {x:left, y:top, w:right-left+1, h:bottom-top+1};
}

function runAutofillCore(zone){
  if(zone.houseSize==='rowhouse'){
    autofillZoneRowhouse(zone);
  } else if(zone.houseSize==='townhouse'){
    autofillZoneTownhouse(zone);
  } else if(zone.houseSize==='mansion'){
    autofillZoneMansion(zone);
  } else if(zone.houseSize==='hovel'){
    autofillZoneHovel(zone);
  } else if(zone.houseSize==='industry'){
    if(zone.density==='low'){
      autofillZoneIndustryLow(zone);
    } else if(zone.density==='medium'){
      autofillZoneIndustryMedium(zone);
    } else if(zone.density==='high'){
      autofillZoneIndustryHeavy(zone);
    } else {
      autofillZoneIndustry(zone);
    }
  } else {
    autofillZoneGrid(zone);
  }
}
function autofillZone(zone){
  if(!zone.houseSize || !zone.density) { setStatus('Set house size & density for this zone first.'); return; }
  pushUndo();
  runAutofillCore(zone);
  setStatus('Autofilled '+zone.buildings.length+' buildings in zone.');
  renderAll();
}
function autofillAll(){
  pushUndo();
  state.zones.forEach(z=> {
    if(z.houseSize && z.density) runAutofillCore(z);
  });
  renderAll();
}

/* Grid fill — used for hovel zones: a regular grid across the
   whole zone interior, oriented to the nearest road. */
function autofillZoneGrid(zone){
  removeZoneAlleys(zone.id);
  removeZoneWalls(zone.id);
  const spec = HOUSE_SPECS[zone.houseSize];
  const gap = DENSITY_GAP[zone.density];
  const angle = nearestRoadAngle(zone);
  const obstacles = buildObstacles();
  zone.buildings = gridFillPolygon(zone.points, spec, gap, obstacles, zone.id, zone.houseSize, angle);
}

/* Dense grid fill over an arbitrary polygon, oriented at `angle`. Shrinks
   each cell down to a 50% floor to clear the boundary/obstacles, and falls
   back to a raster-clipped irregular footprint for cells that don't fit even
   then, so there's no unfilled gap purely because a plain rectangle didn't
   line up. Reused both for hovel/mansion zones (the whole zone) and for the
   interior of rowhouse/townhouse zones (whatever's left behind the front
   ring) — adjacent rows naturally back onto each other across the density
   gap, i.e. each house fronts one row and backs onto the next. */
function gridFillPolygon(polyPoints, spec, gap, obstacles, seedId, houseSize, angle){
  angle = angle || 0;
  const c = centroid(polyPoints);
  const rotated = polyPoints.map(p=>rotatePoint(p, c, -angle));
  const bb = bbox(rotated);
  const stepW = spec.w + gap, stepH = spec.h + gap;
  const CLEARANCE = 5;
  const MIN_SCALE = Math.sqrt(0.5);
  const buildings = [];
  const rnd = mulberry32(seedFor(seedId,'grid'));
  let row = 0;
  for(let y = bb.miny + stepH/2; y < bb.maxy; y += stepH){
    let colOffset = (row % 2 === 1) ? stepW/2 : 0;
    row++;
    for(let x = bb.minx + stepW/2 + colOffset; x < bb.maxx; x += stepW){
      const worldCenter = rotatePoint([x,y], c, angle);
      let placed = null;
      for(let sc=1.0; sc>=MIN_SCALE-1e-6; sc-=0.06){
        const w = spec.w*sc, h = spec.h*sc;
        const samples = rectSamplePoints(worldCenter, w, h, angle);
        if(!samples.every(pt=>pointInPoly(pt, polyPoints))) continue;
        if(minMarginForCorners(samples, obstacles) < 0) continue;
        placed = {center:worldCenter, w, h};
        break;
      }
      if(placed){
        const flushCenter = tryFlushAlign(placed.center, placed.w, placed.h, angle, obstacles, CLEARANCE);
        let finalCenter = placed.center;
        if(flushCenter){
          const samples2 = rectSamplePoints(flushCenter, placed.w, placed.h, angle);
          if(samples2.every(pt=>pointInPoly(pt, polyPoints)) && minMarginForCorners(samples2, obstacles) >= 0){
            finalCenter = flushCenter;
          }
        }
        buildings.push({
          cx: finalCenter[0], cy: finalCenter[1], w: placed.w, h: placed.h, angle, houseSize,
          seed: seedFor(seedId, 'b'+buildings.length), hatchVariant: rnd() > 0.5 ? 0 : 1
        });
      } else {
        const clipped = clipRectFootprint(worldCenter, spec.w, spec.h, angle, polyPoints, obstacles);
        if(clipped){
          buildings.push({
            cx:clipped.center[0], cy:clipped.center[1], w:clipped.w, h:clipped.h, angle, houseSize,
            seed: seedFor(seedId, 'b'+buildings.length), hatchVariant: rnd() > 0.5 ? 0 : 1
          });
        }
      }
    }
  }
  return buildings;
}

/* The raw alley line deliberately overshoots the cell's bounding box (so the
   split below reliably crosses the whole cell regardless of orientation) —
   but that overshoot must never end up in the stored/rendered road, or it
   pokes straight out past the zone. Clips the line back to the two points
   where it actually crosses the cell's own boundary, keeping any bend
   points that fall between them. */
function clipAlleyToPolygon(alleyPts, poly){
  const cum = [0];
  for(let i=0;i<alleyPts.length-1;i++) cum.push(cum[i]+dist(alleyPts[i],alleyPts[i+1]));
  const hits = [];
  for(let i=0;i<alleyPts.length-1;i++){
    const a=alleyPts[i], b=alleyPts[i+1];
    for(let j=0;j<poly.length;j++){
      const hit = segIntersect(a, b, poly[j], poly[(j+1)%poly.length]);
      if(hit) hits.push({point:hit, tAlong: cum[i]+dist(a,hit)});
    }
  }
  if(hits.length < 2) return null;
  hits.sort((h1,h2)=>h1.tAlong-h2.tAlong);
  const start = hits[0], end = hits[hits.length-1];
  const clipped = [start.point];
  for(let i=0;i<alleyPts.length;i++){
    if(cum[i] > start.tAlong+0.01 && cum[i] < end.tAlong-0.01) clipped.push(alleyPts[i]);
  }
  clipped.push(end.point);
  return clipped;
}
/* Picks a rough dividing line across a cell, running the long way across its
   shorter dimension, with 1-2 random bends partway along so it reads as a
   twisting lane rather than a ruled-off cut. Positioned somewhere in the
   middle 30% of the cell so it doesn't shave off a useless sliver. */
function randomAlleyAcrossCell(poly, rnd){
  const bb = bbox(poly);
  const w = bb.maxx-bb.minx, h = bb.maxy-bb.miny;
  const vertical = w >= h;
  const margin = Math.max(w,h)*0.2 + 20;
  let p1, p2;
  if(vertical){
    const x = bb.minx + w*(0.35+rnd()*0.3);
    p1=[x, bb.miny-margin]; p2=[x, bb.maxy+margin];
  } else {
    const y = bb.miny + h*(0.35+rnd()*0.3);
    p1=[bb.minx-margin, y]; p2=[bb.maxx+margin, y];
  }
  const bendCount = 1 + Math.floor(rnd()*2);
  const pts=[p1];
  for(let k=1;k<=bendCount;k++){
    const t = k/(bendCount+1);
    const base=[p1[0]+(p2[0]-p1[0])*t, p1[1]+(p2[1]-p1[1])*t];
    const perp = Math.atan2(p2[1]-p1[1], p2[0]-p1[0]) + Math.PI/2;
    const bend = (rnd()-0.5)*Math.min(w,h)*0.4;
    pts.push([base[0]+Math.cos(perp)*bend, base[1]+Math.sin(perp)*bend]);
  }
  pts.push(p2);
  return pts;
}
/* Splits a cell polygon into whatever ends up on each side of a (possibly
   bent) alley path, by rasterising the cell, carving out the alley's own
   corridor, and flood-filling out from a point just off to each side of it —
   reusing the same grid/trace machinery used for auto-zone and ring erosion
   elsewhere in this file. Returns null if the split doesn't cleanly produce
   two separate regions (e.g. the alley doesn't actually cross the cell). */
function splitPolygonByAlley(poly, alleyPts, alleyHalfWidth){
  const cellSize = 4;
  const maskHalfWidth = alleyHalfWidth + cellSize; // safety margin — see clipRectFootprint/enforceZoneObstacleClearance for the same fix
  const bb = bbox(poly);
  const minx = Math.floor(bb.minx/cellSize)*cellSize - cellSize;
  const miny = Math.floor(bb.miny/cellSize)*cellSize - cellSize;
  const cols = Math.max(1, Math.ceil((bb.maxx-bb.minx)/cellSize)+3);
  const rows = Math.max(1, Math.ceil((bb.maxy-bb.miny)/cellSize)+3);
  if(cols*rows > 200000) return null;
  const mask = new Uint8Array(cols*rows);
  const idx = (x,y)=>y*cols+x;
  for(let gy=0; gy<rows; gy++){
    for(let gx=0; gx<cols; gx++){
      const wx=minx+(gx+0.5)*cellSize, wy=miny+(gy+0.5)*cellSize;
      if(!pointInPoly([wx,wy], poly)) continue;
      let blocked=false;
      for(let i=0;i<alleyPts.length-1;i++){
        if(distToPolyline([wx,wy], [alleyPts[i],alleyPts[i+1]]).dist <= maskHalfWidth){ blocked=true; break; }
      }
      if(!blocked) mask[idx(gx,gy)] = 1;
    }
  }
  const midI = Math.floor((alleyPts.length-1)/2);
  const a = alleyPts[midI], b = alleyPts[midI+1] || alleyPts[midI];
  const dx=b[0]-a[0], dy=b[1]-a[1], len=Math.hypot(dx,dy)||1;
  const nx=-dy/len, ny=dx/len;
  const mid=[(a[0]+b[0])/2, (a[1]+b[1])/2];
  const off = alleyHalfWidth + cellSize*2;

  function floodFrom(seedWorld){
    let sgx = Math.round((seedWorld[0]-minx)/cellSize), sgy = Math.round((seedWorld[1]-miny)/cellSize);
    if(!(sgx>=0 && sgy>=0 && sgx<cols && sgy<rows && mask[idx(sgx,sgy)])){
      let found=null;
      const maxR = Math.max(cols,rows);
      outer:
      for(let r=1;r<maxR;r++){
        for(let ddx=-r;ddx<=r;ddx++){
          for(let ddy=-r;ddy<=r;ddy++){
            if(Math.max(Math.abs(ddx),Math.abs(ddy))!==r) continue;
            const gx=sgx+ddx, gy=sgy+ddy;
            if(gx<0||gy<0||gx>=cols||gy>=rows) continue;
            if(mask[idx(gx,gy)]){ found=[gx,gy]; break outer; }
          }
        }
      }
      if(!found) return null;
      sgx=found[0]; sgy=found[1];
    }
    const visited = new Uint8Array(cols*rows);
    const queue=[[sgx,sgy]]; visited[idx(sgx,sgy)]=1;
    let head=0;
    while(head<queue.length){
      const [cx,cy]=queue[head++];
      const nbs=[[cx+1,cy],[cx-1,cy],[cx,cy+1],[cx,cy-1]];
      for(const [nx2,ny2] of nbs){
        if(nx2<0||ny2<0||nx2>=cols||ny2>=rows) continue;
        const ni=idx(nx2,ny2);
        if(visited[ni]||!mask[ni]) continue;
        visited[ni]=1; queue.push([nx2,ny2]);
      }
    }
    if(queue.length<6) return null;
    const traced = traceBoundary(visited, cols, rows, cellSize, minx, miny);
    if(!traced||traced.length<3) return null;
    return simplifyClosedPolygon(traced, 1.5);
  }

  const regionA = floodFrom([mid[0]+nx*off, mid[1]+ny*off]);
  const regionB = floodFrom([mid[0]-nx*off, mid[1]-ny*off]);
  return {regionA, regionB};
}
/* Hovel zones don't get an orderly grid at all — the district is carved up
   by a randomly branching, twisting network of narrow back-alleys (a rough
   space subdivision: repeatedly cut whichever remaining cell is currently
   largest in two along a bent line, so the — now limited — alley budget
   spreads evenly across the zone instead of exhausting itself in one corner;
   stop once a cell is too small to usefully cut again), and every resulting
   pocket gets packed with as many small, slightly-skewed hovels as will
   actually fit, using the same fitting/clipping logic as every other house
   type so nothing ever overlaps a road, river, canal or another building. */
function autofillZoneHovel(zone){
  removeZoneAlleys(zone.id);
  removeZoneWalls(zone.id);
  const spec = HOUSE_SPECS.hovel;
  const gap = DENSITY_GAP[zone.density];
  const baseObstacles = buildObstacles();
  const rnd = mulberry32(seedFor(zone.id, 'hovelmess'));
  const alleyHalfWidth = (ROAD_STYLE.alley.w * sp().lineScale)/2 + 2;
  const MIN_CELL_AREA = (spec.w+gap)*(spec.h+gap)*4.5;
  const MAX_ALLEYS = 28; // 60% fewer than before

  const alleys = [];
  const buildings = [];
  const dynamicObstacles = baseObstacles.slice();
  let alleyCount = 0;

  // Shared by both the maze packing below and the gap-filling pass after it:
  // a candidate only survives if it clears every obstacle/alley and doesn't
  // conflict with anything already placed.
  function tryAddBuildings(candidates){
    candidates.forEach(b=>{
      const samples = b.points ? b.points : rectSamplePoints([b.cx,b.cy], b.w, b.h, b.angle);
      if(minMarginForCorners(samples, dynamicObstacles) < -0.1) return;
      if(b.points){ buildings.push(b); return; }
      const rectB = {center:[b.cx,b.cy], w:b.w, h:b.h, angle:b.angle};
      for(const k of buildings){
        if(k.points) continue;
        const res = satOverlap(rectB, {center:[k.cx,k.cy], w:k.w, h:k.h, angle:k.angle});
        if(res && res.overlap > 0.3) return;
      }
      buildings.push(b);
    });
  }

  function packCell(poly){
    const angle = longestEdgeAngle(poly) + (rnd()-0.5)*0.35; // slight random tilt — unplanned, not neatly aligned
    const packGap = Math.max(1.5, gap*0.6); // hovels crammed together tighter than the usual density gap
    const cellBuildings = gridFillPolygon(poly, spec, packGap, dynamicObstacles, zone.id+'_h'+buildings.length, 'hovel', angle);
    // Each cell is fitted independently, so two buildings from neighbouring
    // cells can occasionally end up a hair too close where their boundary
    // fitting both reached toward the same gap — check every new building
    // against everything already placed anywhere in the zone before keeping it.
    tryAddBuildings(cellBuildings);
  }

  // Always split whichever pending cell is currently largest, rather than
  // recursing depth-first into one branch before ever touching the other —
  // depth-first could exhaust the whole alley budget subdividing one corner
  // of the zone while the opposite end never got split at all. Working
  // largest-first spends the (now smaller) alley budget where it matters
  // most, spreading the maze evenly across the whole zone instead.
  const queue = [zone.points];
  while(queue.length > 0){
    let bestIdx = 0, bestArea = -1;
    for(let i=0;i<queue.length;i++){
      const a = polygonArea(queue[i]);
      if(a > bestArea){ bestArea = a; bestIdx = i; }
    }
    const poly = queue.splice(bestIdx, 1)[0];

    if(bestArea < MIN_CELL_AREA || alleyCount >= MAX_ALLEYS){
      packCell(poly);
      continue;
    }
    const rawAlleyPts = randomAlleyAcrossCell(poly, rnd);
    const split = splitPolygonByAlley(poly, rawAlleyPts, alleyHalfWidth);
    const minPiece = spec.w*spec.h*0.6;
    if(!split || !split.regionA || !split.regionB ||
       polygonArea(split.regionA) < minPiece || polygonArea(split.regionB) < minPiece){
      packCell(poly); // split failed or left a useless sliver — just pack this cell whole
      continue;
    }
    // The raw alley line deliberately overshoots the cell so the split above
    // reliably crosses it regardless of orientation — clip that overshoot
    // off before this becomes a real road, or it pokes straight out past
    // the cell (and the zone) instead of stopping at its edge.
    const clippedAlleyPts = clipAlleyToPolygon(rawAlleyPts, poly) || rawAlleyPts;
    const alley = {id:'alley'+(state.nextId++), type:'alley', points:clippedAlleyPts, sourceZoneId:zone.id};
    alleys.push(alley);
    const alleyObstacle = {points:rawAlleyPts, halfWidth:alleyHalfWidth+1.5};
    dynamicObstacles.push(alleyObstacle);
    // The recursive split isn't perfectly precise across many levels, so this
    // new alley can occasionally land on top of a building an earlier,
    // spatially-nearby branch already placed — clear any casualties now.
    for(let i=buildings.length-1; i>=0; i--){
      const b = buildings[i];
      const samples = b.points ? b.points : rectSamplePoints([b.cx,b.cy], b.w, b.h, b.angle);
      if(minMarginForCorners(samples, [alleyObstacle]) < -0.1) buildings.splice(i,1);
    }
    alleyCount++;
    queue.push(split.regionA, split.regionB);
  }

  // The maze above only gets one attempt at filling each cell, at one
  // orientation — that leaves real gaps wherever a cell's shape didn't suit
  // its grid angle, or a failed split fell back to packing an awkward whole
  // cell. Sweep the entire zone for leftover free pockets big enough for
  // another hovel and pack those too, repeating a couple of times since each
  // round can expose smaller pockets the previous one couldn't reach.
  for(let round=0; round<3; round++){
    const gapPolys = findGapPolygons(zone.points, buildings, dynamicObstacles, spec);
    if(gapPolys.length===0) break;
    gapPolys.forEach((gapPoly, gi)=>{
      const angle = longestEdgeAngle(gapPoly) + (rnd()-0.5)*0.3;
      const packGap = Math.max(1.2, gap*0.5);
      const gapBuildings = gridFillPolygon(gapPoly, spec, packGap, dynamicObstacles, zone.id+'_gap'+round+'_'+gi, 'hovel', angle);
      tryAddBuildings(gapBuildings);
    });
  }

  zone.buildings = buildings;
  state.roads.push(...alleys);
}
/* Light industrial: mostly rowhouse-sized buildings, with an occasional much
   larger one (about one large building for every twelve small ones) dropped
   in among them — "500% larger" is taken to mean five times the footprint
   area, i.e. roughly 2.24x each dimension, since scaling every side by 5
   would tower absurdly over its neighbours on a map like this. Uses the same
   coarse maze-subdivision as hovels (largest-cell-first, so the alleys stay
   spread out) but with far fewer cuts — "a small number of alleyways" — and
   bigger cells, since this should read as a handful of yards and access
   lanes threading between buildings, not a warren. Because those alleys are
   exactly what separates each large building from its surrounding small
   ones, they end up naturally linking small buildings to larger ones rather
   than needing any special-cased routing. */
function autofillZoneIndustry(zone){
  removeZoneAlleys(zone.id);
  removeZoneWalls(zone.id);
  const smallSpec = HOUSE_SPECS.rowhouse;
  const growth = Math.sqrt(5); // 5x footprint area -> ~2.24x each side
  const largeSpec = {w: smallSpec.w*growth, h: smallSpec.h*growth};
  const gap = DENSITY_GAP[zone.density];
  const baseObstacles = buildObstacles();
  const rnd = mulberry32(seedFor(zone.id, 'industry'));
  const alleyHalfWidth = (ROAD_STYLE.alley.w * sp().lineScale)/2 + 2;
  const MIN_CELL_AREA = (smallSpec.w+gap)*(smallSpec.h+gap)*6; // fewer, bigger cells than the hovel maze
  const MAX_ALLEYS = 10; // "a small number of alleyways"

  const alleys = [];
  const buildings = [];
  const dynamicObstacles = baseObstacles.slice();
  let alleyCount = 0;

  function tryAddBuildings(candidates){
    candidates.forEach(b=>{
      const samples = b.points ? b.points : rectSamplePoints([b.cx,b.cy], b.w, b.h, b.angle);
      if(minMarginForCorners(samples, dynamicObstacles) < -0.1) return;
      if(b.points){ buildings.push(b); return; }
      const rectB = {center:[b.cx,b.cy], w:b.w, h:b.h, angle:b.angle};
      for(const k of buildings){
        if(k.points) continue;
        const res = satOverlap(rectB, {center:[k.cx,k.cy], w:k.w, h:k.h, angle:k.angle});
        if(res && res.overlap > 0.3) return;
      }
      buildings.push(b);
    });
  }
  function packCell(poly){
    const angle = longestEdgeAngle(poly) + (rnd()-0.5)*0.25;
    const packGap = Math.max(gap*0.8, 3);
    const cellBuildings = gridFillPolygon(poly, smallSpec, packGap, dynamicObstacles, zone.id+'_i'+buildings.length, 'industry', angle);
    tryAddBuildings(cellBuildings);
  }

  // Largest-cell-first subdivision (same approach as the hovel maze, so the
  // few alleys we do get spread out rather than clustering in one corner).
  const queue = [zone.points];
  while(queue.length > 0){
    let bestIdx=0, bestArea=-1;
    for(let i=0;i<queue.length;i++){ const a=polygonArea(queue[i]); if(a>bestArea){ bestArea=a; bestIdx=i; } }
    const poly = queue.splice(bestIdx,1)[0];
    if(bestArea < MIN_CELL_AREA || alleyCount >= MAX_ALLEYS){
      packCell(poly);
      continue;
    }
    const rawAlleyPts = randomAlleyAcrossCell(poly, rnd);
    const split = splitPolygonByAlley(poly, rawAlleyPts, alleyHalfWidth);
    const minPiece = smallSpec.w*smallSpec.h*2;
    if(!split || !split.regionA || !split.regionB ||
       polygonArea(split.regionA) < minPiece || polygonArea(split.regionB) < minPiece){
      packCell(poly);
      continue;
    }
    const clippedAlleyPts = clipAlleyToPolygon(rawAlleyPts, poly) || rawAlleyPts;
    const alley = {id:'alley'+(state.nextId++), type:'alley', points:clippedAlleyPts, sourceZoneId:zone.id};
    alleys.push(alley);
    const alleyObstacle = {points:rawAlleyPts, halfWidth:alleyHalfWidth+1.5};
    dynamicObstacles.push(alleyObstacle);
    for(let i=buildings.length-1; i>=0; i--){
      const b = buildings[i];
      const samples = b.points ? b.points : rectSamplePoints([b.cx,b.cy], b.w, b.h, b.angle);
      if(minMarginForCorners(samples, [alleyObstacle]) < -0.1) buildings.splice(i,1);
    }
    alleyCount++;
    queue.push(split.regionA, split.regionB);
  }

  // One light gap-filling pass — industrial plots can reasonably keep some
  // open yard space, so this isn't repeated as aggressively as for hovels.
  const gapPolys = findGapPolygons(zone.points, buildings, dynamicObstacles, smallSpec);
  gapPolys.forEach((gapPoly, gi)=>{
    const angle = longestEdgeAngle(gapPoly) + (rnd()-0.5)*0.2;
    const packGap = Math.max(gap*0.8, 3);
    const gapBuildings = gridFillPolygon(gapPoly, smallSpec, packGap, dynamicObstacles, zone.id+'_igap'+gi, 'industry', angle);
    tryAddBuildings(gapBuildings);
  });

  // Upgrade roughly one building in every thirteen (1 large : 12 small) into
  // a large one, removing whatever small neighbours the bigger footprint
  // now overlaps. Anchors are chosen with a minimum spacing between them —
  // picking every Nth building by array index instead could cluster several
  // anchors right next to each other (buildings from one packing pass land
  // consecutively in the list), causing needless large-large conflicts and
  // a much sparser result than the 1-in-12 target.
  const smallOnly = buildings.filter(b=>!b.points);
  const targetLarge = Math.max(1, Math.round(smallOnly.length/13));
  const minSeparation = Math.max(largeSpec.w, largeSpec.h)*1.3;
  const shuffled = smallOnly.slice();
  for(let i=shuffled.length-1; i>0; i--){
    const j = Math.floor(rnd()*(i+1));
    const tmp=shuffled[i]; shuffled[i]=shuffled[j]; shuffled[j]=tmp;
  }
  const anchors = [];
  for(const cand of shuffled){
    if(anchors.length >= targetLarge) break;
    if(anchors.some(a=>dist([a.cx,a.cy],[cand.cx,cand.cy]) < minSeparation)) continue;
    anchors.push(cand);
  }
  const MIN_SCALE = Math.sqrt(0.5);
  anchors.forEach(anchor=>{
    if(!buildings.includes(anchor)) return; // already removed as a casualty of an earlier upgrade
    const center = [anchor.cx, anchor.cy], angle = anchor.angle;
    let placed = null;
    for(let sc=1.0; sc>=MIN_SCALE-1e-6; sc-=0.06){
      const w = largeSpec.w*sc, h = largeSpec.h*sc;
      const samples = rectSamplePoints(center, w, h, angle);
      if(!samples.every(pt=>pointInPoly(pt, zone.points))) continue;
      if(minMarginForCorners(samples, dynamicObstacles) < 0) continue;
      // must not overlap any large building already placed — the small-
      // building removal below only clears small neighbours, so two large
      // buildings landing on each other would otherwise go unnoticed
      let conflictsLarge = false;
      for(const b of buildings){
        if(!b.isLarge) continue;
        const res = satOverlap({center,w,h,angle}, {center:[b.cx,b.cy], w:b.w, h:b.h, angle:b.angle});
        if(res && res.overlap > 0.3){ conflictsLarge = true; break; }
      }
      if(conflictsLarge) continue;
      placed = {center, w, h};
      break;
    }
    if(!placed) return; // couldn't fit a large building here — leave the small one as-is
    for(let k=buildings.length-1; k>=0; k--){
      const b = buildings[k];
      if(b===anchor){ buildings.splice(k,1); continue; }
      if(b.points || b.isLarge) continue;
      const res = satOverlap({center:placed.center, w:placed.w, h:placed.h, angle}, {center:[b.cx,b.cy], w:b.w, h:b.h, angle:b.angle});
      if(res && res.overlap > 0.3) buildings.splice(k,1);
    }
    buildings.push({
      cx:placed.center[0], cy:placed.center[1], w:placed.w, h:placed.h, angle,
      houseSize:'industry', isLarge:true,
      seed: seedFor(zone.id, 'L'+buildings.length), hatchVariant: 1
    });
  });

  zone.buildings = buildings;
  state.roads.push(...alleys);
}
/* Light industrial at low density reads differently from the others: each
   large building is a "central focus" placed first, with a ring of small
   buildings fronting outward around every side of it, and a loop of alley
   drawn around the whole cluster once it's built — skipping any side that
   already sits against a real road, river, canal or the zone's own edge, so
   it doesn't draw a redundant alley right next to an existing street.
   Repeats across the zone (largest remaining gap first isn't needed here
   since clusters are all roughly the same size — a simple grid of cluster
   slots does the job) until nothing more will fit. */
function autofillZoneIndustryLow(zone){
  removeZoneAlleys(zone.id);
  removeZoneWalls(zone.id);
  const smallSpec = HOUSE_SPECS.rowhouse;
  const growth = Math.sqrt(5); // "500% larger" read as 5x footprint area
  const largeSpec = {w: smallSpec.w*growth, h: smallSpec.h*growth};
  const gap = DENSITY_GAP[zone.density];
  const baseObstacles = buildObstacles();
  const rnd = mulberry32(seedFor(zone.id, 'industrylow'));
  const alleyHalfWidth = (ROAD_STYLE.alley.w * sp().lineScale)/2 + 2;
  const MIN_SCALE = Math.sqrt(0.5);

  const alleys = [];
  const buildings = [];
  const dynamicObstacles = baseObstacles.slice();

  const angle = longestEdgeAngle(zone.points);
  const c = centroid(zone.points);
  const rotated = zone.points.map(p=>rotatePoint(p, c, -angle));
  const bb = bbox(rotated);

  const ringDepth = smallSpec.w + smallSpec.h + gap; // worst case: full-width standoff gap plus the building's own depth
  const alleyGap = Math.max(8, gap*0.6);
  const stepW = largeSpec.w + 2*ringDepth + alleyGap;
  const stepH = largeSpec.h + 2*ringDepth + alleyGap;

  const clusterGroups = []; // {alleyPts: [[...points...], ...]} per cluster, for the end-of-process connectivity pass

  // Buildings render with a small random jitter (translation + slight
  // rotation) for a hand-drawn look, which the stored placement geometry
  // doesn't account for — checking against an inflated version of the
  // candidate builds in enough real clearance to absorb it. This also fixes
  // a real bug: circles have no .w/.h (only .radius), so without branching
  // on them here they'd silently produce broken NaN-based overlap checks —
  // i.e. two buildings could be treated as clear of a circle when they
  // weren't.
  const JITTER_SAFETY = 2.5;
  function conflictsWithPlaced(rect){
    const inflated = {center:rect.center, w:rect.w+JITTER_SAFETY*2, h:rect.h+JITTER_SAFETY*2, angle:rect.angle};
    for(const b of buildings){
      if(b.points) continue;
      const rectB = b.isCircle ? {center:[b.cx,b.cy], w:b.radius*2, h:b.radius*2, angle:0} : {center:[b.cx,b.cy], w:b.w, h:b.h, angle:b.angle};
      const res = satOverlap(inflated, rectB);
      if(res && res.overlap > 0.3) return true;
    }
    return false;
  }

  function tryPlaceCluster(gridCenter){
    // 1. front the large building onto the nearest real road if one is
    //    close enough to this slot; otherwise fall back to the zone's own
    //    longest-edge orientation so clusters far from any street still place.
    const maxFrontDist = Math.max(stepW, stepH) * 1.2;
    const fronting = frontOntoRoad(gridCenter, largeSpec.w, largeSpec.h, 6);
    const useRoad = !!(fronting && fronting.roadDist < maxFrontDist);
    const clusterAngle = useRoad ? fronting.angle : angle;
    const clusterCenter = useRoad ? fronting.center : gridCenter;

    let placedLarge = null;
    for(let sc=1.0; sc>=MIN_SCALE-1e-6; sc-=0.06){
      const w=largeSpec.w*sc, h=largeSpec.h*sc;
      const samples = rectSamplePoints(clusterCenter, w, h, clusterAngle);
      if(!samples.every(pt=>pointInPoly(pt, zone.points))) continue;
      if(minMarginForCorners(samples, dynamicObstacles) < 0) continue;
      if(conflictsWithPlaced({center:clusterCenter, w, h, angle:clusterAngle})) continue;
      placedLarge = {center:clusterCenter, w, h};
      break;
    }
    if(!placedLarge){
      const clipped = clipRectFootprint(clusterCenter, largeSpec.w, largeSpec.h, clusterAngle, zone.points, dynamicObstacles);
      if(clipped && !conflictsWithPlaced({center:clipped.center, w:clipped.w, h:clipped.h, angle:clusterAngle})) placedLarge = clipped;
    }
    if(!placedLarge) return; // no room for a large building at this slot at all — skip it

    const large = {
      cx:placedLarge.center[0], cy:placedLarge.center[1], w:placedLarge.w, h:placedLarge.h, angle:clusterAngle,
      houseSize:'industry', isLarge:true, seed:seedFor(zone.id,'CL'+buildings.length), hatchVariant:1
    };
    buildings.push(large);

    // 1b. Six in ten road-fronted large buildings get a circular structure
    //     (a tank/silo) at whichever corner sits farthest from the road —
    //     diameter half the large building's own width, pushed outward from
    //     that corner along both of the large building's own local axes so
    //     it clears the rectangle cleanly regardless of aspect ratio.
    if(useRoad && rnd() < 0.6){
      const cosA = Math.cos(large.angle), sinA = Math.sin(large.angle);
      const localCorners = [[-large.w/2,-large.h/2],[large.w/2,-large.h/2],[large.w/2,large.h/2],[-large.w/2,large.h/2]];
      let farLocal = localCorners[0], farDist = -1;
      localCorners.forEach(lc=>{
        const wx = large.cx + lc[0]*cosA - lc[1]*sinA;
        const wy = large.cy + lc[0]*sinA + lc[1]*cosA;
        const d = dist([wx,wy], fronting.roadPoint);
        if(d>farDist){ farDist=d; farLocal=lc; }
      });
      const radius = large.w/4;
      const sx = farLocal[0]<0 ? -1 : 1, sy = farLocal[1]<0 ? -1 : 1;
      const pushedLocal = [sx*(large.w/2+radius), sy*(large.h/2+radius)];
      const circleCenter = [
        large.cx + pushedLocal[0]*cosA - pushedLocal[1]*sinA,
        large.cy + pushedLocal[0]*sinA + pushedLocal[1]*cosA
      ];
      const circleRectApprox = {center:circleCenter, w:radius*2, h:radius*2, angle:0};
      if(pointInPoly(circleCenter, zone.points) &&
         minMarginForCorners([circleCenter], dynamicObstacles) >= radius &&
         !conflictsWithPlaced(circleRectApprox)){
        buildings.push({cx:circleCenter[0], cy:circleCenter[1], radius, isCircle:true, houseSize:'industry', seed:seedFor(zone.id,'CIRC'+buildings.length)});
      }
    }

    // 2. small buildings ring around it, facing outward — most sit a random
    //    gap away from the large building rather than touching it, and each
    //    one gets its own independent rotation rather than lining up neatly.
    const ring = placeRingAroundBuilding(large, smallSpec, gap, zone.points, dynamicObstacles, zone.id, 'cl'+buildings.length, rnd);
    const ringPlaced = [];
    ring.forEach(b=>{
      const rectB = {center:[b.cx,b.cy], w:b.w, h:b.h, angle:b.angle};
      if(conflictsWithPlaced(rectB)) return;
      const full = {...b, houseSize:'industry'};
      buildings.push(full);
      ringPlaced.push(full);
    });

    // 3. a loop of alley around the whole cluster, skipping any side
    //    already sitting against a real boundary
    const newAlleys = drawClusterAlley(large, ringPlaced, zone.points, dynamicObstacles, alleyHalfWidth, zone.id);
    newAlleys.forEach(a=>{
      alleys.push(a);
      dynamicObstacles.push({points:a.points, halfWidth:alleyHalfWidth+1.5});
    });
    if(newAlleys.length) clusterGroups.push({alleyPts: newAlleys.map(a=>a.points)});
  }

  for(let y = bb.miny + stepH/2; y < bb.maxy; y += stepH){
    for(let x = bb.minx + stepW/2; x < bb.maxx; x += stepW){
      tryPlaceCluster(rotatePoint([x,y], c, angle));
    }
  }

  // Connect every cluster's alley loop to whatever's nearest — another
  // cluster's loop, or a real road/thoroughfare/alley over near the zone
  // boundary — so nothing is left as an isolated island once the fill is done.
  const boundaryObstacles = baseObstacles.filter(ob=>ob.points && ob.points.length>=2);
  clusterGroups.forEach((group, gi)=>{
    const ownPoints = group.alleyPts.flat();
    if(!ownPoints.length) return;
    let bestDist = Infinity, bestFrom = null, bestTo = null;
    clusterGroups.forEach((other, oi)=>{
      if(oi===gi) return;
      other.alleyPts.flat().forEach(op=>{
        ownPoints.forEach(mp=>{
          const d = dist(mp, op);
          if(d < bestDist){ bestDist = d; bestFrom = mp; bestTo = op; }
        });
      });
    });
    boundaryObstacles.forEach(ob=>{
      ownPoints.forEach(mp=>{
        const hit = distToPolyline(mp, ob.points);
        if(hit.dist < bestDist){ bestDist = hit.dist; bestFrom = mp; bestTo = hit.point; }
      });
    });
    if(bestFrom && bestDist > 2){ // skip if already effectively touching
      const connector = {id:'alley'+(state.nextId++), type:'alley', points:[bestFrom, bestTo], sourceZoneId: zone.id};
      alleys.push(connector);
      dynamicObstacles.push({points:connector.points, halfWidth:alleyHalfWidth+1.5});
    }
  });

  // Second pass: the grid of clusters above never perfectly tiles an
  // irregular zone, so sweep for whatever significant free space is left
  // over and drop more large buildings into it — fronting onto whichever
  // alley (including the ones this fill just drew) or other piece of
  // infrastructure is nearest, same as the first pass but without a ring or
  // circle of its own. Reuses findGapPolygons (built for the hovel fill) to
  // locate the gaps, since it already correctly excludes every obstacle and
  // every building placed so far.
  const gapPolys = findGapPolygons(zone.points, buildings, dynamicObstacles, largeSpec);
  gapPolys.forEach((gapPoly, gi)=>{
    const gapCenter = centroid(gapPoly);
    const fronting2 = frontOntoAnyBoundary(gapCenter, largeSpec.w, largeSpec.h, 6, dynamicObstacles);
    const angle2 = fronting2 ? fronting2.angle : longestEdgeAngle(gapPoly);
    const center2 = fronting2 ? fronting2.center : gapCenter;

    let placed2 = null;
    for(let sc=1.0; sc>=MIN_SCALE-1e-6; sc-=0.06){
      const w=largeSpec.w*sc, h=largeSpec.h*sc;
      const samples = rectSamplePoints(center2, w, h, angle2);
      if(!samples.every(pt=>pointInPoly(pt, gapPoly))) continue;
      if(minMarginForCorners(samples, dynamicObstacles) < 0) continue;
      if(conflictsWithPlaced({center:center2, w, h, angle:angle2})) continue;
      placed2 = {center:center2, w, h};
      break;
    }
    if(!placed2){
      const clipped = clipRectFootprint(center2, largeSpec.w, largeSpec.h, angle2, gapPoly, dynamicObstacles);
      if(clipped && !conflictsWithPlaced({center:clipped.center, w:clipped.w, h:clipped.h, angle:angle2})) placed2 = clipped;
    }
    if(!placed2) return;
    // Belt and braces: re-check right before committing, since "no overlaps"
    // matters more here than the usual tolerance for a stray edge case.
    if(conflictsWithPlaced({center:placed2.center, w:placed2.w, h:placed2.h, angle:angle2})) return;

    buildings.push({
      cx:placed2.center[0], cy:placed2.center[1], w:placed2.w, h:placed2.h, angle:angle2,
      houseSize:'industry', isLarge:true, seed:seedFor(zone.id,'GAP'+gi), hatchVariant:1
    });
  });

  // Final safety sweep: a connector alley (added after clusters were built)
  // or a second-pass building can end up close to something placed earlier
  // that had no way to know about it yet — drop anything left too close to
  // any obstacle once everything is finished, rather than trust each stage
  // got the full picture in time.
  for(let i=buildings.length-1; i>=0; i--){
    const b = buildings[i];
    if(b.isCircle){
      let minD = Infinity;
      dynamicObstacles.forEach(ob=>{
        const d = distToPolyline([b.cx,b.cy], ob.points).dist - ob.halfWidth;
        if(d<minD) minD=d;
      });
      if(minD - b.radius < -0.5) buildings.splice(i,1);
    } else {
      const samples = rectSamplePoints([b.cx,b.cy], b.w, b.h, b.angle);
      if(minMarginForCorners(samples, dynamicObstacles) < -0.5) buildings.splice(i,1);
    }
  }
  // Same idea for building-vs-building: a clip-fallback rectangle grows to
  // fit whatever free space it finds without knowing about circles (which
  // aren't tracked in the obstacle system, only checked directly against
  // other buildings), so an overlap can occasionally slip past the explicit
  // check right after a placement — catch anything left once everything's done.
  const asRect = b => b.isCircle ? {center:[b.cx,b.cy], w:b.radius*2, h:b.radius*2, angle:0} : {center:[b.cx,b.cy], w:b.w, h:b.h, angle:b.angle};
  for(let i=buildings.length-1; i>=0; i--){
    let conflict = false;
    for(let j=0;j<i;j++){
      const ri = asRect(buildings[i]);
      const inflated = {center:ri.center, w:ri.w+JITTER_SAFETY*2, h:ri.h+JITTER_SAFETY*2, angle:ri.angle};
      const res = satOverlap(inflated, asRect(buildings[j]));
      if(res && res.overlap > 0.3){ conflict = true; break; }
    }
    if(conflict) buildings.splice(i,1);
  }

  zone.buildings = buildings;
  state.roads.push(...alleys);
}
/* Medium industrial: larger rectangular buildings (at least three times the
   footprint area of a light-industrial small building — read as area rather
   than each side, for the same reason "500% larger" was read as area
   earlier: scaling every side would look absurd at this map scale) that
   front onto whatever infrastructure is nearby. Where a river or canal
   passes through or along the zone, it's filled first — buildings walk
   along its length on whichever bank(s) fall inside the zone, with a
   service alley drawn tightly along their back edges once a run is placed.
   The rest of the zone is then filled by scanning for any spot close enough
   to front some other piece of infrastructure. A second pass drops circular
   structures into whatever open space is still left, spaced apart by a
   minimum separation rather than packed edge to edge. */
function autofillZoneIndustryMedium(zone){
  removeZoneAlleys(zone.id);
  removeZoneWalls(zone.id);
  const smallSpec = HOUSE_SPECS.rowhouse; // light-industrial's baseline small building
  const mediumGrowth = Math.sqrt(3); // "at least three times the size" -> 3x footprint area
  const mediumSpec = {w: smallSpec.w*mediumGrowth, h: smallSpec.h*mediumGrowth};
  const gap = DENSITY_GAP[zone.density];
  const baseObstacles = buildObstacles();
  const rnd = mulberry32(seedFor(zone.id, 'industrymedium'));
  const alleyHalfWidth = (ROAD_STYLE.alley.w * sp().lineScale)/2 + 2;
  const MIN_SCALE = Math.sqrt(0.5);
  const serviceClearance = 6;

  const alleys = [];
  const buildings = [];
  const dynamicObstacles = baseObstacles.slice();

  // Buildings render with a small random jitter (translation + slight
  // rotation) for a hand-drawn look, which the stored placement geometry
  // doesn't account for — two buildings placed with barely enough clearance
  // to pass a bare overlap check can still end up visibly overlapping once
  // that jitter is applied. Checking against an inflated version of the
  // candidate (not the building actually placed) builds in enough real
  // clearance to absorb it.
  const JITTER_SAFETY = 2.5;
  function conflictsWithPlaced(rect){
    const inflated = {center:rect.center, w:rect.w+JITTER_SAFETY*2, h:rect.h+JITTER_SAFETY*2, angle:rect.angle};
    for(const b of buildings){
      const rectB = b.isCircle ? {center:[b.cx,b.cy], w:b.radius*2, h:b.radius*2, angle:0} : {center:[b.cx,b.cy], w:b.w, h:b.h, angle:b.angle};
      const res = satOverlap(inflated, rectB);
      if(res && res.overlap > 0.3) return true;
    }
    return false;
  }
  function tryPlaceAt(center, ang, containPoly){
    let placed = null;
    for(let sc=1.0; sc>=MIN_SCALE-1e-6; sc-=0.06){
      const w=mediumSpec.w*sc, h=mediumSpec.h*sc;
      const samples = rectSamplePoints(center, w, h, ang);
      if(!samples.every(pt=>pointInPoly(pt, containPoly))) continue;
      if(minMarginForCorners(samples, dynamicObstacles) < 0) continue;
      if(conflictsWithPlaced({center, w, h, angle:ang})) continue;
      placed = {center, w, h};
      break;
    }
    if(!placed){
      const clipped = clipRectFootprint(center, mediumSpec.w, mediumSpec.h, ang, containPoly, dynamicObstacles);
      if(clipped && !conflictsWithPlaced({center:clipped.center, w:clipped.w, h:clipped.h, angle:ang})) placed = clipped;
    }
    return placed;
  }

  // Walks the length of a linear feature, placing a fronting building every
  // (mediumSpec.w + gap) — trying both perpendicular sides, since a river
  // running through the middle of a zone fronts buildings on both banks,
  // while a feature along the zone's own edge only has one usable side.
  function frontRowAlongLine(linePoints, featureHalfWidth){
    const segLens = [];
    for(let i=0;i<linePoints.length-1;i++) segLens.push(dist(linePoints[i],linePoints[i+1]));
    const totalLen = segLens.reduce((a,b)=>a+b,0);
    if(totalLen < 1) return [];
    const step = mediumSpec.w + gap;
    const row = [];
    let t = step/2;
    while(t < totalLen){
      let acc=0, segIdx=0;
      while(segIdx<segLens.length-1 && acc+segLens[segIdx] < t){ acc+=segLens[segIdx]; segIdx++; }
      const segT = segLens[segIdx]>0 ? (t-acc)/segLens[segIdx] : 0;
      const a = linePoints[segIdx], b = linePoints[segIdx+1];
      const pt = [a[0]+(b[0]-a[0])*segT, a[1]+(b[1]-a[1])*segT];
      const segAngle = Math.atan2(b[1]-a[1], b[0]-a[0]);
      const perp = [-Math.sin(segAngle), Math.cos(segAngle)];
      [1,-1].forEach(sign=>{
        const dir = [perp[0]*sign, perp[1]*sign];
        const halfExtent = projectedHalfExtent(mediumSpec.w, mediumSpec.h, segAngle, dir);
        const offDist = featureHalfWidth + serviceClearance + halfExtent;
        const center = [pt[0]+dir[0]*offDist, pt[1]+dir[1]*offDist];
        if(!pointInPoly(center, zone.points)) return;
        const placed = tryPlaceAt(center, segAngle, zone.points);
        if(!placed) return;
        const backOff = placed.h/2 + alleyHalfWidth + 2;
        const backCenter = [placed.center[0]-dir[0]*backOff, placed.center[1]-dir[1]*backOff];
        const entry = {
          cx:placed.center[0], cy:placed.center[1], w:placed.w, h:placed.h, angle:segAngle,
          houseSize:'industry', isLarge:true, seed:seedFor(zone.id,'MED'+buildings.length+'_'+row.length), hatchVariant:1,
          backCenter, side:sign, t
        };
        // Push immediately, not just into the local row array — otherwise
        // the next candidate a little further along the same walk never
        // sees this one in conflictsWithPlaced (which only checks the
        // shared buildings array) and can overlap it outright.
        buildings.push(entry);
        row.push(entry);
      });
      t += step;
    }
    return row;
  }

  // 1a. Rivers and canals get priority.
  const riverCanalFeatures = [];
  state.rivers.forEach(r=>riverCanalFeatures.push({points:r.points, halfWidth:(r.width||14)/2}));
  state.roads.filter(r=>r.type==='canal').forEach(r=>riverCanalFeatures.push({points:r.points, halfWidth:(roadWidth(r)*sp().lineScale)/2}));

  riverCanalFeatures.forEach(feat=>{
    const row = frontRowAlongLine(feat.points, feat.halfWidth);
    // row buildings are already in the shared `buildings` array — pushed
    // immediately during placement so consecutive buildings along the same
    // walk correctly check against each other.
    [1,-1].forEach(side=>{
      const sideRow = row.filter(b=>b.side===side).sort((a,b)=>a.t-b.t);
      if(sideRow.length < 2) return;
      const pts = sideRow.map(b=>b.backCenter);
      const alley = {id:'alley'+(state.nextId++), type:'alley', points:pts, sourceZoneId:zone.id};
      alleys.push(alley);
      dynamicObstacles.push({points:pts, halfWidth:alleyHalfWidth+1.5});
    });
  });

  // 1b. Everything else: scan the zone for spots close enough to front some
  // other piece of infrastructure (a road, or the alleys just drawn above)
  // — or, just as validly, the zone's own edge, so this pass doesn't leave
  // the interior of a zone with little nearby infrastructure mostly empty.
  const angle = longestEdgeAngle(zone.points);
  const c = centroid(zone.points);
  const rotated = zone.points.map(p=>rotatePoint(p, c, -angle));
  const bb = bbox(rotated);
  const stepW = mediumSpec.w + gap + serviceClearance;
  const stepH = mediumSpec.h + gap + serviceClearance;
  const maxFrontDist = Math.max(stepW, stepH) * 1.2;
  const zoneEdgeObstacle = {points: [...zone.points, zone.points[0]], halfWidth: 0};
  const frontingTargets = dynamicObstacles.concat([zoneEdgeObstacle]);

  for(let y = bb.miny + stepH/2; y < bb.maxy; y += stepH){
    for(let x = bb.minx + stepW/2; x < bb.maxx; x += stepW){
      const gridCenter = rotatePoint([x,y], c, angle);
      const fronting = frontOntoAnyBoundary(gridCenter, mediumSpec.w, mediumSpec.h, serviceClearance, frontingTargets);
      if(!fronting || fronting.boundaryDist >= maxFrontDist) continue; // nothing to front here — this pass only fills along infrastructure or the zone edge
      const placed = tryPlaceAt(fronting.center, fronting.angle, zone.points);
      if(!placed) continue;
      buildings.push({
        cx:placed.center[0], cy:placed.center[1], w:placed.w, h:placed.h, angle:fronting.angle,
        houseSize:'industry', isLarge:true, seed:seedFor(zone.id,'MEDB'+buildings.length), hatchVariant:1
      });
    }
  }

  // 2. Circles into whatever open space is left, spaced at least three
  // diameters apart centre-to-centre rather than packed solid, and never
  // within two diameters of the zone's own edge — each one's own size also
  // varies ±15% from the base for a less uniform, hand-placed look.
  const circleDiameter = mediumSpec.w * 0.25;
  const circleRadius = circleDiameter/2;
  const minCircleSeparation = circleDiameter * 3;
  const minEdgeClearance = circleDiameter * 2; // "not within two barrel diameters of the edge of the zone"
  const maxCircleRadius = circleRadius * 1.15; // worst-case size, used for conservative clearance checks
  const gapPolys = findGapPolygons(zone.points, buildings, dynamicObstacles, {w:maxCircleRadius*2, h:maxCircleRadius*2});
  const placedCircleCenters = [];
  gapPolys.forEach(gapPoly=>{
    const bbGap = bbox(gapPoly);
    for(let y=bbGap.miny+maxCircleRadius; y<bbGap.maxy; y+=circleDiameter+2){
      for(let x=bbGap.minx+maxCircleRadius; x<bbGap.maxx; x+=circleDiameter+2){
        const center=[x,y];
        if(!pointInPoly(center, gapPoly)) continue;
        if(distToClosedPolyline(center, zone.points) < minEdgeClearance) continue;
        if(minMarginForCorners([center], dynamicObstacles) < maxCircleRadius) continue;
        if(placedCircleCenters.some(pc=>dist(pc,center) < minCircleSeparation)) continue;
        const thisRadius = circleRadius * (1 + (rnd()-0.5)*0.3); // ±15%
        const rectApprox = {center, w:thisRadius*2, h:thisRadius*2, angle:0};
        if(conflictsWithPlaced(rectApprox)) continue;
        buildings.push({cx:center[0], cy:center[1], radius:thisRadius, isCircle:true, houseSize:'industry', seed:seedFor(zone.id,'MEDCIRC'+buildings.length)});
        placedCircleCenters.push(center);
      }
    }
  });

  zone.buildings = buildings;
  state.roads.push(...alleys);
}
/* Draws a rectangular alley loop around a finished cluster (the large
   building plus its ring of small ones), but only the sides that don't
   already sit against a real boundary — an existing road/river/canal/alley,
   or the zone's own edge (which, by this tool's convention, usually already
   fronts a street). Surviving sides are stitched into as few connected
   polylines as possible rather than left as four disconnected stubs. */
function drawClusterAlley(large, ringBuildings, zonePoints, obstacles, alleyHalfWidth, zoneId){
  const angle = large.angle, c = [large.cx, large.cy];
  const allPts = rectCorners(c, large.w, large.h, angle);
  ringBuildings.forEach(b=>{
    rectCorners([b.cx,b.cy], b.w, b.h, b.angle).forEach(p=>allPts.push(p));
  });
  const rotated = allPts.map(p=>rotatePoint(p, c, -angle));
  const bbLocal = bbox(rotated);
  const clearance = alleyHalfWidth + 3;
  const localCorners = [
    [bbLocal.minx-clearance, bbLocal.miny-clearance],
    [bbLocal.maxx+clearance, bbLocal.miny-clearance],
    [bbLocal.maxx+clearance, bbLocal.maxy+clearance],
    [bbLocal.minx-clearance, bbLocal.maxy+clearance]
  ];
  const worldCorners = localCorners.map(p=>rotatePoint(p, c, angle));

  const threshold = alleyHalfWidth*2 + 6;
  function nearExistingBoundary(pt){
    if(distToClosedPolyline(pt, zonePoints) < threshold) return true;
    for(const ob of obstacles){
      if(distToPolyline(pt, ob.points).dist < threshold) return true;
    }
    return false;
  }
  const sideSkip = [];
  for(let i=0;i<4;i++){
    const a = worldCorners[i], b = worldCorners[(i+1)%4];
    const mid = [(a[0]+b[0])/2, (a[1]+b[1])/2];
    sideSkip.push(nearExistingBoundary(mid));
  }

  const polylines = [];
  let current = null;
  for(let i=0;i<4;i++){
    if(sideSkip[i]){
      if(current){ polylines.push(current); current=null; }
      continue;
    }
    if(!current) current = [worldCorners[i], worldCorners[(i+1)%4]];
    else current.push(worldCorners[(i+1)%4]);
  }
  if(current) polylines.push(current);
  // stitch the wraparound together if both the last and first sides survived
  // as separate polylines (started fresh at i=0, so they wouldn't merge above)
  if(polylines.length>1 && !sideSkip[3] && !sideSkip[0]){
    const first = polylines.shift();
    const last = polylines.pop();
    polylines.push(last.concat(first.slice(1)));
  }

  return polylines.filter(pts=>pts.length>=2).map(pts=>(
    {id:'alley'+(state.nextId++), type:'alley', points:pts, sourceZoneId:zoneId}
  ));
}
/* Finds every left-over pocket of free space inside the zone — not covered
   by a road/river/canal/alley and not already sitting under a building —
   that's big enough to be worth packing with more hovels. Rasterises the
   whole zone once, carves out every obstacle and every already-placed
   building (from their own local footprint, not a full per-cell scan, so
   this stays fast even with hundreds of buildings already down), then finds
   each separate connected free region above a minimum size and traces it
   into a polygon ready for gridFillPolygon. */
function findGapPolygons(zonePoints, buildings, obstacles, spec){
  const cellSize = 6;
  const bb = bbox(zonePoints);
  const minx = Math.floor(bb.minx/cellSize)*cellSize - cellSize;
  const miny = Math.floor(bb.miny/cellSize)*cellSize - cellSize;
  const cols = Math.max(1, Math.ceil((bb.maxx-bb.minx)/cellSize)+3);
  const rows = Math.max(1, Math.ceil((bb.maxy-bb.miny)/cellSize)+3);
  if(cols*rows > 500000) return [];
  const mask = new Uint8Array(cols*rows); // 1 = free
  const idx = (x,y)=>y*cols+x;
  for(let gy=0; gy<rows; gy++){
    for(let gx=0; gx<cols; gx++){
      const wx=minx+(gx+0.5)*cellSize, wy=miny+(gy+0.5)*cellSize;
      if(!pointInPoly([wx,wy], zonePoints)) continue;
      let blocked=false;
      for(const ob of obstacles){
        if(distToPolyline([wx,wy], ob.points).dist <= ob.halfWidth){ blocked=true; break; }
      }
      if(!blocked) mask[idx(gx,gy)] = 1;
    }
  }
  const margin = 2; // small clearance so gap-fill buildings don't land flush against an existing wall
  buildings.forEach(b=>{
    const poly = b.points || rectCorners([b.cx,b.cy], b.w+margin*2, b.h+margin*2, b.angle);
    const pbb = bbox(poly);
    const gminx=Math.max(0,Math.floor((pbb.minx-minx)/cellSize)), gmaxx=Math.min(cols-1,Math.ceil((pbb.maxx-minx)/cellSize));
    const gminy=Math.max(0,Math.floor((pbb.miny-miny)/cellSize)), gmaxy=Math.min(rows-1,Math.ceil((pbb.maxy-miny)/cellSize));
    for(let gy=gminy; gy<=gmaxy; gy++){
      for(let gx=gminx; gx<=gmaxx; gx++){
        const i = idx(gx,gy);
        if(!mask[i]) continue;
        const wx=minx+(gx+0.5)*cellSize, wy=miny+(gy+0.5)*cellSize;
        if(pointInPoly([wx,wy], poly)) mask[i]=0;
      }
    }
  });

  const visited = new Uint8Array(cols*rows);
  const minRegionCells = Math.max(3, Math.ceil((spec.w*spec.h*0.5)/(cellSize*cellSize)));
  const gapPolys = [];
  for(let gy=0; gy<rows; gy++){
    for(let gx=0; gx<cols; gx++){
      const i0 = idx(gx,gy);
      if(visited[i0] || !mask[i0]) continue;
      const queue=[[gx,gy]]; visited[i0]=1; let head=0;
      const cells=[[gx,gy]];
      while(head<queue.length){
        const [cx,cy]=queue[head++];
        const nbs=[[cx+1,cy],[cx-1,cy],[cx,cy+1],[cx,cy-1]];
        for(const [nx,ny] of nbs){
          if(nx<0||ny<0||nx>=cols||ny>=rows) continue;
          const ni=idx(nx,ny);
          if(visited[ni]||!mask[ni]) continue;
          visited[ni]=1; queue.push([nx,ny]); cells.push([nx,ny]);
        }
      }
      if(cells.length < minRegionCells) continue;
      const regionMask = new Uint8Array(cols*rows);
      cells.forEach(([cx,cy])=>{ regionMask[idx(cx,cy)]=1; });
      const traced = traceBoundary(regionMask, cols, rows, cellSize, minx, miny);
      if(!traced || traced.length<3) continue;
      const simplified = simplifyClosedPolygon(traced, 3);
      if(simplified && simplified.length>=3) gapPolys.push(simplified);
    }
  }
  return gapPolys;
}

/* Mansion zones don't get filled with houses like the others — instead the
   zone is enclosed with a plain estate wall (no towers or crenellation),
   with a gate wherever a road crosses it, same as the wall/boundary tool.
   At low density that's all: an empty walled plot. At medium and high
   density (currently identical — high density is a placeholder for a future
   refinement) a single large rectangular manor house is placed in the
   middle, set back from the zone's own edge by roughly a fifth of the
   zone's width on every side. */
function autofillZoneMansion(zone){
  removeZoneAlleys(zone.id);
  removeZoneWalls(zone.id);
  state.zoneWalls.push({
    id: 'zwall'+(state.nextId++),
    points: zone.points.map(p=>[p[0], p[1]]),
    sourceZoneId: zone.id
  });

  if(zone.density === 'low'){
    zone.buildings = [];
    return;
  }

  // medium & high density: one manor house, inset ~20% of the zone's width on every side
  const spec = HOUSE_SPECS.mansion;
  const obstacles = buildObstacles();
  const angle = longestEdgeAngle(zone.points);
  const c = centroid(zone.points);
  const rotated = zone.points.map(p=>rotatePoint(p, c, -angle));
  const bb = bbox(rotated);
  const inset = (bb.maxx - bb.minx) * 0.2;
  const left = bb.minx+inset, right = bb.maxx-inset, top = bb.miny+inset, bottom = bb.maxy-inset;
  if(right-left < spec.w*0.4 || bottom-top < spec.h*0.4){
    zone.buildings = []; // zone too small/narrow for a 20%-of-width inset to leave anything usable
    return;
  }
  const idealW = right-left, idealH = bottom-top;
  const worldCenter = rotatePoint([(left+right)/2, (top+bottom)/2], c, angle);

  const MIN_SCALE = Math.sqrt(0.5);
  let placed = null;
  for(let sc=1.0; sc>=MIN_SCALE-1e-6; sc-=0.06){
    const w = idealW*sc, h = idealH*sc;
    const samples = rectSamplePoints(worldCenter, w, h, angle);
    if(!samples.every(pt=>pointInPoly(pt, zone.points))) continue;
    if(minMarginForCorners(samples, obstacles) < 0) continue;
    placed = {center:worldCenter, w, h};
    break;
  }
  if(!placed){
    const clipped = clipRectFootprint(worldCenter, idealW, idealH, angle, zone.points, obstacles);
    if(clipped) placed = clipped;
  }
  if(!placed){ zone.buildings = []; return; }

  zone.buildings = [{
    cx: placed.center[0], cy: placed.center[1], w: placed.w, h: placed.h, angle,
    houseSize: 'mansion',
    seed: seedFor(zone.id, 'manor'),
    hatchVariant: 0
  }];
}
/* Heavy industry: a single enormous building targeting exactly 75% of the
   zone's own area, sized from the zone's bounding-box aspect ratio so it
   reads as a natural fit for the zone's shape rather than an arbitrary
   rectangle, then shrunk only as far as needed to actually fit and clear
   any obstacle. The remaining perimeter — whatever's left between the
   building and the zone's own edge — is encircled with a wall, reusing the
   same per-zone wall mechanism mansion zones use. */
/* Erodes a polygon inward by a fixed distance: rasterises it, excludes any
   cell within that distance of the true boundary, flood-fills the
   remaining "core" from the centroid, and traces/simplifies the result.
   This is the same rasterise/flood-fill/trace approach used elsewhere in
   this file (gap detection, obstacle clearance) — reused here to inset a
   zone's own shape rather than carve around an obstacle. Returns null if
   the erosion leaves nothing meaningful. */
function computeInsetPolygon(zonePoints, insetDist){
  const cellSize = 4;
  const bb = bbox(zonePoints);
  const minx = Math.floor(bb.minx/cellSize)*cellSize - cellSize;
  const miny = Math.floor(bb.miny/cellSize)*cellSize - cellSize;
  const cols = Math.max(1, Math.ceil((bb.maxx-bb.minx)/cellSize)+3);
  const rows = Math.max(1, Math.ceil((bb.maxy-bb.miny)/cellSize)+3);
  if(cols*rows > 500000) return null;
  const mask = new Uint8Array(cols*rows);
  const idx = (x,y)=>y*cols+x;
  for(let gy=0; gy<rows; gy++){
    for(let gx=0; gx<cols; gx++){
      const wx=minx+(gx+0.5)*cellSize, wy=miny+(gy+0.5)*cellSize;
      if(!pointInPoly([wx,wy], zonePoints)) continue;
      if(distToClosedPolyline([wx,wy], zonePoints) < insetDist) continue;
      mask[idx(gx,gy)] = 1;
    }
  }
  const c = centroid(zonePoints);
  let sgx = Math.round((c[0]-minx)/cellSize), sgy = Math.round((c[1]-miny)/cellSize);
  if(!(sgx>=0 && sgy>=0 && sgx<cols && sgy<rows && mask[idx(sgx,sgy)])){
    let found = null;
    const maxR = Math.max(cols,rows);
    outer:
    for(let r=1;r<maxR;r++){
      for(let ddx=-r;ddx<=r;ddx++){
        for(let ddy=-r;ddy<=r;ddy++){
          if(Math.max(Math.abs(ddx),Math.abs(ddy))!==r) continue;
          const gx=sgx+ddx, gy=sgy+ddy;
          if(gx<0||gy<0||gx>=cols||gy>=rows) continue;
          if(mask[idx(gx,gy)]){ found=[gx,gy]; break outer; }
        }
      }
    }
    if(!found) return null;
    sgx=found[0]; sgy=found[1];
  }
  const visited = new Uint8Array(cols*rows);
  const queue=[[sgx,sgy]]; visited[idx(sgx,sgy)]=1;
  let head=0;
  while(head<queue.length){
    const [cx,cy]=queue[head++];
    const nbs=[[cx+1,cy],[cx-1,cy],[cx,cy+1],[cx,cy-1]];
    for(const [nx,ny] of nbs){
      if(nx<0||ny<0||nx>=cols||ny>=rows) continue;
      const ni=idx(nx,ny);
      if(visited[ni]||!mask[ni]) continue;
      visited[ni]=1; queue.push([nx,ny]);
    }
  }
  if(queue.length<6) return null;
  const traced = traceBoundary(visited, cols, rows, cellSize, minx, miny);
  if(!traced || traced.length<3) return null;
  return simplifyClosedPolygon(traced, cellSize*2.5);
}
/* Heavy industry: a single irregular building — not a rectangle — whose
   vertices sit one house width in from the zone's own edges, following the
   zone's actual shape rather than fitting a rectangle inside it. The inset
   distance is binary-searched (starting from that one-house-width guess) so
   the resulting footprint lands on exactly 80% of the zone's area. A fence
   then runs exactly around the zone's own boundary, reusing the same
   per-zone wall mechanism mansion zones use. */
function autofillZoneIndustryHeavy(zone){
  removeZoneAlleys(zone.id);
  removeZoneWalls(zone.id);
  state.zoneWalls.push({
    id: 'zwall'+(state.nextId++),
    points: zone.points.map(p=>[p[0], p[1]]),
    sourceZoneId: zone.id
  });

  const zoneArea = polygonArea(zone.points);
  const targetArea = zoneArea * 0.8;
  const houseWidth = HOUSE_SPECS.rowhouse.w; // "one house width"

  let bestPoly = null, bestDiff = Infinity;
  const consider = (poly)=>{
    if(!poly) return;
    const diff = Math.abs(polygonArea(poly) - targetArea);
    if(diff < bestDiff){ bestDiff = diff; bestPoly = poly; }
  };
  consider(computeInsetPolygon(zone.points, houseWidth));

  // Binary-search the inset distance: area shrinks monotonically as the
  // inset grows, so this converges quickly onto the distance that lands
  // closest to the 80% target.
  let lo = 0.5, hi = Math.max(houseWidth*5, 50);
  for(let iter=0; iter<14; iter++){
    const mid = (lo+hi)/2;
    const poly = computeInsetPolygon(zone.points, mid);
    if(!poly){ hi = mid; continue; }
    consider(poly);
    if(polygonArea(poly) > targetArea) lo = mid; else hi = mid;
  }
  if(!bestPoly){ zone.buildings = []; return; }

  zone.buildings = [{
    points: bestPoly,
    houseSize: 'industry', isLarge: true,
    seed: seedFor(zone.id, 'heavy0'), hatchVariant: 0
  }];
}

/* ---- SAT (Separating Axis Theorem) overlap test for two oriented rectangles ---- */
function rectAxes(angle){
  return [[Math.cos(angle), Math.sin(angle)], [-Math.sin(angle), Math.cos(angle)]];
}
function projectRectOntoAxis(center, w, h, angle, axis){
  const corners = rectCorners(center, w, h, angle);
  let min=Infinity, max=-Infinity;
  corners.forEach(c=>{
    const p = c[0]*axis[0] + c[1]*axis[1];
    if(p<min) min=p; if(p>max) max=p;
  });
  return [min,max];
}
function satOverlap(rectA, rectB){
  const axes = [...rectAxes(rectA.angle), ...rectAxes(rectB.angle)];
  let minOverlap = Infinity;
  for(const axis of axes){
    const [aMin,aMax] = projectRectOntoAxis(rectA.center, rectA.w, rectA.h, rectA.angle, axis);
    const [bMin,bMax] = projectRectOntoAxis(rectB.center, rectB.w, rectB.h, rectB.angle, axis);
    const overlap = Math.min(aMax,bMax) - Math.max(aMin,bMin);
    if(overlap <= 0) return null; // a separating axis exists: no overlap
    if(overlap < minOverlap) minOverlap = overlap;
  }
  return {overlap:minOverlap};
}

/* Places one ring of houses around the given polygon: a row per edge, front
   flush to that edge, each row's houses individually widened or narrowed
   (within the given volume tolerance) so the row tiles the edge exactly with
   no leftover gap — this is what gives a complete, non-overlapping fill
   rather than a row that stops short or overruns. Falls back to the raster
   clip helper for any plot that still can't sit as a plain rectangle (an
   obstacle, or an oddly-shaped inherited boundary from a previous ring). */
function placeRingOnPolygon(polyPoints, spec, gap, obstacles, zoneId, ringTag){
  // Auto-zoned (and some hand-drawn) polygons can carry lots of short,
  // nearly-straight edges from the boundary trace. A flat per-corner inset
  // then eats a disproportionate share of those short edges — sometimes all
  // of it — leaving big stretches of the ring with no houses at all. Working
  // from a lightly simplified version of the boundary fixes that at the
  // source; containment checks below still use the true original polygon.
  const containPoly = polyPoints;
  polyPoints = simplifyClosedPolygon(polyPoints, Math.max(4, spec.h*0.22));
  if(polyPoints.length < 3) polyPoints = containPoly;

  const n = polyPoints.length;
  const centroidPt = centroid(polyPoints);
  const MIN_RATIO = 0.7, MAX_RATIO = 1.3; // "70 to 130% of the original volume"

  const edgePlots = [];
  for(let i=0;i<n;i++){
    const a = polyPoints[i], b = polyPoints[(i+1)%n];
    const edgeLen = dist(a,b);
    const list = [];
    // Leave room at each end for a perpendicular row (from the neighbouring
    // edge) reaching in with its own depth — this is what makes corners
    // clear naturally instead of needing a large post-hoc trim. Capped
    // relative to the edge's own length so a modest edge is never entirely
    // swallowed by the inset on a polygon with lots of short edges.
    const inset = Math.min(spec.h*0.52, edgeLen*0.28);
    const usableLen = edgeLen - inset*2;
    if(usableLen >= spec.w*0.55){
      const dirX=(b[0]-a[0])/edgeLen, dirY=(b[1]-a[1])/edgeLen;
      let nx=-dirY, ny=dirX;
      const midx=(a[0]+b[0])/2, midy=(a[1]+b[1])/2;
      const sign = ((centroidPt[0]-midx)*nx + (centroidPt[1]-midy)*ny) >= 0 ? 1 : -1;
      nx*=sign; ny*=sign;

      // search nearby candidate counts for the best edge-exact fit within
      // the [70%,130%] width tolerance (width scales area/"volume" directly
      // since depth stays fixed at spec.h)
      const idealN = usableLen/(spec.w+gap);
      let best = null;
      for(let N=Math.max(1,Math.round(idealN)-2); N<=Math.round(idealN)+3; N++){
        if(N<1) continue;
        const perW = (usableLen-(N-1)*gap)/N;
        if(perW<=0) continue;
        const ratio = perW/spec.w;
        if(ratio<MIN_RATIO || ratio>MAX_RATIO) continue;
        const score = Math.abs(ratio-1);
        if(!best || score<best.score) best = {N, perW, score};
      }
      if(!best){
        const N = Math.max(1, Math.round(idealN));
        const perW = Math.max(spec.w*MIN_RATIO, Math.min(spec.w*MAX_RATIO, (usableLen-(N-1)*gap)/N || spec.w));
        best = {N, perW};
      }
      const N = best.N, perW = best.perW;
      for(let k=0;k<N;k++){
        const t = inset + k*(perW+gap) + perW/2;
        list.push({
          edgePoint:[a[0]+dirX*t, a[1]+dirY*t],
          inwardNormal:[nx,ny], frontDir:[dirX,dirY],
          angle: Math.atan2(dirY,dirX),
          w: perW, h0: spec.h
        });
      }
    }
    edgePlots.push(list);
  }

  // Corner safety net: acute corners can still leave the very end houses on
  // two edges overlapping even with edge-exact tiling — clip both back by
  // equal amounts (width and depth together, since the overlap is 2-D).
  function perimRect(pb){
    const center = [pb.edgePoint[0]+pb.inwardNormal[0]*(pb.h0/2), pb.edgePoint[1]+pb.inwardNormal[1]*(pb.h0/2)];
    return {center, w:pb.w, h:pb.h0, angle:pb.angle};
  }
  function trimWidthFromCorner(pb, cornerPoint, reduction){
    reduction = Math.max(0, Math.min(reduction, pb.w - spec.w*0.28));
    if(reduction<=0) return;
    const [dx,dy] = pb.frontDir;
    const towardCorner = dist([pb.edgePoint[0]+dx, pb.edgePoint[1]+dy], cornerPoint) <
                          dist([pb.edgePoint[0]-dx, pb.edgePoint[1]-dy], cornerPoint) ? 1 : -1;
    pb.edgePoint = [pb.edgePoint[0]-towardCorner*dx*(reduction/2), pb.edgePoint[1]-towardCorner*dy*(reduction/2)];
    pb.w -= reduction;
  }
  function trimDepthFromBack(pb, reduction){
    reduction = Math.max(0, Math.min(reduction, pb.h0 - spec.h*0.28));
    pb.h0 -= reduction;
  }
  for(let i=0;i<n;i++){
    const listA = edgePlots[i], listB = edgePlots[(i+1)%n];
    if(!listA.length || !listB.length) continue;
    const bA = listA[listA.length-1], bB = listB[0];
    for(let iter=0; iter<14; iter++){
      const overlap = satOverlap(perimRect(bA), perimRect(bB));
      if(!overlap || overlap.overlap <= 0.35) break;
      const step = overlap.overlap/4 + 0.4;
      const cornerPoint = polyPoints[(i+1)%n];
      trimWidthFromCorner(bA, cornerPoint, step); trimDepthFromBack(bA, step);
      trimWidthFromCorner(bB, cornerPoint, step); trimDepthFromBack(bB, step);
    }
  }

  // Fit each plot: try the plain rectangle first; if it doesn't clear the
  // polygon boundary or an obstacle, clip it to whatever space is free
  // instead of dropping it, so the ring has no gaps.
  const buildings = [];
  let counter = 0;
  edgePlots.forEach(list=>{
    list.forEach(pb=>{
      if(pb.w < spec.w*0.22) return;
      const center = [pb.edgePoint[0]+pb.inwardNormal[0]*(pb.h0/2), pb.edgePoint[1]+pb.inwardNormal[1]*(pb.h0/2)];
      const samples = rectSamplePoints(center, pb.w, pb.h0, pb.angle);
      const fitsPlain = samples.every(pt=>pointInPoly(pt, containPoly)) && minMarginForCorners(samples, obstacles) >= 0;
      const seed = seedFor(zoneId, ringTag+'_'+(counter++));
      if(fitsPlain){
        buildings.push({cx:center[0], cy:center[1], w:pb.w, h:pb.h0, angle:pb.angle, seed, hatchVariant:counter%2});
      } else {
        const clipped = clipRectFootprint(center, pb.w, pb.h0, pb.angle, containPoly, obstacles);
        if(clipped){
          buildings.push({cx:clipped.center[0], cy:clipped.center[1], w:clipped.w, h:clipped.h, angle:pb.angle, seed, hatchVariant:counter%2});
        }
      }
    });
  });
  return buildings;
}

/* Places a ring of small buildings fronting OUTWARD around a single
   rectangular building (rather than inward along a zone's own boundary,
   which is what placeRingOnPolygon above does) — used to surround a large
   "central focus" industrial building with smaller ones on every side.
   Reuses the same edge-exact tiling and corner-trim safety net, but
   containment is against the zone (buildings must stay outside the large
   building yet inside the zone), not against the fronted shape itself.
   Most small buildings sit a random gap away from the large one (10%-100%
   of the small building's own width) rather than touching it — only about
   one in ten ends up actually flush against it ("joined"). */
function placeRingAroundBuilding(building, spec, gap, zonePoints, obstacles, zoneId, ringTag, rnd){
  const corners = rectCorners([building.cx, building.cy], building.w, building.h, building.angle);
  const n = 4;
  const MIN_RATIO = 0.7, MAX_RATIO = 1.3;
  const edgePlots = [];
  for(let i=0;i<n;i++){
    const a = corners[i], b = corners[(i+1)%n];
    const edgeLen = dist(a,b);
    const list = [];
    const inset = Math.min(spec.h*0.52, edgeLen*0.28);
    const usableLen = edgeLen - inset*2;
    if(usableLen >= spec.w*0.55){
      const dirX=(b[0]-a[0])/edgeLen, dirY=(b[1]-a[1])/edgeLen;
      let nx=-dirY, ny=dirX;
      const midx=(a[0]+b[0])/2, midy=(a[1]+b[1])/2;
      // outward: point AWAY from the building's own centre (flipped from the inward version)
      const sign = ((building.cx-midx)*nx + (building.cy-midy)*ny) >= 0 ? -1 : 1;
      nx*=sign; ny*=sign;

      const idealN = usableLen/(spec.w+gap);
      let best = null;
      for(let N=Math.max(1,Math.round(idealN)-2); N<=Math.round(idealN)+3; N++){
        if(N<1) continue;
        const perW = (usableLen-(N-1)*gap)/N;
        if(perW<=0) continue;
        const ratio = perW/spec.w;
        if(ratio<MIN_RATIO || ratio>MAX_RATIO) continue;
        const score = Math.abs(ratio-1);
        if(!best || score<best.score) best = {N, perW, score};
      }
      if(!best){
        const N = Math.max(1, Math.round(idealN));
        const perW = Math.max(spec.w*MIN_RATIO, Math.min(spec.w*MAX_RATIO, (usableLen-(N-1)*gap)/N || spec.w));
        best = {N, perW};
      }
      const N = best.N, perW = best.perW;
      for(let k=0;k<N;k++){
        const t = inset + k*(perW+gap) + perW/2;
        const joined = rnd() < 0.10;
        const standoff = joined ? 0 : (0.1 + rnd()*0.9)*spec.w;
        const rotJitter = (rnd()-0.5)*0.6; // up to ~±17°, independent per building — not grid-aligned
        list.push({
          edgePoint:[a[0]+dirX*t, a[1]+dirY*t],
          outwardNormal:[nx,ny], frontDir:[dirX,dirY],
          angle: Math.atan2(dirY,dirX) + rotJitter,
          w: perW, h0: spec.h, standoff
        });
      }
    }
    edgePlots.push(list);
  }

  function perimRect(pb){
    const off = pb.standoff + pb.h0/2;
    const center = [pb.edgePoint[0]+pb.outwardNormal[0]*off, pb.edgePoint[1]+pb.outwardNormal[1]*off];
    return {center, w:pb.w, h:pb.h0, angle:pb.angle};
  }
  function trimWidthFromCorner(pb, cornerPoint, reduction){
    reduction = Math.max(0, Math.min(reduction, pb.w - spec.w*0.28));
    if(reduction<=0) return;
    const [dx,dy] = pb.frontDir;
    const towardCorner = dist([pb.edgePoint[0]+dx, pb.edgePoint[1]+dy], cornerPoint) <
                          dist([pb.edgePoint[0]-dx, pb.edgePoint[1]-dy], cornerPoint) ? 1 : -1;
    pb.edgePoint = [pb.edgePoint[0]-towardCorner*dx*(reduction/2), pb.edgePoint[1]-towardCorner*dy*(reduction/2)];
    pb.w -= reduction;
  }
  function trimDepthFromBack(pb, reduction){
    reduction = Math.max(0, Math.min(reduction, pb.h0 - spec.h*0.28));
    pb.h0 -= reduction;
  }
  for(let i=0;i<n;i++){
    const listA = edgePlots[i], listB = edgePlots[(i+1)%n];
    if(!listA.length || !listB.length) continue;
    const bA = listA[listA.length-1], bB = listB[0];
    for(let iter=0; iter<14; iter++){
      const overlap = satOverlap(perimRect(bA), perimRect(bB));
      if(!overlap || overlap.overlap <= 0.35) break;
      const step = overlap.overlap/4 + 0.4;
      const cornerPoint = corners[(i+1)%n];
      trimWidthFromCorner(bA, cornerPoint, step); trimDepthFromBack(bA, step);
      trimWidthFromCorner(bB, cornerPoint, step); trimDepthFromBack(bB, step);
    }
  }

  const buildings = [];
  let counter = 0;
  edgePlots.forEach(list=>{
    list.forEach(pb=>{
      if(pb.w < spec.w*0.22) return;
      const off = pb.standoff + pb.h0/2;
      const center = [pb.edgePoint[0]+pb.outwardNormal[0]*off, pb.edgePoint[1]+pb.outwardNormal[1]*off];
      const samples = rectSamplePoints(center, pb.w, pb.h0, pb.angle);
      const fitsPlain = samples.every(pt=>pointInPoly(pt, zonePoints)) && minMarginForCorners(samples, obstacles) >= 0;
      const seed = seedFor(zoneId, ringTag+'_'+(counter++));
      if(fitsPlain){
        buildings.push({cx:center[0], cy:center[1], w:pb.w, h:pb.h0, angle:pb.angle, seed, hatchVariant:counter%2});
      } else {
        const clipped = clipRectFootprint(center, pb.w, pb.h0, pb.angle, zonePoints, obstacles);
        if(clipped){
          buildings.push({cx:clipped.center[0], cy:clipped.center[1], w:clipped.w, h:clipped.h, angle:pb.angle, seed, hatchVariant:counter%2});
        }
      }
    });
  });
  return buildings;
}

/* Erodes a polygon by the footprint of a just-placed ring (plus a service-
   alley gap), returning whatever interior area remains for the next ring —
   found by rasterising, excluding the ring's footprints and their alley
   buffer, flood-filling from any free cell, and tracing/simplifying the
   result. Returns null once nothing meaningful is left. */
function erodePolygonByRing(polyPoints, ringBuildings, alleyGap){
  const cellSize = 4;
  const bb = bbox(polyPoints);
  const minx = Math.floor(bb.minx/cellSize)*cellSize - cellSize;
  const miny = Math.floor(bb.miny/cellSize)*cellSize - cellSize;
  const cols = Math.max(1, Math.ceil((bb.maxx-bb.minx)/cellSize)+3);
  const rows = Math.max(1, Math.ceil((bb.maxy-bb.miny)/cellSize)+3);
  if(cols*rows > 300000) return null;
  const blocked = new Uint8Array(cols*rows);
  const idx=(x,y)=>y*cols+x;
  for(let gy=0; gy<rows; gy++){
    for(let gx=0; gx<cols; gx++){
      const wx=minx+(gx+0.5)*cellSize, wy=miny+(gy+0.5)*cellSize;
      if(!pointInPoly([wx,wy], polyPoints)) blocked[idx(gx,gy)]=1;
    }
  }
  ringBuildings.forEach(b=>{
