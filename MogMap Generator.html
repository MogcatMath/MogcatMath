<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cartographer's Table — Fantasy Town Map Builder</title>
<style>
  :root{
    --parchment:#ece0c4;
    --parchment-dark:#dccfa8;
    --ink:#3a2c1a;
    --ink-soft:#5c4a30;
    --panel-bg:#2a2015;
    --panel-bg2:#382a1a;
    --panel-text:#e8dcc0;
    --accent:#a9713a;
    --accent-bright:#d9a24b;
    --danger:#8a3324;
    --ok:#4a6a3a;
    font-family:'Iowan Old Style','Palatino Linotype',Georgia,serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:#161009;overflow:hidden;}
  body{display:flex;flex-direction:column;height:100vh;color:var(--panel-text);}

  header{
    background:linear-gradient(180deg,var(--panel-bg2),var(--panel-bg));
    padding:8px 16px;display:flex;align-items:center;gap:18px;
    border-bottom:2px solid #000;flex:0 0 auto;
  }
  header h1{font-size:17px;margin:0;font-weight:600;letter-spacing:.03em;color:var(--accent-bright);white-space:nowrap;}
  header .sub{font-size:11px;color:#b7a980;letter-spacing:.05em;}

  .style-toggle{display:flex;gap:4px;margin-left:auto;background:#1c150d;padding:3px;border-radius:6px;border:1px solid #000;}
  .style-toggle button{
    background:transparent;border:none;color:#b7a980;padding:6px 12px;font-size:12px;
    border-radius:4px;cursor:pointer;font-family:inherit;letter-spacing:.03em;
  }
  .style-toggle button.active{background:var(--accent);color:#1c150d;font-weight:700;}
  .style-toggle button:hover:not(.active){color:var(--accent-bright);}

  .layout{flex:1;display:flex;min-height:0;}

  .toolbar{
    width:190px;flex:0 0 auto;background:var(--panel-bg);border-right:2px solid #000;
    overflow-y:auto;padding:10px 0;
  }
  .stage-block{margin-bottom:4px;}
  .stage-head{
    padding:8px 12px 6px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;
    color:#8d7a58;cursor:pointer;display:flex;align-items:center;gap:6px;user-select:none;
  }
  .stage-head .num{
    width:18px;height:18px;border-radius:50%;background:#3a2c1a;color:#b7a980;
    display:inline-flex;align-items:center;justify-content:center;font-size:10px;flex:0 0 auto;
  }
  .stage-head.current{color:var(--accent-bright);}
  .stage-head.current .num{background:var(--accent);color:#1c150d;}
  .tool-btn{
    display:flex;align-items:center;gap:8px;width:calc(100% - 16px);margin:2px 8px;
    padding:7px 10px;background:transparent;border:1px solid transparent;border-radius:5px;
    color:var(--panel-text);font-size:12.5px;text-align:left;cursor:pointer;font-family:inherit;
  }
  .tool-btn:hover{background:#3a2c1a;}
  .tool-btn.active{background:var(--accent);color:#1c150d;font-weight:700;border-color:var(--accent-bright);}
  .tool-btn .swatch{width:14px;height:14px;border-radius:2px;flex:0 0 auto;border:1px solid #0006;}

  .canvas-wrap{
    flex:1;position:relative;overflow:auto;background:#0e0a06;
    display:flex;align-items:flex-start;justify-content:center;padding:24px;
  }
  #mapShell{position:relative;box-shadow:0 10px 40px #000a;border:10px solid #1c150d;border-radius:2px;
    width:100%;max-width:1500px;}
  svg#map{display:block;width:100%;height:auto;aspect-ratio:1.6;background:var(--parchment);cursor:crosshair;}
  .zoom-indicator{
    position:absolute;bottom:8px;right:8px;background:#1c150dcc;color:#e8dcc0;
    font-size:11px;padding:4px 9px;border-radius:4px;pointer-events:none;letter-spacing:.02em;
  }

  .right-panel{
    width:250px;flex:0 0 auto;background:var(--panel-bg);border-left:2px solid #000;
    overflow-y:auto;padding:14px 14px 40px;
  }
  .right-panel h2{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:#8d7a58;margin:14px 0 8px;}
  .right-panel h2:first-child{margin-top:0;}
  .layer-row{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:4px 0;color:var(--panel-text);}
  .layer-row input{accent-color:var(--accent);}
  .hint{font-size:11.5px;color:#9a8a68;line-height:1.5;background:#1c150d;padding:8px 10px;border-radius:5px;margin-top:6px;}
  .field{margin-bottom:10px;}
  .field label{display:block;font-size:11px;color:#b7a980;margin-bottom:3px;letter-spacing:.03em;}
  select, input[type=range]{width:100%;}
  select{background:#1c150d;color:var(--panel-text);border:1px solid #3a2c1a;padding:6px;border-radius:4px;font-family:inherit;font-size:12.5px;}
  .btn{
    display:block;width:100%;padding:9px 10px;margin-top:6px;background:var(--accent);color:#1c150d;
    border:none;border-radius:5px;font-weight:700;font-size:12.5px;cursor:pointer;font-family:inherit;letter-spacing:.02em;
  }
  .btn:hover{background:var(--accent-bright);}
  .btn.secondary{background:#3a2c1a;color:var(--panel-text);}
  .btn.secondary:hover{background:#4a3a24;}
  .btn.danger{background:var(--danger);color:#f3ded6;}
  .btn.danger:hover{background:#a54430;}
  .zone-list{display:flex;flex-direction:column;gap:4px;}
  .zone-item{
    display:flex;justify-content:space-between;align-items:center;font-size:11.5px;
    padding:6px 8px;background:#1c150d;border-radius:4px;cursor:pointer;border:1px solid transparent;
  }
  .zone-item.sel{border-color:var(--accent-bright);}
  .zone-item span.tag{color:#9a8a68;}
  footer{
    flex:0 0 auto;background:var(--panel-bg2);padding:5px 16px;font-size:11px;color:#8d7a58;
    border-top:1px solid #000;display:flex;justify-content:space-between;
  }
  .kbd{background:#1c150d;padding:1px 5px;border-radius:3px;border:1px solid #3a2c1a;font-size:10.5px;}
</style>
</head>
<body>

<header>
  <h1>Cartographer's Table</h1>
  <span class="sub">fantasy town map builder</span>
  <div class="style-toggle" id="styleToggle">
    <button data-style="medieval">Medieval</button>
    <button data-style="renaissance">Renaissance</button>
    <button data-style="victorian">Victorian</button>
  </div>
</header>

<div class="layout">
  <div class="toolbar" id="toolbar"></div>

  <div class="canvas-wrap">
    <div id="mapShell">
      <svg id="map" width="3200" height="2000" viewBox="0 0 3200 2000" xmlns="http://www.w3.org/2000/svg">
        <defs id="mapDefs"></defs>
        <g id="layer-background"></g>
        <g id="layer-natural"></g>
        <g id="layer-infrastructure"></g>
        <g id="layer-walls"></g>
        <g id="layer-zones"></g>
        <g id="layer-buildings"></g>
        <g id="layer-decoration"></g>
        <g id="layer-drawing"></g>
        <g id="layer-handles"></g>
      </svg>
      <div class="zoom-indicator" id="zoomIndicator">100%</div>
    </div>
  </div>

  <div class="right-panel" id="rightPanel"></div>
</div>
<input type="file" id="loadFileInput" accept=".json,application/json" style="display:none">

<footer>
  <span>Click to place points &middot; <span class="kbd">Enter</span> or double-click to close/finish &middot; <span class="kbd">Esc</span> cancel &middot; <span class="kbd">Backspace</span> undo last point &middot; <span class="kbd">Ctrl+Z</span> undo last action &middot; scroll to zoom &middot; middle-drag to pan</span>
  <span id="statusMsg"></span>
</footer>

<script>
(function(){
"use strict";

/* ---------------------------------------------------------------- state */
const state = {
  style: 'medieval',
  stage: 1,
  tool: null,
  layers: {natural:true, infrastructure:true, walls:true, zones:true, buildings:true},
  rivers: [], parks: [], hills: [],
  roads: [],
  walls: [], // city/boundary walls — can have more than one
  zoneWalls: [], // per-zone estate walls (mansion zones) — {id, points, sourceZoneId}
  zones: [],
  selectedZoneId: null,
  nextId: 1,
  drawing: null, // {kind:'river'|'park'|'hill'|'road:thoroughfare'|...|'wall'|'zone', points:[[x,y]...], closed:bool}
  selection: null,          // {type, obj} — currently selected shape for the Select & Edit tool
  selectedVertexIndex: null,
  draggingVertex: false
};

/* ---------------------------------------------------------------- undo */
/* Keeps up to 5 snapshots of the document (everything actually drawn on the
   map — not transient UI state like the current tool or selection). Every
   mutating action pushes a snapshot of how things looked *before* it runs;
   Ctrl+Z pops the most recent one and restores it. */
const UNDO_DOC_KEYS = ['rivers','parks','hills','roads','walls','zoneWalls','zones','nextId'];
const MAX_UNDO = 5;
const undoStack = [];
// "Clear entire map" uses an in-UI two-click confirm rather than the native
// confirm() dialog — confirm() is silently blocked in some sandboxed/embedded
// preview contexts, which made the button appear to do nothing at all.
let clearMapArmed = false;
let clearMapArmTimer = null;
function snapshotDoc(){
  const snap = {};
  UNDO_DOC_KEYS.forEach(k => { snap[k] = JSON.parse(JSON.stringify(state[k])); });
  return snap;
}
function pushUndo(){
  undoStack.push(snapshotDoc());
  if(undoStack.length > MAX_UNDO) undoStack.shift();
}
function performUndo(){
  if(undoStack.length === 0){ setStatus('Nothing to undo.'); return; }
  const snap = undoStack.pop();
  UNDO_DOC_KEYS.forEach(k => { state[k] = snap[k]; });
  // The underlying objects just got replaced wholesale, so any reference to
  // one of them (an active selection, a mid-drag vertex, a drawing in
  // progress) is now stale and needs clearing rather than left dangling.
  state.selection = null;
  state.selectedVertexIndex = null;
  state.draggingVertex = false;
  state.drawing = null;
  state.tool = null;
  if(state.selectedZoneId && !state.zones.find(z=>z.id===state.selectedZoneId)) state.selectedZoneId = null;
  setStatus('Undid last action.'+(undoStack.length ? '' : ' (nothing further to undo)'));
  renderAll();
}

const HOUSE_SPECS = {
  hovel:     {w:13, h:13, label:'Hovel'},
  rowhouse:  {w:17, h:29, label:'Rowhouse'},
  townhouse: {w:25, h:32, label:'Townhouse'},
  mansion:   {w:56, h:46, label:'Mansion'},
  industry:  {w:17, h:29, label:'Industry'} // small buildings are rowhouse-sized; occasional large ones are computed in autofillZoneIndustry
};
const DENSITY_GAP = {high:2, medium:9, low:22};

const STAGES = [
  {n:1, key:'natural', label:'Natural Features', tools:[
    {id:'river', label:'River / stream', kind:'open', swatch:'#5f7f8c'},
    {id:'park', label:'Park / green', kind:'closed', swatch:'#6f8f5a'},
    {id:'hill', label:'Hill contour', kind:'closed', swatch:'#a08a5a'}
  ]},
  {n:2, key:'infrastructure', label:'Infrastructure', tools:[
    {id:'road:thoroughfare', label:'Thoroughfare', kind:'open', swatch:'#4a3a24'},
    {id:'road:street', label:'Street', kind:'open', swatch:'#6a5638'},
    {id:'road:alley', label:'Alley', kind:'open', swatch:'#8a795c'},
    {id:'road:canal', label:'Canal', kind:'open', swatch:'#4a6a78'}
  ]},
  {n:3, key:'walls', label:'Walls & Boundary', tools:[
    {id:'wall', label:'Wall / boundary', kind:'closed', swatch:'#3a2c1a'}
  ]},
  {n:4, key:'zones', label:'Zoning', tools:[
    {id:'zone', label:'Draw zone', kind:'closed', swatch:'#b98a4a'},
    {id:'autozone', label:'Click enclosed area', kind:'click', swatch:'#7a9ab9'}
  ]},
  {n:5, key:'autofill', label:'Autofill', tools:[]}
];

/* --------------------------------------------------------------- seeded rng */
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function seedFor(id, salt){
  let h = 0, s = (id+':'+salt);
  for(let i=0;i<s.length;i++){ h = (h*31 + s.charCodeAt(i)) | 0; }
  return h;
}

/* --------------------------------------------------------------- geometry */
function centroid(pts){
  let x=0,y=0; pts.forEach(p=>{x+=p[0];y+=p[1];});
  return [x/pts.length, y/pts.length];
}
function pointInPoly(pt, poly){
  let x=pt[0], y=pt[1], inside=false;
  for(let i=0,j=poly.length-1;i<poly.length;j=i++){
    const xi=poly[i][0], yi=poly[i][1], xj=poly[j][0], yj=poly[j][1];
    const intersect = ((yi>y)!==(yj>y)) && (x < (xj-xi)*(y-yi)/((yj-yi)||1e-9) + xi);
    if(intersect) inside = !inside;
  }
  return inside;
}
function rotatePoint(p, c, ang){
  const s=Math.sin(ang), co=Math.cos(ang);
  const dx=p[0]-c[0], dy=p[1]-c[1];
  return [c[0] + dx*co - dy*s, c[1] + dx*s + dy*co];
}
function dist(a,b){ return Math.hypot(a[0]-b[0], a[1]-b[1]); }
function bbox(pts){
  let minx=Infinity,miny=Infinity,maxx=-Infinity,maxy=-Infinity;
  pts.forEach(p=>{ if(p[0]<minx)minx=p[0]; if(p[0]>maxx)maxx=p[0]; if(p[1]<miny)miny=p[1]; if(p[1]>maxy)maxy=p[1]; });
  return {minx,miny,maxx,maxy};
}

/* nearest road angle to a zone centroid, for building/grid orientation */
function nearestRoadAngle(zone){
  const c = centroid(zone.points);
  let best = null, bestD = Infinity;
  state.roads.forEach(r=>{
    for(let i=0;i<r.points.length-1;i++){
      const a=r.points[i], b=r.points[i+1];
      const mx=(a[0]+b[0])/2, my=(a[1]+b[1])/2;
      const d = dist(c,[mx,my]);
      if(d<bestD){ bestD=d; best=Math.atan2(b[1]-a[1], b[0]-a[0]); }
    }
  });
  return best === null ? 0 : best;
}
/* Direction of a polygon's longest edge — used to orient a single building
   (like a manor house) parallel to the most prominent straight side of its
   zone, rather than to a nearby road. */
function longestEdgeAngle(points){
  let bestLen = -1, bestAngle = 0;
  const n = points.length;
  for(let i=0;i<n;i++){
    const a = points[i], b = points[(i+1)%n];
    const len = dist(a,b);
    if(len > bestLen){ bestLen = len; bestAngle = Math.atan2(b[1]-a[1], b[0]-a[0]); }
  }
  return bestAngle;
}

/* closest point on a polyline to pt, plus distance and the segment used */
function distToPolyline(pt, points){
  let best=Infinity, bestPoint=points[0], bestSeg=[points[0],points[1]||points[0]];
  for(let i=0;i<points.length-1;i++){
    const a=points[i], b=points[i+1];
    const abx=b[0]-a[0], aby=b[1]-a[1];
    const len2 = abx*abx+aby*aby || 1e-9;
    let t = ((pt[0]-a[0])*abx + (pt[1]-a[1])*aby)/len2;
    t = Math.max(0, Math.min(1, t));
    const px=a[0]+abx*t, py=a[1]+aby*t;
    const d = Math.hypot(pt[0]-px, pt[1]-py);
    if(d<best){ best=d; bestPoint=[px,py]; bestSeg=[a,b]; }
  }
  return {dist:best, point:bestPoint, seg:bestSeg};
}

/* corners of a w x h rectangle centred at `center`, rotated by `angle` */
function rectCorners(center, w, h, angle){
  const [cx,cy]=center;
  return [[-w/2,-h/2],[w/2,-h/2],[w/2,h/2],[-w/2,h/2]]
    .map(p=>rotatePoint([cx+p[0], cy+p[1]], center, angle));
}
/* corners + edge midpoints + centre — used for containment/clearance testing.
   Corners alone can miss a road or river that cuts straight through the
   middle of a candidate building without passing near any corner. */
function rectSamplePoints(center, w, h, angle){
  const local = [[-w/2,-h/2],[w/2,-h/2],[w/2,h/2],[-w/2,h/2],
                 [0,-h/2],[0,h/2],[-w/2,0],[w/2,0],[0,0]];
  const [cx,cy]=center;
  return local.map(p=>rotatePoint([cx+p[0], cy+p[1]], center, angle));
}
/* half-extent of an oriented w x h box, projected onto world direction `dir` */
function projectedHalfExtent(w, h, angle, dir){
  const ux=[Math.cos(angle), Math.sin(angle)];
  const uy=[-Math.sin(angle), Math.cos(angle)];
  const dx=Math.abs(dir[0]*ux[0]+dir[1]*ux[1]);
  const dy=Math.abs(dir[0]*uy[0]+dir[1]*uy[1]);
  return dx*(w/2) + dy*(h/2);
}

/* hand-drawn wobble: turns a polyline into a slightly irregular smooth path.
   Jitter is derived from each point's own (quantised) coordinates rather than
   from the shape's id, so two shapes that share an endpoint — e.g. two roads
   meeting at a junction — end up wobbling to the *same* place and read as
   connected instead of drifting apart. */
function jitterKey(p){ return Math.round(p[0]*4)+','+Math.round(p[1]*4); }
function pointJitter(p, amplitude){
  if(amplitude<=0) return [p[0], p[1]];
  const rnd = mulberry32(seedFor(jitterKey(p), 'ptjit'));
  return [p[0] + (rnd()-0.5)*amplitude, p[1] + (rnd()-0.5)*amplitude];
}
function wobblePath(points, amplitude, closed){
  if(points.length < 2) return '';
  const pts = points.map(p=>pointJitter(p, amplitude));
  if(closed) pts.push(pts[0]);
  let d = 'M '+pts[0][0].toFixed(1)+' '+pts[0][1].toFixed(1)+' ';
  for(let i=1;i<pts.length;i++){
    const p0 = pts[i-1], p1 = pts[i];
    const mx = (p0[0]+p1[0])/2, my=(p0[1]+p1[1])/2;
    d += 'Q '+p0[0].toFixed(1)+' '+p0[1].toFixed(1)+' '+mx.toFixed(1)+' '+my.toFixed(1)+' ';
  }
  d += 'L '+pts[pts.length-1][0].toFixed(1)+' '+pts[pts.length-1][1].toFixed(1);
  return d;
}
function straightPath(points, closed){
  let d = 'M '+points.map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' L ');
  if(closed) d += ' Z';
  return d;
}

/* ---------------------------------------------------------------- style defs */
const STYLE_PARAMS = {
  // Modelled on a classic procedurally-generated fantasy city map: flat warm
  // ground with a faint surveyor's grid, roof-shaded gradient buildings
  // clustered tight, blank cream streets, and a solid wall studded with
  // round towers and gatehouses.
  medieval:   {parchment:'#f1dcc0', ink:'#241a10', inkSoft:'#5c4530', wobble:1.8, riverWobble:2.6, lineScale:1.1, hillMode:'bumps',
               noiseOpacity:0, vignetteOpacity:0.06, blankBuildings:false, blankRoads:false,
               gridOverlay:true, gradientBuildings:true, buildingOutline:'#6b2a1c',
               roadFillColor:'#f4ecd8', roadHaloOpacity:0.06, roadTread:false, wallStyle:'towers'},
  renaissance:{parchment:'#e8d7ae', ink:'#2e2015', inkSoft:'#5a3f26', wobble:2.8, riverWobble:3.5, lineScale:1.0, hillMode:'shaded',
               noiseOpacity:0.4, vignetteOpacity:0.3, blankBuildings:false, blankRoads:false,
               gridOverlay:false, gradientBuildings:false, buildingOutline:null,
               roadFillColor:'#efe6cf', roadHaloOpacity:0.18, roadTread:true, wallStyle:'crenellation'},
  // Modelled on genuine Ordnance Survey town plans: pale flat paper, thin near-
  // black precise linework, buildings left blank (outline only, no colour or
  // hatching), streets left blank with thin "cased" double-line edges.
  victorian:  {parchment:'#e8e2d1', ink:'#201c14', inkSoft:'#4a4436', wobble:0.5, riverWobble:0.8, lineScale:0.55, hillMode:'hachure',
               noiseOpacity:0.12, vignetteOpacity:0.08, blankBuildings:true, blankRoads:true, buildingBlankFill:'#f1ecdd',
               gridOverlay:false, gradientBuildings:false, buildingOutline:null,
               roadFillColor:'#c9b98c', roadHaloOpacity:0.18, roadTread:true, wallStyle:'crenellation'}
};
function sp(){ return STYLE_PARAMS[state.style]; }

/* ---------------------------------------------------------------- SVG setup */
const svg = document.getElementById('map');
const gNatural = document.getElementById('layer-natural');
const gInfra = document.getElementById('layer-infrastructure');
const gWalls = document.getElementById('layer-walls');
const gZones = document.getElementById('layer-zones');
const gBuildings = document.getElementById('layer-buildings');
const gBackground = document.getElementById('layer-background');
const gFrame = document.getElementById('layer-decoration');
const gDrawing = document.getElementById('layer-drawing');
const gHandles = document.getElementById('layer-handles');
const zoomIndicator = document.getElementById('zoomIndicator');
const defs = document.getElementById('mapDefs');
const NS = 'http://www.w3.org/2000/svg';

function el(tag, attrs){
  const e = document.createElementNS(NS, tag);
  for(const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}
function clear(node){ while(node.firstChild) node.removeChild(node.firstChild); }

function svgPoint(evt){
  const pt = svg.createSVGPoint();
  pt.x = evt.clientX; pt.y = evt.clientY;
  const ctm = svg.getScreenCTM().inverse();
  const p = pt.matrixTransform(ctm);
  return [Math.round(p.x), Math.round(p.y)];
}

/* ---------------------------------------------------------------- camera (zoom/pan) */
const MAP_W = 3200, MAP_H = 2000;
const camera = {x:0, y:0, w:MAP_W, h:MAP_H};
const CAMERA_MIN_W = 160;   // most zoomed in (~20x on this canvas) — kept fixed in absolute terms since it's calibrated to comfortably inspect individual buildings, not to the overall canvas size
const CAMERA_MAX_W = MAP_W; // most zoomed out (whole map)
function applyCamera(){
  svg.setAttribute('viewBox', `${camera.x.toFixed(1)} ${camera.y.toFixed(1)} ${camera.w.toFixed(1)} ${camera.h.toFixed(1)}`);
  zoomIndicator.textContent = Math.round((MAP_W/camera.w)*100)+'%';
}
svg.addEventListener('wheel', (e)=>{
  e.preventDefault();
  const rect = svg.getBoundingClientRect();
  const fracX = (e.clientX-rect.left)/rect.width;
  const fracY = (e.clientY-rect.top)/rect.height;
  const worldX = camera.x + fracX*camera.w;
  const worldY = camera.y + fracY*camera.h;
  const factor = Math.pow(1.0016, e.deltaY);
  let newW = camera.w * factor;
  newW = Math.min(CAMERA_MAX_W, Math.max(CAMERA_MIN_W, newW));
  const newH = newW / (MAP_W/MAP_H);
  camera.x = worldX - fracX*newW;
  camera.y = worldY - fracY*newH;
  camera.w = newW; camera.h = newH;
  applyCamera();
}, {passive:false});

let panState = null;
svg.addEventListener('mousedown', (e)=>{
  if(e.button===1){
    e.preventDefault();
    panState = {startX:e.clientX, startY:e.clientY, camX:camera.x, camY:camera.y};
  }
});
window.addEventListener('mousemove', (e)=>{
  if(!panState) return;
  const rect = svg.getBoundingClientRect();
  const scaleX = camera.w/rect.width, scaleY = camera.h/rect.height;
  camera.x = panState.camX - (e.clientX-panState.startX)*scaleX;
  camera.y = panState.camY - (e.clientY-panState.startY)*scaleY;
  applyCamera();
});
window.addEventListener('mouseup', (e)=>{
  if(e.button===1) panState = null;
});
svg.addEventListener('auxclick', (e)=>{ if(e.button===1) e.preventDefault(); });
applyCamera();

/* ---------------------------------------------------------------- defs (patterns, filters) */
function buildDefs(){
  clear(defs);
  const s = sp();

  // parchment noise filter
  const noiseFilter = el('filter', {id:'parchmentNoise', x:'-5%', y:'-5%', width:'110%', height:'110%'});
  noiseFilter.appendChild(el('feTurbulence', {type:'fractalNoise', baseFrequency:'0.012 0.018', numOctaves:'3', seed:'7', result:'noise'}));
  const cm = el('feColorMatrix', {in:'noise', type:'matrix', values:'0 0 0 0 0.35  0 0 0 0 0.28  0 0 0 0 0.15  0 0 0 0.06 0'});
  noiseFilter.appendChild(cm);
  const composite = el('feComposite', {in2:'SourceGraphic', operator:'over'});
  noiseFilter.appendChild(composite);
  defs.appendChild(noiseFilter);

  // vignette
  const vign = el('radialGradient', {id:'vignette', cx:'50%', cy:'45%', r:'75%'});
  vign.appendChild(el('stop', {offset:'60%', 'stop-color':'#000', 'stop-opacity':'0'}));
  vign.appendChild(el('stop', {offset:'100%', 'stop-color':'#2a1c0e', 'stop-opacity':String(s.vignetteOpacity)}));
  defs.appendChild(vign);

  // roof hatch patterns (two ridge orientations) — transparent background, lines only,
  // so they can be layered over a solid building-colour fill underneath.
  ['a','b'].forEach((variant, vi)=>{
    const pat = el('pattern', {id:'hatch-'+variant, patternUnits:'userSpaceOnUse', width:'6', height:'6',
      patternTransform: vi===0? 'rotate(45)':'rotate(-45)'});
    pat.appendChild(el('line', {x1:'0', y1:'0', x2:'0', y2:'6', stroke:s.ink, 'stroke-width': (s.lineScale*0.7).toFixed(2), opacity:'0.6'}));
    defs.appendChild(pat);
  });

  // water fill — renaissance reads a deeper, richer blue; every other style
  // keeps the existing softer blue-grey
  const waterColors = state.style==='renaissance' ? ['#4a7a9e', '#2f5a7a'] : ['#93aeb8', '#7a97a3'];
  const waterGrad = el('linearGradient', {id:'waterFill', x1:'0', y1:'0', x2:'1', y2:'1'});
  waterGrad.appendChild(el('stop', {offset:'0%', 'stop-color':waterColors[0]}));
  waterGrad.appendChild(el('stop', {offset:'100%', 'stop-color':waterColors[1]}));
  defs.appendChild(waterGrad);

  // faint surveyor's grid (medieval-style flat ground)
  const gridPat = el('pattern', {id:'mapGrid', patternUnits:'userSpaceOnUse', width:'42', height:'42'});
  gridPat.appendChild(el('path', {d:'M 42 0 L 0 0 0 42', fill:'none', stroke:s.ink, 'stroke-opacity':'0.08', 'stroke-width':'1'}));
  defs.appendChild(gridPat);

  // roof-light gradient for gradient-shaded buildings (medieval style): sunlit
  // top-left corner fading to a shadowed bottom-right, like a lit pitched roof
  const bGrad = el('linearGradient', {id:'buildingGrad', x1:'0%', y1:'0%', x2:'100%', y2:'100%'});
  bGrad.appendChild(el('stop', {offset:'0%', 'stop-color':'#ecb489'}));
  bGrad.appendChild(el('stop', {offset:'100%', 'stop-color':'#a83a26'}));
  defs.appendChild(bGrad);

  // same lit-roof shading, but light-to-mid grey — mansions are stone/slate,
  // not the warm brick/thatch tone used for everything else
  const bGradMansion = el('linearGradient', {id:'buildingGradMansion', x1:'0%', y1:'0%', x2:'100%', y2:'100%'});
  bGradMansion.appendChild(el('stop', {offset:'0%', 'stop-color':'#d9d9d9'}));
  bGradMansion.appendChild(el('stop', {offset:'100%', 'stop-color':'#8a8a8a'}));
  defs.appendChild(bGradMansion);

  // heavier mid-to-dark grey for industrial buildings — noticeably darker
  // than the mansion gradient so the two don't read as the same colour
  const bGradIndustry = el('linearGradient', {id:'buildingGradIndustry', x1:'0%', y1:'0%', x2:'100%', y2:'100%'});
  bGradIndustry.appendChild(el('stop', {offset:'0%', 'stop-color':'#8a8a8a'}));
  bGradIndustry.appendChild(el('stop', {offset:'100%', 'stop-color':'#4a4a4a'}));
  defs.appendChild(bGradIndustry);
}

/* ---------------------------------------------------------------- render: background/frame */
function renderFrame(){
  clear(gBackground);
  clear(gFrame);
  const w=MAP_W,h=MAP_H;
  const s = sp();

  // --- bottom layer: opaque background, must sit under every drawn shape ---
  const bg = el('rect', {x:0,y:0,width:w,height:h, fill:s.parchment});
  gBackground.appendChild(bg);
  if(s.gridOverlay){
    gBackground.appendChild(el('rect', {x:0,y:0,width:w,height:h, fill:'url(#mapGrid)'}));
  } else {
    gBackground.appendChild(el('rect', {x:0,y:0,width:w,height:h, filter:'url(#parchmentNoise)', opacity:String(s.noiseOpacity)}));
  }

  // --- top layer: decorations drawn over the finished map ---
  const vig = el('rect', {x:0,y:0,width:w,height:h, fill:'url(#vignette)', 'pointer-events':'none'});
  gFrame.appendChild(vig);

  // decorative border
  const margin = 22;
  const border = el('rect', {x:margin,y:margin,width:w-margin*2,height:h-margin*2, fill:'none',
    stroke:s.ink, 'stroke-width': state.style==='renaissance' ? 2.6 : 1.4});
  gFrame.appendChild(border);
  if(state.style==='renaissance'){
    const border2 = el('rect', {x:margin+7,y:margin+7,width:w-(margin+7)*2,height:h-(margin+7)*2, fill:'none',
      stroke:s.ink, 'stroke-width':1, 'stroke-dasharray':'1 3'});
    gFrame.appendChild(border2);
  }

  // compass rose
  drawCompass(w-100, h-100, s);

  // scale bar (every style — the medieval reference carries one too)
  {
    const bx=margin+20, by=h-margin-24;
    gFrame.appendChild(el('line',{x1:bx,y1:by,x2:bx+120,y2:by, stroke:s.ink,'stroke-width':1.4}));
    for(let i=0;i<=4;i++){
      gFrame.appendChild(el('line',{x1:bx+i*30,y1:by-5,x2:bx+i*30,y2:by+5, stroke:s.ink,'stroke-width':1}));
    }
    const t = el('text', {x:bx, y:by+18, 'font-size':'10', fill:s.ink, 'font-family':'Georgia,serif'});
    t.textContent = state.style==='medieval' ? '0     50     100 m' : '0            120 rods';
    gFrame.appendChild(t);
  }

  // title cartouche
  const t2 = el('text', {x:w/2, y:60, 'text-anchor':'middle', 'font-size': state.style==='medieval'?30:22,
    fill:s.ink, 'font-family': state.style==='victorian' ? 'Georgia,serif' : 'Palatino,Georgia,serif',
    'font-style': state.style==='renaissance'?'italic':'normal', 'letter-spacing':'2'});
  if(state.style==='medieval'){
    // gold-on-dark embossed look, like painted lettering on a fantasy map
    t2.setAttribute('fill', '#f2dfa8');
    t2.setAttribute('stroke', s.ink);
    t2.setAttribute('stroke-width', '1.4');
    t2.setAttribute('paint-order', 'stroke fill');
    t2.setAttribute('font-weight', '700');
  }
  t2.textContent = state.style==='medieval' ? 'Ye Towne, Herein Depicted' :
                    state.style==='renaissance' ? 'A True Prospect of the Towne' :
                    'Ordnance Plan of the Town';
  gFrame.appendChild(t2);
}

function drawCompass(cx, cy, s){
  const r = 34;
  const g = el('g', {});
  g.appendChild(el('circle', {cx,cy,r, fill:'none', stroke:s.ink, 'stroke-width':1}));
  const dirs = [[0,-1,'N'],[1,0,'E'],[0,1,'S'],[-1,0,'W']];
  dirs.forEach(([dx,dy,label])=>{
    g.appendChild(el('line', {x1:cx, y1:cy, x2:cx+dx*r*0.9, y2:cy+dy*r*0.9, stroke:s.ink, 'stroke-width': label==='N'?1.6:1}));
    const t = el('text', {x:cx+dx*(r+12), y:cy+dy*(r+12)+4, 'text-anchor':'middle', 'font-size':11, fill:s.ink});
    t.textContent = label;
    g.appendChild(t);
  });
  if(state.style !== 'victorian'){
    const star = el('polygon', {points:`${cx},${cy-8} ${cx+3},${cy-2} ${cx+8},${cy} ${cx+3},${cy+2} ${cx},${cy+8} ${cx-3},${cy+2} ${cx-8},${cy} ${cx-3},${cy-2}`,
      fill:s.ink});
    g.appendChild(star);
  }
  gFrame.appendChild(g);
}

/* ---------------------------------------------------------------- render: natural */
function renderNatural(){
  clear(gNatural);
  gNatural.style.display = state.layers.natural ? '' : 'none';
  const s = sp();

  state.parks.forEach(shape=>{
    const d = wobblePath(shape.points, s.wobble, true);
    gNatural.appendChild(el('path', {d, fill:'#7c9a63', 'fill-opacity':'0.55', stroke:s.inkSoft, 'stroke-width':1.1*s.lineScale}));
    // scattered tree glyphs
    const rnd = mulberry32(seedFor(shape.id,'trees'));
    const bb = bbox(shape.points);
    const area = (bb.maxx-bb.minx)*(bb.maxy-bb.miny);
    const n = Math.min(60, Math.max(4, Math.floor(area/900)));
    for(let i=0;i<n;i++){
      const p=[bb.minx+rnd()*(bb.maxx-bb.minx), bb.miny+rnd()*(bb.maxy-bb.miny)];
      if(!pointInPoly(p, shape.points)) continue;
      gNatural.appendChild(el('circle', {cx:p[0], cy:p[1], r: 2.2+rnd()*1.8, fill:'#4f6a3d', opacity:0.75}));
    }
  });

  state.hills.forEach(shape=>{
    if(s.hillMode==='hachure'){
      // Victorian hachures: short strokes perpendicular to contour, denser toward centre
      const c = centroid(shape.points);
      const d = wobblePath(shape.points, s.wobble*0.6, true);
      gNatural.appendChild(el('path', {d, fill:'none', stroke:s.ink, 'stroke-width':0.9}));
      const rnd = mulberry32(seedFor(shape.id,'hach'));
      for(let i=0;i<shape.points.length;i++){
        const a = shape.points[i], b = shape.points[(i+1)%shape.points.length];
        const steps = Math.max(2, Math.floor(dist(a,b)/10));
        for(let k=0;k<steps;k++){
          const t = k/steps;
          const px = a[0]+(b[0]-a[0])*t, py = a[1]+(b[1]-a[1])*t;
          const dirx = (c[0]-px), diry=(c[1]-py);
          const len = Math.hypot(dirx,diry)||1;
          const len2 = 6+rnd()*4;
          gNatural.appendChild(el('line', {x1:px, y1:py, x2:px+dirx/len*len2, y2:py+diry/len*len2,
            stroke:s.ink, 'stroke-width':0.7, opacity:0.75}));
        }
      }
    } else if(s.hillMode==='shaded'){
      const c = centroid(shape.points);
      [1,0.6,0.3].forEach((scale,i)=>{
        const pts = shape.points.map(p=>[c[0]+(p[0]-c[0])*scale, c[1]+(p[1]-c[1])*scale]);
        const d = wobblePath(pts, s.wobble*0.7, true);
        gNatural.appendChild(el('path', {d, fill: i===2?'#8a7548':'none', 'fill-opacity':0.4,
          stroke:s.inkSoft, 'stroke-width':0.9}));
      });
    } else {
      // medieval: little bump clusters (molehill convention)
      const rnd = mulberry32(seedFor(shape.id,'bumps'));
      shape.points.forEach((p,i)=>{
        const next = shape.points[(i+1)%shape.points.length];
        const steps = Math.max(1, Math.floor(dist(p,next)/16));
        for(let k=0;k<steps;k++){
          const t=k/steps;
          const bx = p[0]+(next[0]-p[0])*t + (rnd()-0.5)*6;
          const by = p[1]+(next[1]-p[1])*t + (rnd()-0.5)*6;
          const r = 5+rnd()*4;
          gNatural.appendChild(el('path', {d:`M ${bx-r} ${by} Q ${bx} ${by-r*1.3} ${bx+r} ${by}`,
            fill:'none', stroke:s.ink, 'stroke-width':1.1}));
        }
      });
    }
  });

  // Drawn in shared passes across every river, same approach used for road
  // junctions: the bank-line outline is fully opaque rather than semi-
  // transparent, so where two rivers cross their overlapping strokes don't
  // stack into a visibly darker blob — the later one just paints cleanly
  // over the earlier one, and the join reads as a single continuous shape.
  const riverPaths = state.rivers.map(shape => ({
    shape, d: wobblePath(shape.points, s.riverWobble, false), w: shape.width || 14
  }));
  riverPaths.forEach(({shape, d, w})=>{
    gNatural.appendChild(el('path', {d, fill:'none', stroke:'url(#waterFill)', 'stroke-width':w, 'stroke-linecap':'round', 'stroke-linejoin':'round'}));
  });
  riverPaths.forEach(({d})=>{
    gNatural.appendChild(el('path', {d, fill:'none', stroke:s.inkSoft, 'stroke-width':1, 'stroke-linecap':'round', 'stroke-linejoin':'round'}));
  });
  if(state.style!=='victorian'){
    riverPaths.forEach(({shape})=>{
      // ripple ticks
      const rnd = mulberry32(seedFor(shape.id,'ripple'));
      for(let i=0;i<shape.points.length-1;i++){
        const a=shape.points[i], b=shape.points[i+1];
        const steps = Math.max(1,Math.floor(dist(a,b)/20));
        for(let k=0;k<steps;k++){
          const t=(k+0.5)/steps;
          const px=a[0]+(b[0]-a[0])*t, py=a[1]+(b[1]-a[1])*t;
          gNatural.appendChild(el('path', {d:`M ${px-5} ${py+(rnd()-0.5)*3} q 5 -3 10 0`, fill:'none', stroke:'#eef3f4', 'stroke-width':0.8, opacity:0.5}));
        }
      }
    });
  }
}

/* ---------------------------------------------------------------- render: infrastructure */
const ROAD_STYLE = {
  thoroughfare: {w:16, dash:null},
  street: {w:9, dash:null},
  alley: {w:4, dash:null},
  canal: {w:12, dash:null}
};
/* A road's drawn width — normally the fixed per-type default, but canals may
   carry their own custom width set from the drawing-time slider. */
function roadWidth(r){ return r.width || ROAD_STYLE[r.type].w; }
function renderInfra(){
  clear(gInfra);
  gInfra.style.display = state.layers.infrastructure ? '' : 'none';
  const s = sp();
  // Draw widest roads first so narrower roads blend *into* them at junctions
  // rather than stacking a visibly different edge on top.
  const order = {thoroughfare:0, canal:1, street:2, alley:3};
  const sorted = [...state.roads].sort((a,b)=>order[a.type]-order[b.type]);
  const pathFor = r => r.type==='alley' ? straightPath(r.points, false) : wobblePath(r.points, s.wobble, false);

  if(s.blankRoads){
    // Ordnance-Survey town-plan style: the street itself is left blank
    // (paper colour) and only shown by a thin "cased" edge — a dark stroke
    // with a slightly narrower paper-coloured stroke on top of it, which
    // leaves just a hairline of ink visible on each side. Alleys are too
    // thin at this scale for that double-line treatment to leave any room
    // for the inner stroke, so they get a single solid mid-grey line instead.
    sorted.forEach(r=>{
      const d = pathFor(r);
      const w = roadWidth(r)*s.lineScale;
      if(r.type==='canal'){
        gInfra.appendChild(el('path', {d, fill:'none', stroke:'url(#waterFill)', 'stroke-width':w, 'stroke-linecap':'round', 'stroke-linejoin':'round'}));
        gInfra.appendChild(el('path', {d, fill:'none', stroke:s.ink, 'stroke-width':1, 'stroke-linecap':'round', 'stroke-linejoin':'round'}));
        return;
      }
      if(r.type==='alley'){
        gInfra.appendChild(el('path', {d, fill:'none', stroke:'#8a8a8a', 'stroke-width':w, 'stroke-linecap':'round', 'stroke-linejoin':'round'}));
        return;
      }
      gInfra.appendChild(el('path', {d, fill:'none', stroke:s.ink, 'stroke-width':w, 'stroke-linecap':'round', 'stroke-linejoin':'round'}));
      const innerW = w - 2.2;
      if(innerW > 0.6){
        gInfra.appendChild(el('path', {d, fill:'none', stroke:s.parchment, 'stroke-width':innerW, 'stroke-linecap':'round', 'stroke-linejoin':'round'}));
        // faint dashed tread line hinting at a pavement edge
        gInfra.appendChild(el('path', {d, fill:'none', stroke:s.inkSoft, 'stroke-width':0.5, opacity:0.4, 'stroke-dasharray':'1.5 3'}));
      }
    });
    return;
  }

  // pass 1 — soft halo (skip canals, water reads differently)
  sorted.forEach(r=>{
    if(r.type==='canal') return;
    gInfra.appendChild(el('path', {d:pathFor(r), fill:'none', stroke:s.ink, opacity:s.roadHaloOpacity,
      'stroke-width':(roadWidth(r)+3)*s.lineScale, 'stroke-linecap':'round', 'stroke-linejoin':'round'}));
  });
  // pass 2 — solid fill, same colour per tier so junctions merge seamlessly
  sorted.forEach(r=>{
    const d = pathFor(r);
    if(r.type==='canal'){
      gInfra.appendChild(el('path', {d, fill:'none', stroke:'url(#waterFill)', 'stroke-width':roadWidth(r)*s.lineScale, 'stroke-linecap':'round', 'stroke-linejoin':'round'}));
      gInfra.appendChild(el('path', {d, fill:'none', stroke:s.ink, 'stroke-width':1, 'stroke-linecap':'round', 'stroke-linejoin':'round'}));
    } else {
      gInfra.appendChild(el('path', {d, fill:'none', stroke:s.roadFillColor,
        'stroke-width':roadWidth(r)*s.lineScale, 'stroke-linecap':'round', 'stroke-linejoin':'round'}));
    }
  });
  // pass 3 — fine edge/tread detail, subtle so it doesn't create seams across junctions
  if(s.roadTread){
    sorted.forEach(r=>{
      if(r.type==='canal') return;
      gInfra.appendChild(el('path', {d:pathFor(r), fill:'none', stroke:s.inkSoft, 'stroke-width':0.7,
        'stroke-dasharray': r.type==='alley' ? '2 3' : 'none', opacity:0.35, 'stroke-linecap':'round', 'stroke-linejoin':'round'}));
    });
  }
}

/* ---------------------------------------------------------------- render: walls */
function renderWalls(){
  clear(gWalls);
  gWalls.style.display = state.layers.walls ? '' : 'none';
  const s = sp();
  state.walls.forEach(wall=>{
  const pts = wall.points;
  const d = straightPath(pts, true);
  gWalls.appendChild(el('path', {d, fill:'none', stroke:s.ink, 'stroke-width':(s.wallStyle==='towers'?5.5:4.5)*s.lineScale,
    'stroke-linecap':'round', 'stroke-linejoin':'miter'}));

  if(s.wallStyle==='towers'){
    // round towers spaced along the wall, fantasy-map style
    for(let i=0;i<pts.length;i++){
      const a=pts[i], b=pts[(i+1)%pts.length];
      const segLen = dist(a,b);
      if(segLen < 1) continue;
      const steps = Math.max(1, Math.round(segLen/48));
      for(let k=0;k<steps;k++){
        const t=k/steps;
        const px=a[0]+(b[0]-a[0])*t, py=a[1]+(b[1]-a[1])*t;
        gWalls.appendChild(el('circle', {cx:px, cy:py, r:5*s.lineScale, fill:s.ink}));
      }
    }
  } else {
    // crenellation ticks
    for(let i=0;i<pts.length;i++){
      const a=pts[i], b=pts[(i+1)%pts.length];
      const segLen = dist(a,b);
      const steps = Math.max(1, Math.floor(segLen/14));
      for(let k=0;k<steps;k++){
        const t=(k+0.5)/steps;
        const px=a[0]+(b[0]-a[0])*t, py=a[1]+(b[1]-a[1])*t;
        const nx = -(b[1]-a[1])/segLen, ny=(b[0]-a[0])/segLen;
        gWalls.appendChild(el('line', {x1:px, y1:py, x2:px+nx*5, y2:py+ny*5, stroke:s.ink, 'stroke-width':2}));
      }
    }
  }

  // gates: wherever a road crosses the wall line
  findGates(pts).forEach(g=>{
    if(s.wallStyle==='towers'){
      gWalls.appendChild(el('circle', {cx:g[0], cy:g[1], r:8*s.lineScale, fill:s.ink}));
      gWalls.appendChild(el('circle', {cx:g[0], cy:g[1], r:3*s.lineScale, fill:s.parchment}));
    } else {
      gWalls.appendChild(el('circle', {cx:g[0], cy:g[1], r:7, fill: sp().parchment, stroke:s.ink, 'stroke-width':2}));
      gWalls.appendChild(el('circle', {cx:g[0], cy:g[1], r:2.5, fill:s.ink}));
    }
  });
  });

  state.zoneWalls.forEach(zw=>renderOneZoneWall(zw, s));
}
/* A mansion zone's estate wall: a plain boundary line with no towers or
   crenellation ("without turrets"), plus a gate wherever a road crosses it —
   the same gate treatment as the city wall/boundary tool, just simpler. */
function renderOneZoneWall(zw, s){
  const pts = zw.points;
  const d = straightPath(pts, true);
  gWalls.appendChild(el('path', {d, fill:'none', stroke:s.ink, 'stroke-width':3*s.lineScale,
    'stroke-linecap':'round', 'stroke-linejoin':'miter'}));
  findGates(pts).forEach(g=>{
    gWalls.appendChild(el('circle', {cx:g[0], cy:g[1], r:6, fill: sp().parchment, stroke:s.ink, 'stroke-width':1.6}));
    gWalls.appendChild(el('circle', {cx:g[0], cy:g[1], r:2, fill:s.ink}));
  });
}
function segIntersect(p1,p2,p3,p4){
  const d1x=p2[0]-p1[0], d1y=p2[1]-p1[1];
  const d2x=p4[0]-p3[0], d2y=p4[1]-p3[1];
  const denom = d1x*d2y - d1y*d2x;
  if(Math.abs(denom) < 1e-9) return null;
  const t = ((p3[0]-p1[0])*d2y - (p3[1]-p1[1])*d2x)/denom;
  const u = ((p3[0]-p1[0])*d1y - (p3[1]-p1[1])*d1x)/denom;
  if(t>=0 && t<=1 && u>=0 && u<=1){
    return [p1[0]+d1x*t, p1[1]+d1y*t];
  }
  return null;
}
function findGates(wallPts){
  const gates = [];
  state.roads.forEach(r=>{
    for(let i=0;i<r.points.length-1;i++){
      for(let j=0;j<wallPts.length;j++){
        const w1=wallPts[j], w2=wallPts[(j+1)%wallPts.length];
        const hit = segIntersect(r.points[i], r.points[i+1], w1, w2);
        if(hit) gates.push(hit);
      }
    }
  });
  return gates;
}

/* ---------------------------------------------------------------- render: zones */
function renderZones(){
  clear(gZones);
  gZones.style.display = state.layers.zones ? '' : 'none';
  const s = sp();
  state.zones.forEach(z=>{
    // Drawn straight (no hand-drawn wobble): autofill now tiles zones edge-to-
    // edge with no gap or overlap, so the boundary must render exactly where
    // the fill algorithm thinks it is, not jittered away from it.
    const d = straightPath(z.points, true);
    const isSel = z.id === state.selectedZoneId;
    gZones.appendChild(el('path', {d, fill: isSel? '#d9a24b33' : '#00000006',
      stroke: isSel ? '#d9a24b' : s.inkSoft, 'stroke-width': isSel?1.6:0.8,
      'stroke-dasharray':'5 4'}));
    const c = centroid(z.points);
    const t = el('text', {x:c[0], y:c[1], 'text-anchor':'middle', 'font-size':10, fill:s.inkSoft, opacity:0.85});
    t.textContent = (z.houseSize? HOUSE_SPECS[z.houseSize].label : 'zone') + (z.density ? ' · '+z.density : '');
    gZones.appendChild(t);
  });
}

/* ---------------------------------------------------------------- render: buildings (autofill) */
function renderBuildings(){
  clear(gBuildings);
  gBuildings.style.display = state.layers.buildings ? '' : 'none';
  const s = sp();
  state.zones.forEach(z=>{
    (z.buildings||[]).forEach(b=>{
      const rnd = mulberry32(b.seed);
      const jx = (rnd()-0.5)*1.4, jy=(rnd()-0.5)*1.4;
      const jr = (rnd()-0.5)*(state.style==='victorian'?0.6:3);
      const c = [b.cx+jx, b.cy+jy];
      let corners;
      if(b.isCircle){
        const sides = 28;
        corners = [];
        for(let i=0;i<sides;i++){
          const theta = (i/sides)*Math.PI*2;
          corners.push([c[0]+Math.cos(theta)*b.radius, c[1]+Math.sin(theta)*b.radius]);
        }
      } else if(b.points){
        // clipped irregular footprint — jitter by translation only, no rotation
        corners = b.points.map(p=>[p[0]+jx, p[1]+jy]);
      } else {
        corners = rectCorners(c, b.w, b.h, b.angle + jr*Math.PI/180);
      }
      const d = straightPath(corners, true);
      const g = el('g', {});

      if(s.blankBuildings){
        // Ordnance-Survey style: no colour, no roof hatching — just a thin
        // outline on blank paper, as on a real town plan.
        g.appendChild(el('path', {d, fill:s.buildingBlankFill, stroke:s.ink, 'stroke-width':0.7*s.lineScale}));
        // A minority of footprints on real OS plans carry a small feature
        // cross (roof light, stack, survey mark); echo that sparingly.
        const markRnd = mulberry32(b.seed + 101);
        if(markRnd() < 0.16){
          const mr = Math.min(b.w,b.h)*0.16;
          g.appendChild(el('line', {x1:c[0]-mr, y1:c[1]-mr, x2:c[0]+mr, y2:c[1]+mr, stroke:s.ink, 'stroke-width':0.6}));
          g.appendChild(el('line', {x1:c[0]-mr, y1:c[1]+mr, x2:c[0]+mr, y2:c[1]-mr, stroke:s.ink, 'stroke-width':0.6}));
        }
      } else if(s.gradientBuildings){
        // Fantasy-city-map style: a single sunlit-to-shadowed gradient per
        // footprint, like a lit pitched roof — mansions get a grey (stone)
        // version and industrial buildings a darker grey (heavy/utilitarian)
        // instead of the warm brick tone used for everything else.
        const gradId = b.houseSize==='mansion' ? 'buildingGradMansion' : b.houseSize==='industry' ? 'buildingGradIndustry' : 'buildingGrad';
        g.appendChild(el('path', {d, fill:`url(#${gradId})`, stroke:s.buildingOutline, 'stroke-width':0.9*s.lineScale}));
      } else {
        const fillColor = b.houseSize==='mansion' ? '#a3a3a3' : b.houseSize==='townhouse' ? '#a8502f' : b.houseSize==='rowhouse' ? '#9a4527' : '#8c3f24';
        const patId = b.hatchVariant===0 ? 'hatch-a' : 'hatch-b';
        const base = el('path', {d, fill:fillColor, stroke:s.ink, 'stroke-width':0.9*s.lineScale});
        g.appendChild(base);
        const hatch = el('path', {d, fill:`url(#${patId})`, stroke:'none'});
        g.appendChild(hatch);
        if(b.houseSize==='mansion' && !b.points){
          // small ridge line
          g.appendChild(el('line', {x1:corners[0][0], y1:(corners[0][1]+corners[3][1])/2, x2:corners[1][0], y2:(corners[1][1]+corners[2][1])/2,
            stroke:s.ink, 'stroke-width':0.7, opacity:0.5}));
        }
      }
      gBuildings.appendChild(g);
    });
  });
}

/* ---------------------------------------------------------------- drawing (in-progress) */
function renderDrawing(){
  clear(gDrawing);
  if(!state.drawing) return;
  const s = sp();
  const pts = state.drawing.points;
  if(pts.length===0) return;
  const d = straightPath(pts, false);
  gDrawing.appendChild(el('path', {d, fill:'none', stroke:'#d9455033', 'stroke-width':2, 'stroke-dasharray':'4 3'}));
  pts.forEach((p,i)=>{
    gDrawing.appendChild(el('circle', {cx:p[0], cy:p[1], r:4, fill: i===0?'#4a6a3a':'#d94550', stroke:'#fff', 'stroke-width':1}));
  });
}

/* ---------------------------------------------------------------- render: OS-plan annotations */
/* Small authenticity touches unique to the Ordnance-Survey look: sparse lamp-
   post circles along the kerb of thoroughfares/streets, and a scatter of
   surveyed "spot height" figures (a dot + a decimal number) dropped onto
   open ground, well clear of buildings, roads and water. Victorian style only. */
function renderAnnotations(){
  if(!sp().blankRoads) return;
  const s = sp();

  state.roads.forEach(r=>{
    if(r.type==='alley' || r.type==='canal') return;
    const rnd = mulberry32(seedFor(r.id,'lamps'));
    for(let i=0;i<r.points.length-1;i++){
      const a=r.points[i], b=r.points[i+1];
      const segLen = dist(a,b);
      if(segLen < 1) continue;
      const steps = Math.max(1, Math.floor(segLen/70));
      for(let k=0;k<steps;k++){
        if(rnd() < 0.5) continue;
        const t=(k+0.5)/steps;
        const px=a[0]+(b[0]-a[0])*t, py=a[1]+(b[1]-a[1])*t;
        const nx=-(b[1]-a[1])/segLen, ny=(b[0]-a[0])/segLen;
        const off = (roadWidth(r)*s.lineScale)/2 + 5;
        gFrame.appendChild(el('circle', {cx:px+nx*off, cy:py+ny*off, r:1.6, fill:'none', stroke:s.ink, 'stroke-width':0.6}));
      }
    }
  });

  const rnd2 = mulberry32(42);
  let placed=0, attempts=0;
  while(placed<10 && attempts<400){
    attempts++;
    const x = 60+rnd2()*(MAP_W-120), y=90+rnd2()*(MAP_H-180);
    let bad = state.parks.some(p=>pointInPoly([x,y],p.points)) || state.zones.some(z=>pointInPoly([x,y],z.points));
    if(!bad) for(const r of state.rivers){ if(distToPolyline([x,y], r.points).dist < (r.width||14)/2+18){ bad=true; break; } }
    if(!bad) for(const r of state.roads){ if(distToPolyline([x,y], r.points).dist < (roadWidth(r)*s.lineScale)/2+14){ bad=true; break; } }
    if(bad) continue;
    placed++;
    gFrame.appendChild(el('circle', {cx:x, cy:y, r:1.3, fill:s.ink}));
    const t = el('text', {x:x+4, y:y+3, 'font-size':9, fill:s.ink, 'font-family':'Georgia,serif'});
    t.textContent = (10+Math.floor(rnd2()*40)) + '\u00b7' + Math.floor(rnd2()*9);
    gFrame.appendChild(t);
  }
}

/* ---------------------------------------------------------------- full render */
function renderAll(){
  buildDefs();
  renderFrame();
  renderNatural();
  renderInfra();
  renderWalls();
  renderZones();
  renderBuildings();
  renderAnnotations();
  renderDrawing();
  renderSelectionHandles();
  renderToolbar();
  renderRightPanel();
}

/* ---------------------------------------------------------------- interaction: drawing tools */
const TOOL_KIND = {}; // tool id -> 'open'|'closed'
STAGES.forEach(st => st.tools.forEach(t => TOOL_KIND[t.id] = t.kind));

const SNAP_RADIUS = 13;
function allExistingPoints(){
  const pts = [];
  state.rivers.forEach(s=>pts.push(...s.points));
  state.parks.forEach(s=>pts.push(...s.points));
  state.hills.forEach(s=>pts.push(...s.points));
  state.roads.forEach(s=>pts.push(...s.points));
  state.walls.forEach(w=>pts.push(...w.points));
  state.zones.forEach(s=>pts.push(...s.points));
  return pts;
}
// Snaps a freshly clicked point onto a nearby existing vertex (from any shape,
// road-to-road most importantly) so new lines actually terminate at a shared
// coordinate instead of merely passing near one — this is what makes junctions
// read as connected once the hand-drawn wobble is applied.
function snapPoint(p){
  let best=null, bestD=SNAP_RADIUS;
  allExistingPoints().forEach(q=>{
    const d = dist(p,q);
    if(d<bestD){ bestD=d; best=q; }
  });
  return best ? [best[0], best[1]] : p;
}

function startDrawing(toolId){
  state.tool = toolId;
  state.drawing = {kind:toolId, points:[]};
  state.selection = null; state.selectedVertexIndex = null;
  setStatus('Drawing '+toolId+'… click to add points.');
  renderAll();
}
function cancelDrawing(){
  state.drawing = null;
  state.tool = null;
  state.selection = null; state.selectedVertexIndex = null;
  setStatus('');
  renderAll();
}
function undoPoint(){
  if(state.drawing && state.drawing.points.length){
    state.drawing.points.pop();
    renderAll();
  }
}
function finishDrawing(){
  if(!state.drawing || state.drawing.points.length < 2){ cancelDrawing(); return; }
  pushUndo();
  const kind = state.drawing.kind;
  const pts = state.drawing.points.slice();
  const id = 'shape'+(state.nextId++);
  if(kind==='river') state.rivers.push({id, points:pts, width: state.drawing.width || 14});
  else if(kind==='park') state.parks.push({id, points:pts});
  else if(kind==='hill') state.hills.push({id, points:pts});
  else if(kind==='wall') state.walls.push({id, points:pts});
  else if(kind==='zone') state.zones.push({id, points:pts, houseSize:null, density:null, buildings:[]});
  else if(kind.startsWith('road:')){
    const roadType = kind.split(':')[1];
    const road = {id, type:roadType, points:pts};
    if(roadType==='canal' && state.drawing.width) road.width = state.drawing.width;
    state.roads.push(road);
  }
  // Stay in the same tool with a fresh, empty drawing ready to go — most of
  // the time people want to place several of the same thing in a row, and
  // re-clicking the tool button for every single one gets old fast.
  state.drawing = {kind, points:[]};
  if(kind==='zone') state.selectedZoneId = id;
  setStatus('Added '+kind+'. Ready to draw another — click to start, or pick a different tool.');
  renderAll();
}

svg.addEventListener('click', (e)=>{
  if(state.tool === 'autozone'){
    handleAutoZoneClick(svgPoint(e));
    return;
  }
  if(state.tool === 'select'){
    handleSelectClick(svgPoint(e));
    return;
  }
  if(!state.drawing){
    // maybe clicking a zone to select it (stage 4/5)
    if(state.stage===4 || state.stage===5){
      const p = svgPoint(e);
      const hit = [...state.zones].reverse().find(z=>pointInPoly(p, z.points));
      if(hit){ state.selectedZoneId = hit.id; renderAll(); }
    }
    return;
  }
  let p = svgPoint(e);
  // close polygon if clicking near first point
  if(TOOL_KIND[state.drawing.kind]==='closed' && state.drawing.points.length>2 && dist(p, state.drawing.points[0]) < 10){
    finishDrawing();
    return;
  }
  p = snapPoint(p);
  state.drawing.points.push(p);
  renderAll();
});
svg.addEventListener('dblclick', (e)=>{
  e.preventDefault();
  if(state.drawing) finishDrawing();
});
window.addEventListener('keydown', (e)=>{
  if((e.ctrlKey || e.metaKey) && !e.shiftKey && (e.key==='z' || e.key==='Z')){
    e.preventDefault();
    performUndo();
    return;
  }
  if(e.key==='Escape') cancelDrawing();
  else if(e.key==='Enter') finishDrawing();
  else if(e.key==='Backspace' && state.drawing){ e.preventDefault(); undoPoint(); }
  else if((e.key==='Delete' || e.key==='Backspace') && state.tool==='select' && state.selection && state.selectedVertexIndex!==null){
    e.preventDefault();
    deleteSelectedVertex();
  }
});

function setStatus(msg){ document.getElementById('statusMsg').textContent = msg; }

/* ---------------------------------------------------------------- select & edit tool */
/* Lets the person click any previously-drawn shape (natural feature, road,
   wall or zone) and reshape it: drag its points, click its own edge again to
   insert a new point, or press Delete to remove the focused point. */
function allEditableShapeEntries(){
  // ordered roughly bottom-to-top to match visual stacking, reversed at use time
  const list = [];
  state.rivers.forEach(o=>list.push({type:'river', obj:o}));
  state.parks.forEach(o=>list.push({type:'park', obj:o}));
  state.hills.forEach(o=>list.push({type:'hill', obj:o}));
  state.roads.forEach(o=>list.push({type:'road', obj:o}));
  state.walls.forEach(o=>list.push({type:'wall', obj:o}));
  state.zones.forEach(o=>list.push({type:'zone', obj:o}));
  return list;
}
function isClosedShapeType(type){ return type!=='river' && type!=='road'; }
function distToClosedPolyline(p, points){
  let best = distToPolyline(p, points).dist;
  if(points.length>1){
    const wrap = distToPolyline(p, [points[points.length-1], points[0]]).dist;
    if(wrap<best) best = wrap;
  }
  return best;
}
/* Point containment test for a building footprint, whether it's a plain
   rectangle (cx/cy/w/h/angle) or a custom polygon (points) from a manual
   vertex edit. */
function pointInBuilding(p, b){
  if(b.points) return pointInPoly(p, b.points);
  const dx=p[0]-b.cx, dy=p[1]-b.cy;
  const ca=Math.cos(-b.angle), sa=Math.sin(-b.angle);
  const lx=dx*ca-dy*sa, ly=dx*sa+dy*ca;
  return Math.abs(lx)<=b.w/2 && Math.abs(ly)<=b.h/2;
}
function hitTestShapes(p){
  // individual buildings sit on top of everything else visually
  if(state.layers.buildings){
    for(let zi=state.zones.length-1; zi>=0; zi--){
      const z = state.zones[zi];
      const blds = z.buildings || [];
      for(let bi=blds.length-1; bi>=0; bi--){
        if(pointInBuilding(p, blds[bi])) return {type:'building', obj:blds[bi], zone:z};
      }
    }
  }
  // test in top-to-bottom visual stacking order: zones, wall, roads, hills, parks, rivers
  for(let i=state.zones.length-1;i>=0;i--){
    if(pointInPoly(p, state.zones[i].points)) return {type:'zone', obj:state.zones[i]};
  }
  for(let i=state.walls.length-1;i>=0;i--){
    if(distToClosedPolyline(p, state.walls[i].points) <= 9) return {type:'wall', obj:state.walls[i]};
  }
  for(let i=state.roads.length-1;i>=0;i--){
    const r = state.roads[i];
    const tol = Math.max(8, (roadWidth(r)*sp().lineScale)/2 + 4);
    if(distToPolyline(p, r.points).dist <= tol) return {type:'road', obj:r};
  }
  for(let i=state.hills.length-1;i>=0;i--){
    if(pointInPoly(p, state.hills[i].points)) return {type:'hill', obj:state.hills[i]};
  }
  for(let i=state.parks.length-1;i>=0;i--){
    if(pointInPoly(p, state.parks[i].points)) return {type:'park', obj:state.parks[i]};
  }
  for(let i=state.rivers.length-1;i>=0;i--){
    const r = state.rivers[i];
    const tol = Math.max(8, (r.width||14)/2 + 4);
    if(distToPolyline(p, r.points).dist <= tol) return {type:'river', obj:r};
  }
  return null;
}
function closestSegmentInsert(p, points, closed){
  let best=Infinity, bestIdx=0, bestPoint=points[0];
  const n = points.length;
  const segCount = closed ? n : n-1;
  for(let i=0;i<segCount;i++){
    const a=points[i], b=points[(i+1)%n];
    const {dist:d, point} = distToPolyline(p, [a,b]);
    if(d<best){ best=d; bestIdx=i; bestPoint=point; }
  }
  return {index:bestIdx, point:bestPoint, dist:best};
}
function selectionStillValid(){
  if(!state.selection) return false;
  const {type, obj} = state.selection;
  if(type==='river') return state.rivers.includes(obj);
  if(type==='park') return state.parks.includes(obj);
  if(type==='hill') return state.hills.includes(obj);
  if(type==='road') return state.roads.includes(obj);
  if(type==='wall') return state.walls.includes(obj);
  if(type==='zone') return state.zones.includes(obj);
  if(type==='building') return !!(state.selection.zone && state.selection.zone.buildings && state.selection.zone.buildings.includes(obj));
  return false;
}
function removeSelectedShape(){
  if(!state.selection) return;
  pushUndo();
  const {type, obj} = state.selection;
  if(type==='river') state.rivers.splice(state.rivers.indexOf(obj),1);
  else if(type==='park') state.parks.splice(state.parks.indexOf(obj),1);
  else if(type==='hill') state.hills.splice(state.hills.indexOf(obj),1);
  else if(type==='road') state.roads.splice(state.roads.indexOf(obj),1);
  else if(type==='wall') state.walls.splice(state.walls.indexOf(obj),1);
  else if(type==='zone'){
    state.zones.splice(state.zones.indexOf(obj),1);
    removeZoneAlleys(obj.id);
    removeZoneWalls(obj.id);
    if(state.selectedZoneId===obj.id) state.selectedZoneId = null;
  }
  else if(type==='building'){
    const z = state.selection.zone;
    if(z && z.buildings) z.buildings.splice(z.buildings.indexOf(obj),1);
  }
  state.selection = null; state.selectedVertexIndex = null;
  renderAll();
}
function clearBuildingsIfZoneChanged(sel){
  if(sel && sel.type==='zone' && sel.obj.buildings && sel.obj.buildings.length){
    sel.obj.buildings = [];
    setStatus('Zone shape changed — re-run autofill to regenerate its buildings.');
    return true;
  }
  return false;
}
function deleteSelectedVertex(){
  const pts = state.selection.obj.points;
  const minPts = isClosedShapeType(state.selection.type) ? 3 : 2;
  if(pts.length <= minPts){
    setStatus('Cannot remove — this shape needs at least '+minPts+' points.');
    return;
  }
  pushUndo();
  pts.splice(state.selectedVertexIndex, 1);
  state.selectedVertexIndex = null;
  if(!clearBuildingsIfZoneChanged(state.selection)) setStatus('Point removed.');
  renderAll();
}
function handleSelectClick(p){
  const hit = hitTestShapes(p);
  if(!hit){
    state.selection = null; state.selectedVertexIndex = null;
    setStatus('');
  } else if(state.selection && state.selection.obj===hit.obj){
    // clicking the already-selected shape again: insert a point on its edge
    const closed = isClosedShapeType(hit.type);
    const ins = closestSegmentInsert(p, hit.obj.points, closed);
    if(ins.dist < 14){
      pushUndo();
      hit.obj.points.splice(ins.index+1, 0, ins.point);
      state.selectedVertexIndex = ins.index+1;
      clearBuildingsIfZoneChanged(state.selection);
      setStatus('Point added.');
    }
  } else {
    state.selection = hit;
    state.selectedVertexIndex = null;
    setStatus(hit.type.charAt(0).toUpperCase()+hit.type.slice(1)+' selected — drag a point to reshape it, click the edge to add a point.');
  }
  renderAll();
}

let handleDragScheduled = false;
function scheduleHandleRender(){
  if(handleDragScheduled) return;
  handleDragScheduled = true;
  requestAnimationFrame(()=>{ handleDragScheduled=false; renderAll(); });
}
window.addEventListener('mousemove', (e)=>{
  if(!state.draggingVertex || !state.selection || state.selectedVertexIndex===null) return;
  state.selection.obj.points[state.selectedVertexIndex] = svgPoint(e);
  scheduleHandleRender();
});
window.addEventListener('mouseup', ()=>{
  if(state.draggingVertex){
    state.draggingVertex = false;
    clearBuildingsIfZoneChanged(state.selection);
    renderAll();
  }
});

function renderSelectionHandles(){
  clear(gHandles);
  if(state.tool !== 'select') return;
  if(!selectionStillValid()){ state.selection=null; state.selectedVertexIndex=null; return; }
  if(!state.selection) return;
  if(state.selection.type==='building' && !state.selection.obj.points){
    state.selection.obj.points = rectCorners([state.selection.obj.cx, state.selection.obj.cy],
      state.selection.obj.w, state.selection.obj.h, state.selection.obj.angle);
  }
  const pts = state.selection.obj.points;
  const closed = isClosedShapeType(state.selection.type);
  const d = straightPath(pts, closed);
  gHandles.appendChild(el('path', {d, fill:'none', stroke:'#2a7fd4', 'stroke-width':2, 'stroke-dasharray':'6 4', opacity:0.85}));
  pts.forEach((p,i)=>{
    const focused = i===state.selectedVertexIndex;
    const c = el('circle', {cx:p[0], cy:p[1], r:focused?7:5.5, fill:focused?'#ff6b4a':'#2a7fd4',
      stroke:'#fff', 'stroke-width':1.5, style:'cursor:move'});
    c.addEventListener('mousedown', (e)=>{
      if(e.button!==0) return;
      e.stopPropagation();
      pushUndo();
      state.selectedVertexIndex = i;
      state.draggingVertex = true;
      renderAll();
    });
    c.addEventListener('click', (e)=>{ e.stopPropagation(); });
    gHandles.appendChild(c);
  });
}

/* ---------------------------------------------------------------- click-to-auto-zone */
/* Clicking with the "click enclosed area" tool rasterises every road, river,
   canal and wall onto a fine grid, flood-fills outward from the clicked cell,
   and — if that fill stays fully enclosed (never reaches the edge of the
   map) — traces the outline of the filled region into a polygon and turns
   it straight into a zone. */
const AUTOZONE_CELL = 4; // px per grid cell

function handleAutoZoneClick(clickPoint){
  const result = detectEnclosedZone(clickPoint);
  if(!result){
    setStatus("That spot isn't fully enclosed by roads, rivers, canals or walls — close the gap in the boundary, or draw the zone by hand instead.");
    return;
  }
  pushUndo();
  const id = 'shape'+(state.nextId++);
  state.zones.push({id, points:result, houseSize:null, density:null, buildings:[]});
  state.selectedZoneId = id;
  setStatus('Created a zone from the enclosed area.');
  renderAll();
}

function detectEnclosedZone(clickPoint){
  const CELL = AUTOZONE_CELL;
  const W = MAP_W, H = MAP_H;
  const cols = Math.ceil(W/CELL), rows = Math.ceil(H/CELL);
  const idx = (cx,cy) => cy*cols + cx;
  const blocked = new Uint8Array(cols*rows);

  function rasterizeSegment(a, b, halfWidth){
    const len = dist(a,b);
    const steps = Math.max(1, Math.ceil(len / (CELL*0.75)));
    const rCells = Math.ceil(halfWidth/CELL) + 1;
    for(let s=0; s<=steps; s++){
      const t = s/steps;
      const px = a[0]+(b[0]-a[0])*t, py = a[1]+(b[1]-a[1])*t;
      const cx0 = Math.floor(px/CELL), cy0 = Math.floor(py/CELL);
      for(let dx=-rCells; dx<=rCells; dx++){
        for(let dy=-rCells; dy<=rCells; dy++){
          const cx=cx0+dx, cy=cy0+dy;
          if(cx<0||cy<0||cx>=cols||cy>=rows) continue;
          const cellCx=(cx+0.5)*CELL, cellCy=(cy+0.5)*CELL;
          if(Math.hypot(cellCx-px, cellCy-py) <= halfWidth) blocked[idx(cx,cy)] = 1;
        }
      }
    }
  }
  function rasterizePolyline(points, halfWidth, closed){
    for(let i=0;i<points.length-1;i++) rasterizeSegment(points[i], points[i+1], halfWidth);
    if(closed && points.length>1) rasterizeSegment(points[points.length-1], points[0], halfWidth);
  }

  const s = sp();
  state.roads.forEach(r=>{
    rasterizePolyline(r.points, (roadWidth(r)*s.lineScale)/2, false);
  });
  state.rivers.forEach(r=>{
    rasterizePolyline(r.points, (r.width||14)/2, false);
  });
  state.walls.forEach(w=>rasterizePolyline(w.points, 3, true));

  const startCx = Math.floor(clickPoint[0]/CELL), startCy = Math.floor(clickPoint[1]/CELL);
  if(startCx<0||startCy<0||startCx>=cols||startCy>=rows) return null;
  if(blocked[idx(startCx,startCy)]) return null; // clicked directly on a border feature

  const visited = new Uint8Array(cols*rows);
  const queue = [[startCx,startCy]];
  visited[idx(startCx,startCy)] = 1;
  let touchedEdge = false;
  let head = 0;
  while(head < queue.length){
    const [cx,cy] = queue[head++];
    if(cx===0||cy===0||cx===cols-1||cy===rows-1) touchedEdge = true;
    const neighbors = [[cx+1,cy],[cx-1,cy],[cx,cy+1],[cx,cy-1]];
    for(const [nx,ny] of neighbors){
      if(nx<0||ny<0||nx>=cols||ny>=rows) continue;
      const ni = idx(nx,ny);
      if(visited[ni] || blocked[ni]) continue;
      visited[ni] = 1;
      queue.push([nx,ny]);
    }
  }
  if(touchedEdge) return null;          // leaks off the map — not enclosed
  if(queue.length < 4) return null;     // too small to be a meaningful zone

  const polygon = traceBoundary(visited, cols, rows, CELL);
  if(!polygon || polygon.length < 3) return null;
  const simplified = simplifyClosedPolygon(polygon, 6);
  if(!simplified || simplified.length < 3) return null;

  // No part of a click-to-fill zone should end up shorter than five
  // townhouse-lengths, and no point of it should ever cross a road,
  // thoroughfare, canal or river. These two passes can each undo the
  // other's work in rare cases (a merge can pull an edge across an
  // obstacle; the obstacle fix's own re-trace can reintroduce a short
  // edge), so they run back and forth until stable — always finishing on
  // the obstacle check, since "never cross infrastructure" is the harder
  // requirement of the two.
  const MIN_ZONE_EDGE = 5 * HOUSE_SPECS.townhouse.w;
  const obstacles = buildObstacles();
  let shaped = simplified;
  for(let iter=0; iter<4; iter++){
    const lengthAdjusted = enforceMinEdgeLength(shaped, MIN_ZONE_EDGE);
    const beforeClearance = (lengthAdjusted && lengthAdjusted.length>=3) ? lengthAdjusted : shaped;
    const cleared = enforceZoneObstacleClearance(beforeClearance, obstacles);
    const stable = cleared.length===shaped.length &&
      cleared.every((p,i)=> shaped[i] && Math.abs(p[0]-shaped[i][0])<0.5 && Math.abs(p[1]-shaped[i][1])<0.5);
    shaped = cleared;
    if(stable) break;
  }
  return shaped;
}

/* Perpendicular distance from a point to the line through a and b — used to
   judge how much a vertex actually contributes to a polygon's outline. */
function perpDistToLine(p, a, b){
  const dx=b[0]-a[0], dy=b[1]-a[1];
  const len = Math.hypot(dx,dy);
  if(len<1e-9) return dist(p,a);
  return Math.abs((p[0]-a[0])*dy - (p[1]-a[1])*dx)/len;
}
/* Repeatedly shortens the shortest edge of a polygon by dropping one of its
   two endpoints — never by averaging them into a new point, which would pull
   the boundary inward a little with every merge and, over enough merges,
   noticeably shrink the shape away from the true enclosed area. Whichever
   endpoint deviates least from the edge that would replace it (i.e.
   contributes least to the outline) is the one dropped, so the remaining
   boundary stays as close as possible to the original trace. Runs until
   every edge is at least minLen long, or only a triangle is left. */
function enforceMinEdgeLength(polyPoints, minLen){
  let pts = polyPoints.map(p=>[p[0],p[1]]);
  let guard = 0;
  while(pts.length > 3 && guard++ < 2000){
    let shortestIdx = -1, shortestLen = Infinity;
    for(let i=0;i<pts.length;i++){
      const d = dist(pts[i], pts[(i+1)%pts.length]);
      if(d < shortestLen){ shortestLen = d; shortestIdx = i; }
    }
    if(shortestLen >= minLen) break;
    const n = pts.length;
    const i = shortestIdx, j = (i+1) % n;
    const prevI = pts[(i-1+n)%n], nextJ = pts[(j+1)%n];
    // if we drop i, the new edge is prevI->j; if we drop j, it's i->nextJ —
    // keep whichever point deviates less from the edge that replaces it
    const costDropI = perpDistToLine(pts[i], prevI, pts[j]);
    const costDropJ = perpDistToLine(pts[j], pts[i], nextJ);
    if(costDropI <= costDropJ) pts.splice(i, 1);
    else pts.splice(j, 1);
  }
  return pts;
}

/* Does any edge of this polygon pass within an obstacle's buffer? */
function polygonCrossesObstacles(polyPoints, obstacles){
  const n = polyPoints.length;
  for(let i=0;i<n;i++){
    const a=polyPoints[i], b=polyPoints[(i+1)%n];
    const steps = Math.max(2, Math.ceil(dist(a,b)/6));
    for(let k=0;k<=steps;k++){
      const t=k/steps;
      const pt=[a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t];
      for(const ob of obstacles){
        if(distToPolyline(pt, ob.points).dist < ob.halfWidth) return true;
      }
    }
  }
  return false;
}

/* Checks whether any edge of a zone polygon crosses a road, thoroughfare,
   canal or river, and if so corrects it: re-rasterises the zone with those
   obstacle corridors carved out, then re-traces and re-simplifies the
   boundary. In effect this adds vertices exactly where the zone meets the
   obstacle and drops whatever vertices had strayed across it, without
   disturbing the rest of the shape. */
function enforceZoneObstacleClearance(polyPoints, obstacles){
  if(!obstacles.length) return polyPoints;
  if(!polygonCrossesObstacles(polyPoints, obstacles)) return polyPoints;

  const cellSize = 4;
  const clearMargin = cellSize; // extra safety margin beyond the exact halfWidth, since the
                                 // traced boundary follows cell edges, not cell centres
  const bb = bbox(polyPoints);
  const minx = Math.floor(bb.minx/cellSize)*cellSize - cellSize;
  const miny = Math.floor(bb.miny/cellSize)*cellSize - cellSize;
  const cols = Math.max(1, Math.ceil((bb.maxx-bb.minx)/cellSize)+3);
  const rows = Math.max(1, Math.ceil((bb.maxy-bb.miny)/cellSize)+3);
  if(cols*rows > 400000) return polyPoints; // safety cap — leave unchanged rather than risk a huge grid
  const mask = new Uint8Array(cols*rows);
  const idx=(x,y)=>y*cols+x;
  for(let gy=0; gy<rows; gy++){
    for(let gx=0; gx<cols; gx++){
      const wx=minx+(gx+0.5)*cellSize, wy=miny+(gy+0.5)*cellSize;
      if(!pointInPoly([wx,wy], polyPoints)) continue;
      let blocked=false;
      for(const ob of obstacles){
        if(distToPolyline([wx,wy], ob.points).dist <= ob.halfWidth+clearMargin){ blocked=true; break; }
      }
      if(!blocked) mask[idx(gx,gy)] = 1;
    }
  }

  // Seed from the polygon's centroid (spiralling outward if that exact cell
  // got carved out) so the fill lands in the main body of the zone rather
  // than a small stray sliver.
  const cpt = centroid(polyPoints);
  const cgx = Math.floor((cpt[0]-minx)/cellSize), cgy = Math.floor((cpt[1]-miny)/cellSize);
  let seed = null;
  if(cgx>=0 && cgy>=0 && cgx<cols && cgy<rows && mask[idx(cgx,cgy)]){
    seed = [cgx,cgy];
  } else {
    const maxR = Math.max(cols,rows);
    outerSeed:
    for(let r=1; r<maxR; r++){
      for(let dx=-r; dx<=r; dx++){
        for(let dy=-r; dy<=r; dy++){
          if(Math.max(Math.abs(dx),Math.abs(dy)) !== r) continue;
          const gx=cgx+dx, gy=cgy+dy;
          if(gx<0||gy<0||gx>=cols||gy>=rows) continue;
          if(mask[idx(gx,gy)]){ seed=[gx,gy]; break outerSeed; }
        }
      }
    }
  }
  if(!seed) return polyPoints; // no valid area left to seed from — leave unchanged

  const visited = new Uint8Array(cols*rows);
  const queue=[seed]; visited[idx(seed[0],seed[1])]=1;
  let head=0;
  while(head<queue.length){
    const [cx,cy]=queue[head++];
    const nbs=[[cx+1,cy],[cx-1,cy],[cx,cy+1],[cx,cy-1]];
    for(const [nx,ny] of nbs){
      if(nx<0||ny<0||nx>=cols||ny>=rows) continue;
      const ni=idx(nx,ny);
      if(visited[ni] || !mask[ni]) continue;
      visited[ni]=1; queue.push([nx,ny]);
    }
  }
  if(queue.length < 8) return polyPoints; // the fix would erase almost the whole zone — leave it be

  const traced = traceBoundary(visited, cols, rows, cellSize, minx, miny);
  if(!traced || traced.length<3) return polyPoints;

  // Re-simplifying can occasionally straighten the very corner this pass
  // just fixed, right back across the obstacle — so verify the simplified
  // result, and fall back to the (guaranteed correct, if slightly more
  // detailed) unsimplified trace if it doesn't hold up.
  const resimplified = simplifyClosedPolygon(traced, 3);
  if(resimplified && resimplified.length>=3 && !polygonCrossesObstacles(resimplified, obstacles)){
    return resimplified;
  }
  return polygonCrossesObstacles(traced, obstacles) ? polyPoints : traced;
}

/* Traces the outer edge of a filled binary grid mask into an ordered ring of
   grid-vertex points (in world coordinates). */
function traceBoundary(mask, cols, rows, cellSize, offsetX, offsetY){
  offsetX = offsetX || 0; offsetY = offsetY || 0;
  const at = (cx,cy) => (cx<0||cy<0||cx>=cols||cy>=rows) ? 0 : mask[cy*cols+cx];
  const adj = new Map(); // 'x,y' -> ['x,y', ...]
  function addEdge(p1, p2){
    const k1=p1[0]+','+p1[1], k2=p2[0]+','+p2[1];
    if(!adj.has(k1)) adj.set(k1, []);
    if(!adj.has(k2)) adj.set(k2, []);
    adj.get(k1).push(k2);
    adj.get(k2).push(k1);
  }
  for(let cy=0; cy<rows; cy++){
    for(let cx=0; cx<cols; cx++){
      if(!at(cx,cy)) continue;
      if(!at(cx,cy-1)) addEdge([cx,cy],[cx+1,cy]);       // top
      if(!at(cx,cy+1)) addEdge([cx,cy+1],[cx+1,cy+1]);   // bottom
      if(!at(cx-1,cy)) addEdge([cx,cy],[cx,cy+1]);       // left
      if(!at(cx+1,cy)) addEdge([cx+1,cy],[cx+1,cy+1]);   // right
    }
  }
  if(adj.size===0) return null;

  // start from the topmost-then-leftmost vertex — always part of the outer ring
  let startKey=null, sx=Infinity, sy=Infinity;
  adj.forEach((_,k)=>{
    const [x,y]=k.split(',').map(Number);
    if(y<sy || (y===sy && x<sx)){ sy=y; sx=x; startKey=k; }
  });

  const visitedEdges = new Set();
  const path = [];
  let current = startKey, prev = null;
  const maxSteps = adj.size*2 + 10;
  for(let steps=0; steps<maxSteps; steps++){
    path.push(current.split(',').map(Number));
    const neighbors = adj.get(current) || [];
    let next = null;
    for(const n of neighbors){
      if(n===prev) continue;
      if(visitedEdges.has(current+'|'+n) || visitedEdges.has(n+'|'+current)) continue;
      next = n; break;
    }
    if(next===null){
      for(const n of neighbors){
        if(visitedEdges.has(current+'|'+n) || visitedEdges.has(n+'|'+current)) continue;
        next = n; break;
      }
    }
    if(next===null) break;
    visitedEdges.add(current+'|'+next);
    prev = current;
    current = next;
    if(current===startKey) break;
  }
  return path.map(([gx,gy]) => [offsetX+gx*cellSize, offsetY+gy*cellSize]);
}

/* Ramer–Douglas–Peucker simplification of an open point chain. */
function rdp(points, tolerance){
  if(points.length < 3) return points.slice();
  const start=points[0], end=points[points.length-1];
  let maxDist=0, index=0;
  for(let i=1;i<points.length-1;i++){
    const dx=end[0]-start[0], dy=end[1]-start[1];
    const len=Math.hypot(dx,dy);
    const d = len<1e-9 ? dist(points[i],start) : Math.abs((points[i][0]-start[0])*dy - (points[i][1]-start[1])*dx)/len;
    if(d>maxDist){ maxDist=d; index=i; }
  }
  if(maxDist > tolerance){
    const left = rdp(points.slice(0,index+1), tolerance);
    const right = rdp(points.slice(index), tolerance);
    return left.slice(0,-1).concat(right);
  }
  return [start, end];
}
/* Simplifies a closed ring (grid-staircase boundary) into a clean polygon by
   splitting it into two open chains at its two most distant points, running
   RDP on each, then rejoining. Returns an open ring (no duplicated first/last
   point), matching how zone.points are stored elsewhere. */
function simplifyClosedPolygon(points, tolerance){
  let pts = points.slice();
  if(pts.length>1 && dist(pts[0], pts[pts.length-1]) < 1e-6) pts = pts.slice(0,-1);
  const m = pts.length;
  if(m <= 4) return pts;
  let bestJ = Math.floor(m/2), bestD = -1;
  for(let j=Math.max(1,Math.floor(m*0.3)); j<Math.min(m,Math.ceil(m*0.7)); j++){
    const d = dist(pts[0], pts[j]);
    if(d>bestD){ bestD=d; bestJ=j; }
  }
  const chain1 = pts.slice(0, bestJ+1);
  const chain2 = pts.slice(bestJ).concat([pts[0]]);
  const s1 = rdp(chain1, tolerance);
  const s2 = rdp(chain2, tolerance);
  return s1.slice(0,-1).concat(s2.slice(0,-1));
}

/* ---------------------------------------------------------------- autofill */
/* Obstacles buildings must never overlap: every road/street/alley/thoroughfare/
   canal, plus rivers. Each carries a half-width "no-build" buffer. */
function buildObstacles(){
  const s = sp();
  const list = [];
  state.roads.forEach(r=>{
    list.push({points:r.points, halfWidth:(roadWidth(r)*s.lineScale)/2});
  });
  state.rivers.forEach(r=>{
    list.push({points:r.points, halfWidth:(r.width||14)/2});
  });
  return list;
}
/* smallest (distance-to-edge minus buffer) over all obstacles & all corners of
   a candidate building — negative means it overlaps something it shouldn't */
function minMarginForCorners(corners, obstacles){
  let minMargin = Infinity;
  obstacles.forEach(ob=>{
    corners.forEach(c=>{
      const {dist:d} = distToPolyline(c, ob.points);
      const m = d - ob.halfWidth;
      if(m < minMargin) minMargin = m;
    });
  });
  return minMargin===Infinity ? 999 : minMargin;
}
/* If a building sits close to a road/river, slide it so its near edge sits
   flush against that feature's edge (at `clearance` gap) instead of floating
   at whatever offset the grid happened to leave. */
function tryFlushAlign(center, w, h, angle, obstacles, clearance){
  let best=null, bestDist=Infinity;
  obstacles.forEach(ob=>{
    const {dist:d, point} = distToPolyline(center, ob.points);
    if(d<bestDist){ bestDist=d; best={point, halfWidth:ob.halfWidth}; }
  });
  if(!best) return null;
  const maxDim = Math.max(w,h);
  if(bestDist - best.halfWidth > maxDim*1.3) return null; // not a frontage row, leave alone
  let dir = [center[0]-best.point[0], center[1]-best.point[1]];
  const dlen = Math.hypot(dir[0],dir[1]) || 1;
  dir = [dir[0]/dlen, dir[1]/dlen];
  const halfExtent = projectedHalfExtent(w,h,angle,dir);
  const targetDist = best.halfWidth + clearance + halfExtent;
  return [best.point[0]+dir[0]*targetDist, best.point[1]+dir[1]*targetDist];
}

/* Actively seeks the nearest real road (thoroughfare/street/canal, not an
   alley) to a candidate position and computes where a w x h building should
   sit to front it directly — parallel to the road, clear of it by
   `clearance`, on whichever side the candidate started on. Unlike
   tryFlushAlign above (which only nudges a position that's already close),
   this looks for a road actively and returns null if none exists at all,
   rather than requiring the caller to already be near one. */
function frontOntoRoad(candidateCenter, w, h, clearance){
  let bestRoad = null, bestDist = Infinity, bestPoint = null, bestSeg = null, bestHalfWidth = 0;
  state.roads.forEach(r=>{
    if(r.type==='alley') return;
    const hit = distToPolyline(candidateCenter, r.points);
    if(hit.dist < bestDist){
      bestDist = hit.dist; bestPoint = hit.point; bestSeg = hit.seg; bestRoad = r;
      bestHalfWidth = (roadWidth(r)*sp().lineScale)/2;
    }
  });
  if(!bestRoad) return null;
  const roadAngle = Math.atan2(bestSeg[1][1]-bestSeg[0][1], bestSeg[1][0]-bestSeg[0][0]);
  let dir = [candidateCenter[0]-bestPoint[0], candidateCenter[1]-bestPoint[1]];
  const dlen = Math.hypot(dir[0],dir[1]) || 1;
  dir = [dir[0]/dlen, dir[1]/dlen];
  const halfExtent = projectedHalfExtent(w,h,roadAngle,dir);
  const targetDist = bestHalfWidth + clearance + halfExtent;
