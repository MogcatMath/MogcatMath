    const poly = b.points || rectCorners([b.cx,b.cy], b.w, b.h, b.angle);
    const pbb = bbox(poly);
    const gminx=Math.max(0,Math.floor((pbb.minx-alleyGap-minx)/cellSize));
    const gmaxx=Math.min(cols-1,Math.ceil((pbb.maxx+alleyGap-minx)/cellSize));
    const gminy=Math.max(0,Math.floor((pbb.miny-alleyGap-miny)/cellSize));
    const gmaxy=Math.min(rows-1,Math.ceil((pbb.maxy+alleyGap-miny)/cellSize));
    for(let gy=gminy; gy<=gmaxy; gy++){
      for(let gx=gminx; gx<=gmaxx; gx++){
        const wx=minx+(gx+0.5)*cellSize, wy=miny+(gy+0.5)*cellSize;
        if(pointInPoly([wx,wy], poly)){ blocked[idx(gx,gy)]=1; continue; }
        let minD=Infinity;
        for(let k=0;k<poly.length;k++){
          const d = distToPolyline([wx,wy], [poly[k], poly[(k+1)%poly.length]]).dist;
          if(d<minD) minD=d;
        }
        if(minD<=alleyGap) blocked[idx(gx,gy)]=1;
      }
    }
  });
  let seed=null;
  const cpt = centroid(polyPoints);
  const cgx = Math.floor((cpt[0]-minx)/cellSize), cgy = Math.floor((cpt[1]-miny)/cellSize);
  if(cgx>=0 && cgy>=0 && cgx<cols && cgy<rows && !blocked[idx(cgx,cgy)]){
    seed = [cgx,cgy];
  } else {
    // centroid cell itself is blocked (unusual shape) — spiral outward from
    // it for the nearest free cell, rather than raster-scanning from the grid
    // corner, which tends to land in a small isolated pocket near a corner.
    const maxR = Math.max(cols,rows);
    outer:
    for(let r=1; r<maxR; r++){
      for(let dx=-r; dx<=r; dx++){
        for(let dy=-r; dy<=r; dy++){
          if(Math.max(Math.abs(dx),Math.abs(dy)) !== r) continue;
          const gx=cgx+dx, gy=cgy+dy;
          if(gx<0||gy<0||gx>=cols||gy>=rows) continue;
          if(!blocked[idx(gx,gy)]){ seed=[gx,gy]; break outer; }
        }
      }
    }
  }
  if(!seed) return null;
  const visited = new Uint8Array(cols*rows);
  const queue=[seed]; visited[idx(seed[0],seed[1])]=1;
  let head=0, count=0;
  while(head<queue.length){
    const [cx,cy]=queue[head++]; count++;
    const nbs=[[cx+1,cy],[cx-1,cy],[cx,cy+1],[cx,cy-1]];
    for(const [nx,ny] of nbs){
      if(nx<0||ny<0||nx>=cols||ny>=rows) continue;
      const ni=idx(nx,ny);
      if(visited[ni]||blocked[ni]) continue;
      visited[ni]=1; queue.push([nx,ny]);
    }
  }
  if(count < 25) return null; // negligible sliver left — stop
  const poly = traceBoundary(visited, cols, rows, cellSize, minx, miny);
  if(!poly || poly.length<3) return null;
  return simplifyClosedPolygon(poly, 8);
}

/* Townhouse fill: a single ring of houses fronts the zone's own boundary —
   the road, canal or thoroughfare it was drawn against — each row widened or
   narrowed (within 70-130% of the base footprint) so it tiles its edge
   exactly with no leftover gap. The centre of the zone is deliberately left
   empty (a shared courtyard/garden behind the terrace), unlike rowhouses. */
function autofillZoneTownhouse(zone){
  const spec = HOUSE_SPECS[zone.houseSize];
  const gap = DENSITY_GAP[zone.density];
  const obstacles = buildObstacles();
  removeZoneAlleys(zone.id);
  removeZoneWalls(zone.id);
  const frontBuildings = placeRingOnPolygon(zone.points, spec, gap, obstacles, zone.id, 'front');
  frontBuildings.forEach(b=>{ b.houseSize = zone.houseSize; });
  zone.buildings = frontBuildings;
}

/* Removes any alley roads a previous autofill of this zone created, so
   re-running autofill doesn't leave stale alleys behind. */
function removeZoneAlleys(zoneId){
  state.roads = state.roads.filter(r=>r.sourceZoneId !== zoneId);
}
/* Removes any estate wall a previous autofill of this zone created (mansion
   zones), so re-running autofill or deleting the zone doesn't leave one
   floating behind with nothing inside it. */
function removeZoneWalls(zoneId){
  state.zoneWalls = state.zoneWalls.filter(w=>w.sourceZoneId !== zoneId);
}

/* Finds where a long line at a given row (in the interior's rotated grid
   frame) crosses the zone's own boundary, and returns the outermost crossing
   points — i.e. where that row's alley would meet the street on each side.
   Bends the path if a straight line between them would step outside the
   zone (an irregular/non-convex boundary). */
function alleyPathForRow(rowY, angle, rotCenter, bb, zonePoly, zoneId){
  const margin = Math.max(400, (bb.maxx-bb.minx)+(bb.maxy-bb.miny));
  const p1 = rotatePoint([bb.minx-margin, rowY], rotCenter, angle);
  const p2 = rotatePoint([bb.maxx+margin, rowY], rotCenter, angle);
  const hits = [];
  const n = zonePoly.length;
  for(let i=0;i<n;i++){
    const hit = segIntersect(p1, p2, zonePoly[i], zonePoly[(i+1)%n]);
    if(hit) hits.push(hit);
  }
  if(hits.length < 2) return null;
  hits.sort((h1,h2)=>dist(p1,h1)-dist(p1,h2));
  const start = hits[0], end = hits[hits.length-1];

  let pathPoints = [start, end];
  let allInside = true;
  const steps = 14;
  for(let k=1; k<steps; k++){
    const t = k/steps;
    const pt = [start[0]+(end[0]-start[0])*t, start[1]+(end[1]-start[1])*t];
    if(!pointInPoly(pt, zonePoly)){ allInside=false; break; }
  }
  if(!allInside){
    const zc = centroid(zonePoly);
    const mid = [(start[0]+end[0])/2, (start[1]+end[1])/2];
    pathPoints = [start, [mid[0]+(zc[0]-mid[0])*0.35, mid[1]+(zc[1]-mid[1])*0.35], end];
  }
  return {id:'alley'+(state.nextId++), type:'alley', points:pathPoints, sourceZoneId:zoneId};
}

/* Fills the interior behind the front ring with alternating rows: a row of
   houses, then a row given over to an alley instead, repeating. The alley is
   a real road — it's added to state.roads so it renders, blends at
   junctions, and becomes an obstacle houses on both sides must clear — and
   its ends run all the way out to the zone's own boundary, joining whatever
   street or thoroughfare that edge represents. */
function fillRowhouseInterior(interiorPoly, zonePoly, spec, gap, obstacles, seedId, houseSize, zoneId){
  const angle = nearestRoadAngle({points: interiorPoly});
  const c = centroid(interiorPoly);
  const rotated = interiorPoly.map(p=>rotatePoint(p, c, -angle));
  const bb = bbox(rotated);
  const alleyHalf = (ROAD_STYLE.alley.w * sp().lineScale)/2;
  const alleyClearance = 3;

  // Pass 1 — decide which rows are alleys and build their paths first, so
  // house rows on both sides of an alley can be fitted against it. Rows are
  // placed sequentially rather than centred in an even grid: each house row
  // sits flush against the alley (or the interior's edge) just ahead of it,
  // and the density gap is spent entirely as garden space behind the house,
  // before the next alley — not split evenly on both sides of every row.
  const alleys = [];
  const rowYs = [];
  let cursor = bb.miny;
  let row = 0;
  while(cursor < bb.maxy){
    if(row % 2 === 1){
      const y = cursor + alleyHalf;
      const alley = alleyPathForRow(y, angle, c, bb, zonePoly, zoneId);
      if(alley) alleys.push(alley);
      rowYs.push({y, isAlley:true});
      cursor = y + alleyHalf + alleyClearance;
    } else {
      const y = cursor + spec.h/2;
      rowYs.push({y, isAlley:false});
      cursor = y + spec.h/2 + gap; // house depth, then its garden gap behind it
    }
    row++;
  }
  const ROAD_W_ALLEY = ROAD_STYLE.alley.w * sp().lineScale;
  const alleyObstacles = alleys.map(a=>({points:a.points, halfWidth:ROAD_W_ALLEY/2}));
  const fullObstacles = obstacles.concat(alleyObstacles);

  // Pass 2 — fill the non-alley rows with houses, using the complete
  // obstacle list (existing roads/rivers plus the alleys just created).
  const buildings = [];
  const rnd = mulberry32(seedFor(seedId,'rowint'));
  const stepW = spec.w + gap;
  const MIN_SCALE = Math.sqrt(0.5);
  let colRow = 0;
  rowYs.forEach(({y, isAlley})=>{
    if(isAlley){ colRow++; return; }
    const colOffset = (colRow % 2 === 1) ? stepW/2 : 0;
    colRow++;
    for(let x = bb.minx + stepW/2 + colOffset; x < bb.maxx; x += stepW){
      const worldCenter = rotatePoint([x,y], c, angle);
      let placed = null;
      for(let sc=1.0; sc>=MIN_SCALE-1e-6; sc-=0.06){
        const w = spec.w*sc, h = spec.h*sc;
        const samples = rectSamplePoints(worldCenter, w, h, angle);
        if(!samples.every(pt=>pointInPoly(pt, interiorPoly))) continue;
        if(minMarginForCorners(samples, fullObstacles) < 0) continue;
        placed = {center:worldCenter, w, h};
        break;
      }
      if(placed){
        buildings.push({
          cx:placed.center[0], cy:placed.center[1], w:placed.w, h:placed.h, angle, houseSize,
          seed: seedFor(seedId,'ri'+buildings.length), hatchVariant: rnd()>0.5?0:1
        });
      } else {
        const clipped = clipRectFootprint(worldCenter, spec.w, spec.h, angle, interiorPoly, fullObstacles);
        if(clipped){
          buildings.push({
            cx:clipped.center[0], cy:clipped.center[1], w:clipped.w, h:clipped.h, angle, houseSize,
            seed: seedFor(seedId,'ri'+buildings.length), hatchVariant: rnd()>0.5?0:1
          });
        }
      }
    }
  });
  return {buildings, alleys};
}

/* Rowhouse fill: a ring fronts the zone's own boundary, tiled edge-exact as
   with townhouses. Behind it, the interior alternates rows of houses with
   rows given over to a real alley road — so every rowhouse ends up fronting
   either the street or another rowhouse, and backing onto either an alley or
   another rowhouse in turn, and the whole shape gets used. */
function autofillZoneRowhouse(zone){
  const spec = HOUSE_SPECS[zone.houseSize];
  const gap = DENSITY_GAP[zone.density];
  const obstacles = buildObstacles();
  const alleyGap = Math.max(5, gap);
  removeZoneAlleys(zone.id);
  removeZoneWalls(zone.id);

  const frontBuildings = placeRingOnPolygon(zone.points, spec, gap, obstacles, zone.id, 'front');
  frontBuildings.forEach(b=>{ b.houseSize = zone.houseSize; });

  let interiorBuildings = [];
  const interior = erodePolygonByRing(zone.points, frontBuildings, alleyGap);
  if(interior && polygonArea(interior) > spec.w*spec.h*1.1){
    const result = fillRowhouseInterior(interior, zone.points, spec, gap, obstacles, zone.id+'_int', zone.houseSize, zone.id);
    interiorBuildings = result.buildings;
    state.roads.push(...result.alleys);
  }

  zone.buildings = [...frontBuildings, ...interiorBuildings];
}

/* ---------------------------------------------------------------- toolbar UI */
function renderToolbar(){
  const tb = document.getElementById('toolbar');
  clear(tb);

  // Cross-cutting Select & Edit tool — works on shapes from any stage
  const selBlock = document.createElement('div');
  selBlock.className = 'stage-block';
  const selHead = document.createElement('div');
  selHead.className = 'stage-head' + (state.tool==='select' ? ' current' : '');
  selHead.innerHTML = `<span class="num">&#9998;</span><span>Select &amp; Edit</span>`;
  selBlock.appendChild(selHead);
  const selBtn = document.createElement('button');
  selBtn.className = 'tool-btn' + (state.tool==='select' ? ' active' : '');
  selBtn.innerHTML = `<span class="swatch" style="background:#2a7fd4"></span><span>Select / move points</span>`;
  selBtn.onclick = ()=>{
    if(state.tool==='select'){
      cancelDrawing();
    } else {
      state.drawing = null;
      state.tool = 'select';
      state.selection = null; state.selectedVertexIndex = null;
      setStatus('Click any shape to select it, drag a point to reshape it, click its edge again to add a point, Delete to remove one.');
      renderAll();
    }
  };
  selBlock.appendChild(selBtn);
  tb.appendChild(selBlock);

  STAGES.forEach(st=>{
    const block = document.createElement('div');
    block.className = 'stage-block';
    const head = document.createElement('div');
    head.className = 'stage-head' + (state.stage===st.n ? ' current' : '');
    head.innerHTML = `<span class="num">${st.n}</span><span>${st.label}</span>`;
    head.onclick = ()=>{ state.stage = st.n; cancelDrawing(); };
    block.appendChild(head);
    st.tools.forEach(t=>{
      const btn = document.createElement('button');
      btn.className = 'tool-btn' + (state.tool===t.id ? ' active' : '');
      btn.innerHTML = `<span class="swatch" style="background:${t.swatch}"></span><span>${t.label}</span>`;
      btn.onclick = ()=>{
        state.stage = st.n;
        if(t.kind === 'click'){
          state.drawing = null;
          state.selection = null; state.selectedVertexIndex = null;
          state.tool = (state.tool===t.id) ? null : t.id;
          setStatus(state.tool ? 'Click inside an area bordered by roads, rivers, canals or walls to turn it into a zone.' : '');
          renderAll();
        } else if(state.tool===t.id){ cancelDrawing(); } else { startDrawing(t.id); }
      };
      block.appendChild(btn);
    });
    if(st.key==='autofill'){
      const btn1 = document.createElement('button');
      btn1.className='tool-btn'; btn1.style.marginTop='4px';
      btn1.innerHTML = '<span>&#9998;</span><span>Autofill selected zone</span>';
      btn1.onclick = ()=>{
        const z = state.zones.find(z=>z.id===state.selectedZoneId);
        if(z) autofillZone(z); else setStatus('Select a zone first (click it on the map).');
      };
      block.appendChild(btn1);
      const btn2 = document.createElement('button');
      btn2.className='tool-btn';
      btn2.innerHTML = '<span>&#10024;</span><span>Autofill all zones</span>';
      btn2.onclick = autofillAll;
      block.appendChild(btn2);
    }
    tb.appendChild(block);
  });
}

/* ---------------------------------------------------------------- right panel UI */
function renderRightPanel(){
  const rp = document.getElementById('rightPanel');
  clear(rp);

  // layers
  const h1 = document.createElement('h2'); h1.textContent='Layers'; rp.appendChild(h1);
  [['natural','Natural features'],['infrastructure','Infrastructure'],['walls','Walls'],
   ['zones','Zone outlines'],['buildings','Buildings']].forEach(([key,label])=>{
    const row = document.createElement('label');
    row.className='layer-row';
    row.innerHTML = `<input type="checkbox" ${state.layers[key]?'checked':''}/> ${label}`;
    row.querySelector('input').onchange = (e)=>{ state.layers[key] = e.target.checked; renderAll(); };
    rp.appendChild(row);
  });

  // select & edit
  if(state.tool==='select'){
    const hs = document.createElement('h2'); hs.textContent='Select & Edit'; rp.appendChild(hs);
    if(!state.selection){
      const hint = document.createElement('div'); hint.className='hint';
      hint.textContent = 'Click any shape on the map to select it. Drag its blue points to reshape it. Click its edge again to add a point. Select a point and press Delete to remove it.';
      rp.appendChild(hint);
    } else {
      const info = document.createElement('div'); info.className='hint';
      const label = state.selection.type.charAt(0).toUpperCase()+state.selection.type.slice(1);
      info.textContent = label+' selected — '+state.selection.obj.points.length+' points.';
      rp.appendChild(info);
      const delBtn = document.createElement('button');
      delBtn.className='btn danger'; delBtn.textContent='Delete this shape';
      delBtn.onclick = removeSelectedShape;
      rp.appendChild(delBtn);
    }
  }

  // current drawing controls
  if(state.drawing){
    const h2 = document.createElement('h2'); h2.textContent='Drawing'; rp.appendChild(h2);
    const hint = document.createElement('div'); hint.className='hint';
    hint.textContent = TOOL_KIND[state.drawing.kind]==='closed'
      ? 'Click to add points. Click near the first point (or press Enter) to close the shape.'
      : 'Click to add points. Double-click or press Enter to finish the line.';
    rp.appendChild(hint);
    if(state.drawing.kind==='river' || state.drawing.kind==='road:canal'){
      const isCanal = state.drawing.kind==='road:canal';
      const defaultW = isCanal ? ROAD_STYLE.canal.w : 14;
      const f = document.createElement('div'); f.className='field';
      f.innerHTML = `<label>${isCanal?'Canal':'River'} width</label><input type="range" min="${isCanal?4:6}" max="${isCanal?26:30}" value="${defaultW}" id="waterWidth"/>`;
      rp.appendChild(f);
      f.querySelector('input').oninput = (e)=>{ state.drawing.width = +e.target.value; };
    }
    const cancelBtn = document.createElement('button');
    cancelBtn.className='btn secondary'; cancelBtn.textContent='Cancel drawing';
    cancelBtn.onclick = cancelDrawing;
    rp.appendChild(cancelBtn);
    const finishBtn = document.createElement('button');
    finishBtn.className='btn'; finishBtn.textContent='Finish shape';
    finishBtn.onclick = finishDrawing;
    rp.appendChild(finishBtn);
  }

  // zone list + attribute editor (stage 4/5)
  if(state.stage===4 || state.stage===5){
    const h3 = document.createElement('h2'); h3.textContent='Zones'; rp.appendChild(h3);
    if(state.tool==='autozone'){
      const hint = document.createElement('div'); hint.className='hint';
      hint.textContent = 'Click any area on the map that\'s fully bordered by roads, rivers, canals or walls — it\'ll become a zone automatically.';
      rp.appendChild(hint);
    } else if(state.zones.length===0){
      const hint = document.createElement('div'); hint.className='hint';
      hint.textContent = 'Draw a zone by hand, or use "Click enclosed area" on the left to auto-detect one bordered by roads, rivers, canals or walls.';
      rp.appendChild(hint);
    }
    const list = document.createElement('div'); list.className='zone-list';
    state.zones.forEach((z,i)=>{
      const item = document.createElement('div');
      item.className = 'zone-item' + (z.id===state.selectedZoneId?' sel':'');
      item.innerHTML = `<span>Zone ${i+1}</span><span class="tag">${z.houseSize||'—'} · ${z.density||'—'}</span>`;
      item.onclick = ()=>{ state.selectedZoneId = z.id; renderAll(); };
      list.appendChild(item);
    });
    rp.appendChild(list);

    const zone = state.zones.find(z=>z.id===state.selectedZoneId);
    if(zone){
      const h4 = document.createElement('h2'); h4.textContent='Zone attributes'; rp.appendChild(h4);
      const f1 = document.createElement('div'); f1.className='field';
      f1.innerHTML = `<label>House size</label>
        <select id="houseSizeSel">
          <option value="">— choose —</option>
          ${Object.entries(HOUSE_SPECS).map(([k,v])=>`<option value="${k}" ${zone.houseSize===k?'selected':''}>${v.label}</option>`).join('')}
        </select>`;
      rp.appendChild(f1);
      f1.querySelector('select').onchange = (e)=>{ zone.houseSize = e.target.value || null; renderAll(); };

      const f2 = document.createElement('div'); f2.className='field';
      f2.innerHTML = `<label>Density</label>
        <select id="densitySel">
          <option value="">— choose —</option>
          <option value="low" ${zone.density==='low'?'selected':''}>Low</option>
          <option value="medium" ${zone.density==='medium'?'selected':''}>Medium</option>
          <option value="high" ${zone.density==='high'?'selected':''}>High</option>
        </select>`;
      rp.appendChild(f2);
      f2.querySelector('select').onchange = (e)=>{ zone.density = e.target.value || null; renderAll(); };

      const fillBtn = document.createElement('button');
      fillBtn.className='btn'; fillBtn.textContent='Autofill this zone';
      fillBtn.onclick = ()=>autofillZone(zone);
      rp.appendChild(fillBtn);

      const delBtn = document.createElement('button');
      delBtn.className='btn danger'; delBtn.textContent='Delete zone';
      delBtn.onclick = ()=>{
        pushUndo();
        state.zones = state.zones.filter(z=>z.id!==zone.id);
        removeZoneAlleys(zone.id);
        removeZoneWalls(zone.id);
        state.selectedZoneId = null;
        renderAll();
      };
      rp.appendChild(delBtn);
    }
  }

  // shape management (stages 1-3)
  if(state.stage<=3){
    const h5 = document.createElement('h2'); h5.textContent='Shapes on this layer'; rp.appendChild(h5);
    let list = [];
    if(state.stage===1) list = [...state.rivers.map(s=>({s,label:'River',arr:state.rivers})),
                                 ...state.parks.map(s=>({s,label:'Park',arr:state.parks})),
                                 ...state.hills.map(s=>({s,label:'Hill',arr:state.hills}))];
    if(state.stage===2) list = state.roads.map(s=>({s,label:s.type,arr:state.roads}));
    if(state.stage===3) list = state.walls.map(s=>({s,label:'Wall',arr:state.walls}));
    if(list.length===0){
      const hint = document.createElement('div'); hint.className='hint';
      hint.textContent = 'Nothing drawn on this layer yet.';
      rp.appendChild(hint);
    }
    list.forEach(item=>{
      const row = document.createElement('div');
      row.className='zone-item';
      row.innerHTML = `<span>${item.label}</span><span class="tag">${item.s.points.length} pts</span>`;
      const del = document.createElement('span');
      del.textContent = '✕'; del.style.cursor='pointer'; del.style.color='#c96a5a'; del.style.marginLeft='8px';
      del.onclick = (ev)=>{
        ev.stopPropagation();
        pushUndo();
        item.arr.splice(item.arr.indexOf(item.s),1);
        renderAll();
      };
      row.appendChild(del);
      rp.appendChild(row);
    });
  }

  // save / load
  const h7 = document.createElement('h2'); h7.textContent='Save & Load'; rp.appendChild(h7);
  const saveHint = document.createElement('div'); saveHint.className='hint';
  saveHint.textContent = 'Save your work as a file, then load it again later to keep building on it.';
  rp.appendChild(saveHint);
  const saveBtn = document.createElement('button');
  saveBtn.className='btn'; saveBtn.textContent='Save map to file';
  saveBtn.onclick = exportProjectJSON;
  rp.appendChild(saveBtn);
  const loadBtn = document.createElement('button');
  loadBtn.className='btn secondary'; loadBtn.textContent='Load map from file';
  loadBtn.onclick = ()=> document.getElementById('loadFileInput').click();
  rp.appendChild(loadBtn);

  // export
  const h6 = document.createElement('h2'); h6.textContent='Export'; rp.appendChild(h6);
  const exportBtn = document.createElement('button');
  exportBtn.className='btn secondary'; exportBtn.textContent='Download map as SVG';
  exportBtn.onclick = exportSVG;
  rp.appendChild(exportBtn);
  const clearBtn = document.createElement('button');
  clearBtn.className='btn danger';
  clearBtn.textContent = clearMapArmed ? 'Click again to confirm — clears everything' : 'Clear entire map';
  clearBtn.onclick = ()=>{
    if(!clearMapArmed){
      clearMapArmed = true;
      setStatus('Click "Clear entire map" once more to confirm.');
      if(clearMapArmTimer) clearTimeout(clearMapArmTimer);
      clearMapArmTimer = setTimeout(()=>{ clearMapArmed=false; clearMapArmTimer=null; renderAll(); }, 5000);
      renderAll();
      return;
    }
    clearMapArmed = false;
    if(clearMapArmTimer){ clearTimeout(clearMapArmTimer); clearMapArmTimer=null; }
    pushUndo();
    state.rivers=[]; state.parks=[]; state.hills=[]; state.roads=[]; state.walls=[]; state.zoneWalls=[];
    state.zones=[]; state.selectedZoneId=null; state.drawing=null; state.tool=null;
    setStatus('Map cleared. Ctrl+Z to undo.');
    renderAll();
  };
  rp.appendChild(clearBtn);
}

function exportSVG(){
  const clone = svg.cloneNode(true);
  clone.querySelector('#layer-drawing') && clone.removeChild(clone.querySelector('#layer-drawing'));
  const serializer = new XMLSerializer();
  let src = serializer.serializeToString(clone);
  src = '<?xml version="1.0" standalone="no"?>\n' + src;
  const blob = new Blob([src], {type:'image/svg+xml'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'fantasy-town-map.svg';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/* ---------------------------------------------------------------- save / load project */
/* Saves everything needed to pick the map back up later — every drawn
   shape, the current style/layers — as a plain JSON file the person can
   keep and re-open in this same tool. This is a different thing from
   "Download as SVG" above: the SVG is a finished picture, this is the
   editable project itself. */
const SAVE_FORMAT_VERSION = 1;
function exportProjectJSON(){
  const data = {
    format:'town-map-builder', version:SAVE_FORMAT_VERSION, savedAt:new Date().toISOString(),
    style: state.style, layers: state.layers,
    rivers: state.rivers, parks: state.parks, hills: state.hills,
    roads: state.roads, walls: state.walls, zoneWalls: state.zoneWalls, zones: state.zones,
    nextId: state.nextId
  };
  const blob = new Blob([JSON.stringify(data)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = data.savedAt.slice(0,16).replace(/[:T]/g,'-');
  a.href = url; a.download = 'town-map-'+stamp+'.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  setStatus('Map saved.');
}
/* Scans a loaded save for the highest numeric id in use, so freshly drawn
   shapes afterward never collide with restored ones even if the file's own
   nextId was missing, stale, or hand-edited. */
function safeNextId(data){
  let maxNum = 0;
  const scan = (arr)=>{
    (arr||[]).forEach(o=>{
      const m = /(\d+)/.exec((o && o.id) || '');
      if(m) maxNum = Math.max(maxNum, parseInt(m[1],10));
    });
  };
  scan(data.rivers); scan(data.parks); scan(data.hills); scan(data.roads); scan(data.zones); scan(data.zoneWalls);
  if(Array.isArray(data.walls)) scan(data.walls);
  if(data.wall) scan([data.wall]); // old save files used a single wall field
  return Math.max(maxNum+1, Number(data.nextId)||1);
}
function importProjectFile(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (e)=>{
    let data;
    try{ data = JSON.parse(e.target.result); }
    catch(err){ setStatus("Couldn't read that file — it doesn't look like valid JSON."); return; }
    if(!data || typeof data!=='object' || !Array.isArray(data.zones) || !Array.isArray(data.roads)){
      setStatus("That file doesn't look like a town map save file.");
      return;
    }
    pushUndo();
    state.style = (STYLE_PARAMS[data.style]) ? data.style : state.style;
    state.layers = data.layers && typeof data.layers==='object' ? data.layers : state.layers;
    state.rivers = Array.isArray(data.rivers) ? data.rivers : [];
    state.parks = Array.isArray(data.parks) ? data.parks : [];
    state.hills = Array.isArray(data.hills) ? data.hills : [];
    state.roads = Array.isArray(data.roads) ? data.roads : [];
    // walls used to be a single object in older save files — accept either shape
    if(Array.isArray(data.walls)) state.walls = data.walls;
    else if(data.wall && Array.isArray(data.wall.points)) state.walls = [data.wall];
    else state.walls = [];
    state.zoneWalls = Array.isArray(data.zoneWalls) ? data.zoneWalls : [];
    state.zones = Array.isArray(data.zones) ? data.zones.map(z=>({...z, buildings: Array.isArray(z.buildings) ? z.buildings : []})) : [];
    state.nextId = safeNextId(data);
    state.selection = null; state.selectedVertexIndex = null; state.draggingVertex = false;
    state.drawing = null; state.tool = null; state.selectedZoneId = null;
    setStatus('Map loaded from file.');
    renderAll();
  };
  reader.onerror = ()=> setStatus("Couldn't read that file.");
  reader.readAsText(file);
}
document.getElementById('loadFileInput').addEventListener('change', (e)=>{
  const file = e.target.files && e.target.files[0];
  importProjectFile(file);
  e.target.value = ''; // allow reloading the same filename later
});

/* ---------------------------------------------------------------- style toggle */
document.getElementById('styleToggle').addEventListener('click', (e)=>{
  const btn = e.target.closest('button[data-style]');
  if(!btn) return;
  state.style = btn.dataset.style;
  renderAll();
});
function syncStyleToggle(){
  document.querySelectorAll('#styleToggle button').forEach(b=>{
    b.classList.toggle('active', b.dataset.style===state.style);
  });
}
const _renderAll = renderAll;
renderAll = function(){ _renderAll(); syncStyleToggle(); };

/* ---------------------------------------------------------------- init */
renderAll();

})();
</script>
