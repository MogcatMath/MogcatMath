<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Fractions Plotter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Patrick+Hand&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
:root {
  --paper: #F4F7FB;
  --grid:  #DCE7F2;
  --ink:   #1E3A5F;
  --pencil:#4A6FA5;
  --panel: #2b3a50;
  --panel-btn: #354761;
  --border:#5a7799;
  --card:  #ffffff;
  --accent:#d98a3d;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  font-family: 'Patrick Hand', sans-serif;
  font-size: 16px;
  color: var(--ink);
  background-color: var(--paper);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ── Header ── */
header {
  background: var(--panel);
  padding: 8px 14px;
  display: flex;
  align-items: center;
  gap: 14px;
  flex-shrink: 0;
  border-bottom: 2px solid var(--border);
}
h1 {
  font-family: 'Caveat', cursive;
  font-size: 26px;
  font-weight: 700;
  color: #fff;
  white-space: nowrap;
}

/* ── Mode buttons in header ── */
.mode-row { display: flex; gap: 8px; flex-wrap: wrap; }
button.mode-btn {
  font-family: 'Patrick Hand', sans-serif;
  font-size: 15px;
  padding: 6px 16px;
  background: var(--panel-btn);
  color: #c8d8ec;
  border: 1.5px solid var(--border);
  border-radius: 20px;
  cursor: pointer;
  min-height: 38px;
  touch-action: manipulation;
  transition: background 0.15s;
}
button.mode-btn:hover { background: #405875; }
button.mode-btn.active {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
  font-weight: 600;
}

/* ── Main layout ── */
.main {
  display: flex;
  flex-direction: row;
  flex: 1;
  overflow: hidden;
  gap: 0;
}

/* ── Left panel ── */
.panel {
  width: 200px;
  flex-shrink: 0;
  background: var(--panel);
  border-right: 2px solid var(--border);
  display: flex;
  flex-direction: column;
  gap: 0;
  overflow-y: auto;
  padding: 10px 10px;
}
.section-label {
  font-family: 'Caveat', cursive;
  font-size: 17px;
  font-weight: 700;
  color: #c8d8ec;
  margin: 8px 0 4px 2px;
  border-bottom: 1px solid var(--border);
  padding-bottom: 2px;
}
.line-btns-row {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  margin-bottom: 4px;
}
button.line-btn {
  font-family: 'Patrick Hand', sans-serif;
  font-size: 14px;
  padding: 4px 9px;
  background: var(--panel-btn);
  color: #c8d8ec;
  border: 1px solid var(--border);
  border-radius: 8px;
  cursor: pointer;
  min-height: 36px;
  touch-action: manipulation;
  transition: background 0.12s;
}
button.line-btn:hover { background: #405875; }

/* toolbar at bottom of panel */
.panel-toolbar {
  margin-top: auto;
  padding-top: 10px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
button.tool-btn {
  font-family: 'Patrick Hand', sans-serif;
  font-size: 15px;
  padding: 7px 10px;
  background: var(--panel-btn);
  color: #c8d8ec;
  border: 1.5px solid var(--border);
  border-radius: 10px;
  cursor: pointer;
  min-height: 40px;
  touch-action: manipulation;
  text-align: left;
  width: 100%;
  transition: background 0.12s;
}
button.tool-btn:hover { background: #405875; }
button.tool-btn.active {
  background: #534AB7;
  color: #fff;
  border-color: #7a72d0;
}

/* ── Chart area ── */
.chart-area {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 12px;
  overflow: hidden;
}
.chart-wrap {
  background: white;
  border: 1.5px solid var(--border);
  border-radius: 10px;
  padding: 8px;
  box-shadow: 0 2px 8px rgba(30,58,95,0.10);
  width: 100%;
  height: 100%;
  position: relative;
}
canvas#chart { display: block; }

/* ── Info bar ── */
.info-bar {
  background: var(--panel);
  border-top: 1.5px solid var(--border);
  padding: 5px 14px;
  font-size: 14px;
  color: #a0bcd8;
  flex-shrink: 0;
  min-height: 28px;
  font-family: 'Patrick Hand', sans-serif;
}
</style>
</head>
<body>

<header>
  <h1>Fractions Plotter</h1>
  <div class="mode-row">
    <button class="mode-btn" id="m-unitary">Unitary fractions</button>
    <button class="mode-btn" id="m-multiple">Proper fractions</button>
    <button class="mode-btn" id="m-improper">Improper fractions</button>
  </div>
</header>

<div class="main">
  <div class="panel" id="panel">
    <div id="line-btn-area"></div>
    <div class="panel-toolbar" id="panel-toolbar" style="display:none;">
      <button class="tool-btn" id="clear-btn">🗑 Clear all</button>
      <button class="tool-btn" id="const-denom-btn">Common denominator</button>
    </div>
  </div>
  <div class="chart-area" id="chart-area">
    <div class="chart-wrap" id="chart-wrap">
      <canvas id="chart" role="img" aria-label="Fraction lines plot"></canvas>
    </div>
  </div>
</div>

<div class="info-bar" id="info">Select a fraction type above to begin.</div>

<script>
const BASE_MAX = 20;
const PALETTE = ['#185FA5','#0F6E56','#993C1D','#993556','#534AB7','#3B6D11','#854F0B','#A32D2D','#0C447C','#085041',
                 '#1D9E75','#D85A30','#D4537E','#639922','#BA7517','#7F77DD','#378ADD','#E24B4A'];
const RING_COLORS = ['#E24B4A','#EF9F27','#1D9E75','#7F77DD','#D4537E','#378ADD','#639922','#BA7517'];

function gcd(a,b){return b===0?a:gcd(b,a%b);}
function lcm(a,b){return(a*b)/gcd(a,b);}

let activeLines=[], activeModes=new Set(), constDenomOn=false, chart;

function linePoints(n,d,maxX){
  const pts=[];
  for(let k=1;k*d<=maxX;k++) pts.push({x:k*d,y:k*n});
  return pts;
}
function getAxisMax(){
  if(!constDenomOn||activeLines.length<2) return BASE_MAX;
  const lcd=activeLines.reduce((acc,l)=>lcm(acc,l.d),activeLines[0].d);
  return lcd>BASE_MAX?lcd+Math.ceil(lcd*0.1):BASE_MAX;
}
function getYMax(axisMax){
  if(activeModes.has('improper')){
    const imp=activeLines.filter(l=>l.n>l.d);
    if(imp.length) return Math.max(axisMax,Math.max(...imp.map(l=>l.d))*2)+0.5;
  }
  return axisMax+0.5;
}
function getSharedDenomGroups(axisMax){
  if(activeLines.length<2) return {};
  const xSets=activeLines.map(l=>new Set(linePoints(l.n,l.d,axisMax).map(p=>p.x)));
  const sharedXs=[...xSets[0]].filter(x=>xSets.every(s=>s.has(x)));
  const groups={};
  sharedXs.forEach(x=>{
    groups[x]=[];
    activeLines.forEach(l=>linePoints(l.n,l.d,axisMax).forEach(p=>{if(p.x===x)groups[x].push(p);}));
  });
  return groups;
}
function bgPoints(axisMax){
  const active=new Set(activeLines.flatMap(l=>linePoints(l.n,l.d,axisMax).map(p=>p.x+','+p.y)));
  const pts=[];
  for(let d=1;d<=axisMax;d++)
    for(let n=1;n<=d;n++)
      if(gcd(n,d)===1&&!active.has(d+','+n)) pts.push({x:d,y:n});
  return pts;
}

function getChartSize(){
  const wrap=document.getElementById('chart-wrap');
  return {w:wrap.clientWidth-16, h:wrap.clientHeight-16};
}

function buildChart(){
  const axisMax=getAxisMax();
  const yMax=getYMax(axisMax);
  const datasets=[];
  activeLines.forEach((l,i)=>{
    const col=PALETTE[i%PALETTE.length];
    datasets.push({
      label:l.key, data:linePoints(l.n,l.d,axisMax),
      type:'line', borderColor:col, backgroundColor:col,
      pointRadius:5, pointHoverRadius:7, showLine:true, borderWidth:2, order:1
    });
  });
  if(constDenomOn&&activeLines.length>=2){
    const groups=getSharedDenomGroups(axisMax);
    Object.keys(groups).map(Number).sort((a,b)=>a-b).forEach((x,i)=>{
      datasets.push({
        label:'ring'+x, data:groups[x], type:'scatter',
        backgroundColor:'transparent', borderColor:RING_COLORS[i%RING_COLORS.length],
        pointStyle:'circle', pointRadius:12, pointHoverRadius:14,
        pointBorderWidth:2.5, pointBackgroundColor:'transparent', order:0
      });
    });
  }
  datasets.push({
    label:'bg', data:bgPoints(axisMax), type:'scatter',
    backgroundColor:'rgba(74,111,165,0.25)', pointRadius:3, order:2
  });

  const {w,h}=getChartSize();
  const canvas=document.getElementById('chart');
  canvas.width=w; canvas.height=h;

  if(chart) chart.destroy();
  const tickStep=axisMax>40?5:axisMax>25?2:1;
  const yTickStep=yMax>40?5:yMax>25?2:1;

  chart=new Chart(canvas,{
    type:'scatter', data:{datasets},
    options:{
      responsive:false, animation:{duration:250},
      plugins:{
        legend:{display:false},
        tooltip:{callbacks:{label:ctx=>ctx.parsed.y+'/'+ctx.parsed.x+' = '+(ctx.parsed.y/ctx.parsed.x).toFixed(3)}}
      },
      scales:{
        x:{
          title:{display:true,text:'Denominator',color:var_ink(),font:{size:14,family:"'Patrick Hand', sans-serif"}},
          min:0, max:axisMax+0.5,
          ticks:{stepSize:tickStep,color:var_ink(),font:{family:"'Patrick Hand', sans-serif"},callback:v=>Number.isInteger(v)&&v%tickStep===0?v:''},
          grid:{color:'rgba(220,231,242,0.8)'}
        },
        y:{
          title:{display:true,text:'Numerator',color:var_ink(),font:{size:14,family:"'Patrick Hand', sans-serif"}},
          min:0, max:yMax,
          ticks:{stepSize:yTickStep,color:var_ink(),font:{family:"'Patrick Hand', sans-serif"},callback:v=>Number.isInteger(v)&&v%yTickStep===0?v:''},
          grid:{color:'rgba(220,231,242,0.8)'}
        }
      }
    }
  });
}
function var_ink(){return '#1E3A5F';}

function getButtonDefs(mode){
  const defs=[];
  if(mode==='unitary'){
    for(let d=1;d<=10;d++) defs.push({key:'1/'+d,n:1,d});
  } else if(mode==='multiple'){
    for(let d=2;d<=10;d++) for(let n=1;n<d;n++) if(gcd(n,d)===1) defs.push({key:n+'/'+d,n,d});
  } else {
    for(let d=1;d<=10;d++) for(let n=d+1;n<=2*d;n++) if(gcd(n,d)===1) defs.push({key:n+'/'+d,n,d});
  }
  return defs;
}
const MODE_LABELS={unitary:'Unitary',multiple:'Proper',improper:'Improper'};

function rebuildLineBtnArea(){
  const area=document.getElementById('line-btn-area');
  area.innerHTML='';
  ['unitary','multiple','improper'].forEach(mode=>{
    if(!activeModes.has(mode)) return;
    const lbl=document.createElement('div');
    lbl.className='section-label';
    lbl.textContent=MODE_LABELS[mode];
    area.appendChild(lbl);
    const row=document.createElement('div');
    row.className='line-btns-row';
    getButtonDefs(mode).forEach(def=>{
      const btn=document.createElement('button');
      btn.className='line-btn';
      btn.textContent=def.key;
      const idx=activeLines.findIndex(l=>l.key===def.key);
      if(idx>=0){btn.style.background=PALETTE[idx%PALETTE.length];btn.style.color='#fff';btn.style.borderColor=PALETTE[idx%PALETTE.length];}
      btn.onclick=()=>{
        const i=activeLines.findIndex(l=>l.key===def.key);
        if(i>=0) activeLines.splice(i,1); else activeLines.push({key:def.key,n:def.n,d:def.d});
        rebuildLineBtnArea(); updateInfo(); buildChart();
      };
      row.appendChild(btn);
    });
    area.appendChild(row);
  });
  document.getElementById('panel-toolbar').style.display=activeModes.size>0?'flex':'none';
  document.getElementById('panel-toolbar').style.flexDirection='column';
}

function updateInfo(){
  const el=document.getElementById('info');
  if(activeModes.size===0){el.textContent='Select a fraction type above to begin.';return;}
  if(activeLines.length===0){el.textContent='Select fractions to plot.';return;}
  let txt=activeLines.map(l=>l.key).join(', ');
  if(constDenomOn&&activeLines.length>=2){
    const ax=getAxisMax();
    const grps=getSharedDenomGroups(ax);
    const shared=Object.keys(grps).map(Number).sort((a,b)=>a-b);
    const lcd=activeLines.reduce((acc,l)=>lcm(acc,l.d),activeLines[0].d);
    txt+=shared.length?' · common denominators: '+shared.join(', '):'  · no common denominators in range';
    if(lcd>BASE_MAX) txt+=' (axis extended to '+getAxisMax()+')';
  }
  el.textContent=txt;
}

['unitary','multiple','improper'].forEach(m=>{
  document.getElementById('m-'+m).onclick=()=>{
    if(activeModes.has(m)){
      activeModes.delete(m);
      const defs=new Set(getButtonDefs(m).map(d=>d.key));
      activeLines=activeLines.filter(l=>!defs.has(l.key));
      document.getElementById('m-'+m).classList.remove('active');
    } else {
      activeModes.add(m);
      document.getElementById('m-'+m).classList.add('active');
    }
    rebuildLineBtnArea(); updateInfo(); buildChart();
  };
});

document.getElementById('clear-btn').onclick=()=>{
  activeLines=[];
  rebuildLineBtnArea(); updateInfo(); buildChart();
};
document.getElementById('const-denom-btn').onclick=()=>{
  constDenomOn=!constDenomOn;
  document.getElementById('const-denom-btn').classList.toggle('active',constDenomOn);
  updateInfo(); buildChart();
};

window.addEventListener('resize',()=>buildChart());

rebuildLineBtnArea(); updateInfo(); buildChart();
</script>
</body>
</html>
