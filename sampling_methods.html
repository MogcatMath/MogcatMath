<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sampling Methods — A-Level Statistics</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F4F7FB;
  --grid:#DCE7F2;
  --ink:#1E3A5F;
  --pencil:#4A6FA5;
  --card:#ffffff;
  --card-border:#b0c4de;
  --btn-bg:#ffffff;
  --btn-border:#4A6FA5;
  --btn-hover:#e8f0fb;
  --btn-active-bg:#e8f0fb;
  --btn-active-border:#1E3A5F;
  --btn-active-color:#1E3A5F;
  --circle-off:#c8d8ec;
  --circle-off-border:#a0b8d4;
  --circle-on:#2e7dd1;
  --circle-on-border:#1E3A5F;
  --info-bg:#ffffff;
  --info-border:#b0c4de;
  --toggle-bg:#e0e8f4;
  --input-bg:#f0f4fb;
}
body.dark{
  --paper:#1a1a2e;
  --grid:#23233d;
  --ink:#e0e0f0;
  --pencil:#9090c0;
  --card:#22223a;
  --card-border:#333355;
  --btn-bg:#2a2a3e;
  --btn-border:#444466;
  --btn-hover:#33334d;
  --btn-active-bg:#2a2a3e;
  --btn-active-border:#7b7bff;
  --btn-active-color:#c0c0ff;
  --circle-off:#3a3a52;
  --circle-off-border:#555577;
  --circle-on:#4a9eff;
  --circle-on-border:#2277cc;
  --info-bg:#22223a;
  --info-border:#333355;
  --toggle-bg:#2a2a3e;
  --input-bg:#2a2a3e;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:'Inter',sans-serif;
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:26px 26px;
  color:var(--ink);
  min-height:100vh;
  padding:20px;
  transition:background-color 0.3s,color 0.3s;
}
header{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  margin-bottom:18px;
}
.title-block h1{
  font-size:22px;
  font-weight:700;
  color:var(--ink);
  line-height:1.1;
}
.title-block p{
  font-size:13px;
  color:var(--pencil);
  margin-top:3px;
}
.toggle-btn{
  display:flex;
  align-items:center;
  gap:7px;
  background:var(--toggle-bg);
  border:1.5px solid var(--card-border);
  border-radius:999px;
  padding:5px 12px;
  cursor:pointer;
  font-family:'Inter',sans-serif;
  font-size:13px;
  color:var(--ink);
  white-space:nowrap;
  flex-shrink:0;
  transition:background 0.2s;
}
.toggle-btn:hover{background:var(--btn-hover);}
.toggle-icon{font-size:15px;}
.wrap{display:flex;gap:18px;align-items:flex-start;}
.btn-col{display:flex;flex-direction:column;gap:8px;min-width:130px;}
.col-label{
  font-size:13px;
  font-weight:600;
  color:var(--pencil);
  margin-bottom:2px;
  text-transform:uppercase;
  letter-spacing:0.05em;
}
.s-btn{
  padding:9px 18px;
  font-size:14px;
  font-family:'Inter',sans-serif;
  font-weight:500;
  cursor:pointer;
  border:1.5px solid var(--btn-border);
  border-radius:999px;
  background:var(--btn-bg);
  color:var(--ink);
  text-align:left;
  transition:background 0.15s,border-color 0.15s,color 0.15s;
}
.s-btn:hover{background:var(--btn-hover);}
.s-btn.active{
  background:var(--btn-active-bg);
  border-color:var(--btn-active-border);
  color:var(--btn-active-color);
  font-weight:700;
}
.pct-row{
  display:flex;
  align-items:center;
  gap:8px;
  margin-top:10px;
  flex-wrap:wrap;
}
.pct-row label{font-size:13px;color:var(--pencil);}
.pct-row input{
  width:58px;
  font-size:14px;
  font-family:'Inter',sans-serif;
  padding:5px 8px;
  border-radius:8px;
  border:1.5px solid var(--btn-border);
  background:var(--input-bg);
  color:var(--ink);
  text-align:center;
}
.pct-info{font-size:11px;color:var(--pencil);margin-top:4px;}
.legend{display:flex;gap:12px;margin-top:12px;flex-wrap:wrap;}
.leg{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--pencil);}
.leg-dot{width:13px;height:13px;border-radius:50%;flex-shrink:0;}
.batches{display:flex;flex-direction:column;gap:8px;flex:1;min-width:0;}
.batch{
  background:var(--card);
  border:1.5px solid var(--card-border);
  border-radius:10px;
  padding:10px 12px;
  box-shadow:2px 2px 6px rgba(30,58,95,0.07);
}
.batch-label{
  font-size:12px;
  font-weight:600;
  color:var(--pencil);
  margin-bottom:7px;
  text-transform:uppercase;
  letter-spacing:0.04em;
}
.circles{display:grid;grid-template-columns:repeat(10,20px);gap:5px;}
.c{
  width:20px;height:20px;border-radius:50%;
  background:var(--circle-off);
  border:1px solid var(--circle-off-border);
  transition:background 0.25s,border-color 0.25s;
}
.c.lit{background:var(--circle-on);border-color:var(--circle-on-border);}
.info-box{
  min-width:155px;max-width:175px;
  background:var(--info-bg);
  border:1.5px solid var(--info-border);
  border-radius:12px;
  padding:14px 16px;
  opacity:0;
  transition:opacity 0.4s;
  pointer-events:none;
  box-shadow:2px 2px 6px rgba(30,58,95,0.07);
}
.info-box.show{opacity:1;pointer-events:auto;}
.info-title{
  font-size:13px;
  font-weight:700;
  color:var(--ink);
  margin-bottom:8px;
}
.info-body{font-size:12px;color:var(--pencil);line-height:1.65;}
</style>
</head>
<body>

<header>
  <div class="title-block">
    <h1>Sampling Methods</h1>
    <p>A-Level Statistics · Click a method to see which items are sampled</p>
  </div>
  <button class="toggle-btn" onclick="toggleDark()">
    <span class="toggle-icon" id="toggle-icon">☀️</span>
    <span id="toggle-label">Light</span>
  </button>
</header>

<div class="wrap">
  <div class="btn-col">
    <p class="col-label">Method</p>
    <button class="s-btn" onclick="sel('census',this)">Census</button>
    <button class="s-btn" onclick="sel('random',this)">Random</button>
    <button class="s-btn" onclick="sel('systematic',this)">Systematic</button>
    <button class="s-btn" onclick="sel('stratified',this)">Stratified</button>
    <button class="s-btn" onclick="sel('quota',this)">Quota</button>
    <div class="pct-row">
      <label for="pct">Sample %</label>
      <input type="number" id="pct" value="20" min="1" max="100" step="1" oninput="refresh()">
      <span style="font-size:13px;color:var(--pencil);">%</span>
    </div>
    <p class="pct-info" id="pct-info"></p>
    <div class="legend">
      <div class="leg"><div class="leg-dot" style="background:var(--circle-on);border:1px solid var(--circle-on-border);"></div>sampled</div>
      <div class="leg"><div class="leg-dot" style="background:var(--circle-off);border:1px solid var(--circle-off-border);"></div>not sampled</div>
    </div>
  </div>

  <div class="batches" id="batches"></div>

  <div class="info-box" id="info">
    <div class="info-title" id="info-title"></div>
    <div class="info-body" id="info-body"></div>
  </div>
</div>

<script>
const BATCH_SIZES=[10,20,20,20,40];
const TOT=BATCH_SIZES.reduce((a,b)=>a+b,0);
let cur=null;

const desc={
  census:{title:'Census',body:'Every single item is examined. Complete data is collected from all '+TOT+' products across all 5 batches.'},
  random:{title:'Simple random sampling',body:'Each item has an equal chance of selection. Items are chosen at random across the whole population, with no regard for batch.'},
  systematic:{title:'Systematic sampling',body:'A starting point is chosen at random, then every kth item is selected. The interval k = population ÷ sample size.'},
  stratified:{title:'Stratified random sampling',body:'The population is split into strata — here the 5 batches. Items are chosen randomly within each stratum in proportion to its size. Larger batches contribute more to the sample.'},
  quota:{title:'Quota sampling',body:'Like stratified, but selection within each group is not random. The researcher picks the first available items until the quota for each batch is filled — proportional to batch size, but with no randomisation.'}
};

function build(){
  const cont=document.getElementById('batches');cont.innerHTML='';
  for(let b=0;b<BATCH_SIZES.length;b++){
    const sz=BATCH_SIZES[b],cols=Math.min(10,sz);
    const d=document.createElement('div');d.className='batch';
    d.innerHTML=`<div class="batch-label">Batch ${b+1} <span style="font-size:11px;opacity:0.6;font-weight:400;">(${sz} items)</span></div><div class="circles" id="b${b}" style="grid-template-columns:repeat(${cols},20px)"></div>`;
    cont.appendChild(d);
    const row=document.getElementById(`b${b}`);
    for(let i=0;i<sz;i++){const c=document.createElement('div');c.className='c';c.id=`c${b}_${i}`;row.appendChild(c);}
  }
}

function clearAll(){
  for(let b=0;b<BATCH_SIZES.length;b++)
    for(let i=0;i<BATCH_SIZES[b];i++)
      document.getElementById(`c${b}_${i}`).className='c';
}

function light(idx){idx.forEach(({b,i})=>{const e=document.getElementById(`c${b}_${i}`);if(e)e.className='c lit';});}

function getSampleN(){
  const pct=Math.min(100,Math.max(1,parseInt(document.getElementById('pct').value)||20));
  return Math.max(1,Math.round(TOT*pct/100));
}

function censusI(){const o=[];for(let b=0;b<BATCH_SIZES.length;b++)for(let i=0;i<BATCH_SIZES[b];i++)o.push({b,i});return o;}
function randI(n){const p=[];for(let b=0;b<BATCH_SIZES.length;b++)for(let i=0;i<BATCH_SIZES[b];i++)p.push({b,i});for(let j=p.length-1;j>0;j--){const k=Math.floor(Math.random()*(j+1));[p[j],p[k]]=[p[k],p[j]];}return p.slice(0,n);}
function sysI(n){if(n>=TOT)return censusI();const flat=[];for(let b=0;b<BATCH_SIZES.length;b++)for(let i=0;i<BATCH_SIZES[b];i++)flat.push({b,i});const iv=TOT/n,st=Math.random()*iv,o=[];for(let s=0;s<n;s++){const idx=Math.floor(st+s*iv);if(idx<TOT)o.push(flat[idx]);}return o;}
function stratI(n){const o=[];for(let b=0;b<BATCH_SIZES.length;b++){const sz=BATCH_SIZES[b],take=Math.round(n*sz/TOT);const p=Array.from({length:sz},(_,i)=>i);for(let j=p.length-1;j>0;j--){const k=Math.floor(Math.random()*(j+1));[p[j],p[k]]=[p[k],p[j]];}p.slice(0,take).forEach(i=>o.push({b,i}));}return o;}
function quotaI(n){const o=[];for(let b=0;b<BATCH_SIZES.length;b++){const sz=BATCH_SIZES[b],take=Math.round(n*sz/TOT);for(let i=0;i<take&&i<sz;i++)o.push({b,i});}return o;}

function run(m){
  const k=m==='census'?TOT:getSampleN();
  return {census:censusI,random:()=>randI(k),systematic:()=>sysI(k),stratified:()=>stratI(k),quota:()=>quotaI(k)}[m]();
}

function sel(m,btn){
  cur=m;
  document.querySelectorAll('.s-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  clearAll();
  const idx=run(m);
  light(idx);
  document.getElementById('info-title').textContent=desc[m].title;
  document.getElementById('info-body').textContent=desc[m].body;
  document.getElementById('info').classList.add('show');
  document.getElementById('pct-info').textContent=`${idx.length} of ${TOT} (${Math.round(idx.length/TOT*100)}%)`;
}

function refresh(){
  if(!cur)return;
  clearAll();
  const idx=run(cur);
  light(idx);
  document.getElementById('pct-info').textContent=`${idx.length} of ${TOT} (${Math.round(idx.length/TOT*100)}%)`;
}

let dark=false;
function toggleDark(){
  dark=!dark;
  document.body.classList.toggle('dark',dark);
  document.getElementById('toggle-icon').textContent=dark?'🌙':'☀️';
  document.getElementById('toggle-label').textContent=dark?'Dark':'Light';
}

build();
</script>
</body>
</html>
