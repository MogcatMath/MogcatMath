<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sketching quadratics and cubics</title>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#eef2f7; --panel:#ffffff; --paper:#fbfcfe; --soft:#f3f6fb;
  --ink:#14213d; --muted:#53617c; --line:#cfd8e6; --grid:#e1e8f2; --curve:#14213d;
  --int:#1747d6; --int-bg:#dce6ff;
  --tp:#c2410c;  --tp-bg:#ffe6d6;
  --root:#157a3b; --root-bg:#d9f3e2;
  --end:#7a3fd1; --end-bg:#ebe0fb;
  --sans:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;
  --serif:'Source Serif 4',Georgia,'Times New Roman',serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0c1322; --panel:#141d31; --paper:#0f1729; --soft:#101a2e;
    --ink:#e9eefb; --muted:#9fb0cf; --line:#2a3a5a; --grid:#182440; --curve:#e9eefb;
    --int:#8aabff; --int-bg:#1c2f66;
    --tp:#ffa26b; --tp-bg:#4a2410;
    --root:#5fe08a; --root-bg:#143d25;
    --end:#c3a3ff; --end-bg:#34205c;
  }
}
:root[data-theme="dark"]{
  --bg:#0c1322; --panel:#141d31; --paper:#0f1729; --soft:#101a2e;
  --ink:#e9eefb; --muted:#9fb0cf; --line:#2a3a5a; --grid:#182440; --curve:#e9eefb;
  --int:#8aabff; --int-bg:#1c2f66;
  --tp:#ffa26b; --tp-bg:#4a2410;
  --root:#5fe08a; --root-bg:#143d25;
  --end:#c3a3ff; --end-bg:#34205c;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;-webkit-text-size-adjust:100%}
.app{height:100%;display:flex;flex-direction:column;gap:10px;
  padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px))}

/* ---------- top bar ---------- */
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.seg{display:inline-flex;border:2px solid var(--ink);border-radius:12px;overflow:hidden;background:var(--panel)}
.seg button{font:700 18px var(--sans);min-height:46px;padding:0 20px;border:0;background:transparent;color:var(--ink);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
select,input[type=text]{font:400 19px var(--serif);min-height:46px;border:2px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);padding:0 12px}
select{min-width:260px;max-width:100%}
input[type=text]{width:min(340px,100%)}
.own{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hint{font-size:14px;color:var(--muted)}
.go{font:700 17px var(--sans);min-height:46px;padding:0 18px;border-radius:12px;border:2px solid var(--ink);background:var(--ink);color:var(--panel);cursor:pointer}
.err{margin:0;padding:8px 12px;border-radius:10px;background:var(--tp-bg);color:var(--tp);font-weight:700;font-size:15px}
.err[hidden],.own[hidden]{display:none}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--int);outline-offset:2px}

/* ---------- layout ---------- */
.grid{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:12px}
.work,.graph{min-height:0;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}

/* ---------- working ---------- */
.steps{position:relative;flex:1;min-height:0;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:10px;-webkit-overflow-scrolling:touch}
.card{border:1px solid var(--line);border-radius:10px;padding:10px 14px 8px;background:var(--panel)}
.card.old{background:var(--soft)}
.card.cur{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.ct{display:flex;align-items:center;gap:9px;margin-bottom:2px}
.ct h2{margin:0;font:700 18px var(--sans);flex:1}
.cnt{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.dot{width:13px;height:13px;border-radius:50%;flex:none;border:2px solid var(--muted)}
.dot.int{background:var(--int);border-color:var(--int)}
.dot.tp{background:var(--tp);border-color:var(--tp)}
.dot.root{background:var(--root);border-color:var(--root)}
.dot.end{background:var(--end);border-color:var(--end)}
.ln{font-family:var(--serif);font-size:22px;line-height:1.75;padding:1px 0;overflow-x:auto;overflow-y:hidden;white-space:nowrap}
.ln.sm{font-size:18px}
.aside{font-family:var(--sans);font-size:14px;color:var(--muted);margin-left:14px}
p.note{margin:4px 0 6px;font-size:16px;line-height:1.5}
.sum{margin:6px 0;padding:0;list-style:none;font-family:var(--serif);font-size:19px;line-height:1.8}
.sum li{display:flex;align-items:center;gap:10px}
.chip{width:14px;height:14px;border-radius:50%;flex:none}
.chip.int{background:var(--int)} .chip.tp{background:var(--tp)} .chip.root{background:var(--root)} .chip.end{background:var(--end)}
.pause{border:2px dashed var(--line);border-radius:10px;padding:9px 14px;font-size:16px;color:var(--muted)}
.pause b{color:var(--ink)}
.empty{margin:auto;max-width:300px;text-align:center;color:var(--muted);line-height:1.5}
.hl-int,.hl-tp,.hl-root,.hl-end{font-weight:700;border-radius:5px;padding:0 .25em}
.hl-int{color:var(--int);background:var(--int-bg)}
.hl-tp{color:var(--tp);background:var(--tp-bg)}
.hl-root{color:var(--root);background:var(--root-bg)}
.hl-end{color:var(--end);background:var(--end-bg)}
sup{font-size:.62em;line-height:0}
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.15;margin:0 .1em;font-size:.88em}
.frac>span:first-child{border-bottom:1.5px solid currentColor;padding:0 .25em .05em}
.frac>span:last-child{padding:.05em .25em 0}
.sqrt{white-space:nowrap}
.rad{border-top:1.5px solid currentColor;padding:0 .12em;margin-left:1px}

.ctrl{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--line);background:var(--panel)}
.ctrl button{font:700 17px var(--sans);min-height:50px;border-radius:12px;border:2px solid var(--ink);background:var(--panel);color:var(--ink);padding:0 18px;cursor:pointer}
.ctrl button.primary{background:var(--ink);color:var(--panel);flex:1;font-size:19px}
.ctrl button:disabled{opacity:.4;cursor:default}
.prog{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:74px;text-align:center}

/* ---------- graph ---------- */
.gh{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 16px;padding:10px 14px;border-bottom:1px solid var(--line)}
.gh .cap{font:600 21px var(--serif)}
.gh .cap small{font:400 14px var(--sans);color:var(--muted);margin-left:8px}
.legend{display:flex;gap:14px;font-size:14px;color:var(--muted);flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.plot{flex:1;min-height:0;background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:26px 26px}
.plot svg{display:block;width:100%;height:100%}
.lbl{font:700 15px var(--sans);paint-order:stroke;stroke:var(--paper);stroke-width:5px;stroke-linejoin:round}
.t-int{fill:var(--int)} .t-tp{fill:var(--tp)} .t-root{fill:var(--root)} .t-ink{fill:var(--muted)}
.axis{stroke:var(--ink);stroke-width:2;fill:none}
.curve{fill:none;stroke:var(--curve);stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:dr 1s ease forwards}
@keyframes dr{to{stroke-dashoffset:0}}
.pop{transform-box:fill-box;transform-origin:center;animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){
  .draw{animation:none;stroke-dasharray:none;stroke-dashoffset:0}
  .pop{animation:none}
}

@media (max-width:820px){
  .app{height:auto;min-height:100%}
  html,body{height:auto}
  .grid{grid-template-columns:1fr;display:flex;flex-direction:column}
  .work{height:62vh}
  .graph{height:78vw;min-height:380px}
  select{min-width:0;width:100%}
}
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <div class="seg" role="group" aria-label="Type of graph">
      <button id="tabQ" type="button" aria-pressed="true">Quadratic</button>
      <button id="tabC" type="button" aria-pressed="false">Cubic</button>
    </div>
    <select id="eqSel" aria-label="Choose an equation"></select>
    <div class="own" id="ownWrap" hidden>
      <input id="ownInput" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Type your own equation">
      <button id="goBtn" class="go" type="button">Show working</button>
      <span class="hint" id="hint"></span>
    </div>
  </header>
  <p class="err" id="err" role="alert" hidden></p>

  <main class="grid">
    <section class="work" aria-label="Working">
      <div class="steps" id="steps"></div>
      <div class="ctrl">
        <button id="backBtn" type="button">Back</button>
        <button id="nextBtn" type="button" class="primary">Next step</button>
        <span class="prog" id="prog"></span>
        <button id="allBtn" type="button">Show all</button>
      </div>
    </section>
    <section class="graph" aria-label="Graph sketch">
      <div class="gh">
        <div class="cap" id="cap"></div>
        <div class="legend" id="legend"></div>
      </div>
      <div class="plot"><svg id="svg" viewBox="0 0 640 520" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Graph sketch"></svg></div>
    </section>
  </main>
</div>

<script>
(function(){
'use strict';
const E=1e-9, MINUS='\u2212';

/* ================= number helpers ================= */
const isInt=x=>Math.abs(x-Math.round(x))<1e-7;
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){const t=a%b;a=b;b=t;}return a;}
function toFrac(x){
  if(isInt(x)) return [Math.round(x),1];
  for(let d=2;d<=64;d++){const n=x*d; if(Math.abs(n-Math.round(n))<1e-7){const nn=Math.round(n),g=gcd(nn,d);return [nn/g,d/g];}}
  return null;
}
function fracHTML(n,d){return `<span class="frac"><span>${n}</span><span>${d}</span></span>`;}
function absHTML(x){
  const ax=Math.abs(x), f=toFrac(ax);
  if(f) return f[1]===1?`${f[0]}`:fracHTML(f[0],f[1]);
  return (Math.round(ax*1000)/1000).toString();
}
function numHTML(x){ return (x<-1e-9?MINUS:'')+absHTML(x); }
function numText(x){
  const ax=Math.abs(x), f=toFrac(ax);
  const s=f?(f[1]===1?`${f[0]}`:`${f[0]}/${f[1]}`):(Math.round(ax*100)/100).toString();
  return (x<-1e-9?MINUS:'')+s;
}
function dec(x){const v=Math.abs(x).toFixed(2);return (x<-1e-9&&Number(v)!==0?MINUS:'')+v;}
const one=x=>Math.abs(x-1)<E;
function aCoef(a){ if(one(a)) return ''; if(one(-a)) return MINUS; return numHTML(a); }
function coef(v,first,vs){
  if(Math.abs(v)<E) return '';
  const neg=v<0, av=Math.abs(v);
  const mag=(vs&&one(av))?'':absHTML(av);
  const t=mag+vs;
  return first?((neg?MINUS:'')+t):` ${neg?MINUS:'+'} ${t}`;
}
function quadHTML(a,b,c){
  let s='',first=true;
  for(const [v,vs] of [[a,'x<sup>2</sup>'],[b,'x'],[c,'']]){const t=coef(v,first,vs); if(t){s+=t;first=false;}}
  return s||'0';
}
function constTerm(k,cls){
  if(Math.abs(k)<E) return '';
  const v=cls?`<span class="hl-${cls}">${absHTML(k)}</span>`:absHTML(k);
  return ` ${k<0?MINUS:'+'} ${v}`;
}
function brk(h,cls){
  if(Math.abs(h)<E) return 'x';
  const v=cls?`<span class="${cls}">${absHTML(h)}</span>`:absHTML(h);
  return `(x ${h<0?MINUS:'+'} ${v})`;
}
function csHTML(a,h,k,cls){
  const b=Math.abs(h)<E?'x':brk(h,cls?'hl-'+cls:'');
  return `${aCoef(a)}${b}<sup>2</sup>${constTerm(k,cls)}`;
}
function radHTML(n){return `<span class="sqrt">\u221A<span class="rad">${n}</span></span>`;}
function surdParts(n,d){
  const m=n*d; let k=1,rest=m;
  for(let i=Math.floor(Math.sqrt(m));i>=2;i--){ if(m%(i*i)===0){k=i;rest=m/(i*i);break;} }
  const g=gcd(k,d); return {k:k/g,d:d/g,rest};
}
function surdHTML(s){
  const top=(s.k===1?'':s.k)+radHTML(s.rest);
  return s.d===1?top:`<span class="frac"><span>${top}</span><span>${s.d}</span></span>`;
}
function surdText(s){return (s.k===1?'':s.k)+'\u221A'+s.rest+(s.d>1?'/'+s.d:'');}

/* ================= parsing ================= */
function normalise(s){
  return s.toLowerCase().replace(/[\u2212\u2013\u2014]/g,'-').replace(/\u00b2/g,'^2').replace(/\u00b3/g,'^3').replace(/[\s*\u00d7\u00b7]/g,'');
}
function parsePoly(str,msg){
  if(!str) throw new Error(msg);
  let s=str; if(!/^[+-]/.test(s)) s='+'+s;
  const terms=s.match(/[+-][^+-]+/g);
  if(!terms||terms.join('')!==s) throw new Error(msg);
  const co={};
  for(const t of terms){
    const m=t.match(/^([+-])(\d*\.?\d*)(x(?:\^(\d+))?)?$/);
    if(!m) throw new Error(msg);
    const sign=m[1]==='-'?-1:1, hasX=!!m[3]; let val;
    if(m[2]===''||m[2]==='.'){ if(!hasX) throw new Error(msg); val=1; } else val=parseFloat(m[2]);
    const p=hasX?(m[4]?parseInt(m[4],10):1):0;
    co[p]=(co[p]||0)+sign*val;
  }
  return co;
}
const BADQ='I could not read that. Type it like x^2 - 6x + 5 = 0 (use ^ for powers).';
function parseQuadratic(raw){
  const s=normalise(raw); if(!s) throw new Error('Type an equation first.');
  const parts=s.split('='); if(parts.length>2) throw new Error(BADQ);
  const L=parsePoly(parts[0],BADQ), R=parts.length===2?parsePoly(parts[1],BADQ):{};
  for(const k of Object.keys(Object.assign({},L,R))){ if(+k>2) throw new Error('That has a power higher than x\u00B2. Switch to Cubic for x\u00B3 equations.'); }
  const g=k=>(L[k]||0)-(R[k]||0);
  const a=g(2),b=g(1),c=g(0);
  if(Math.abs(a)<E) throw new Error('There is no x\u00B2 term, so this is not a quadratic.');
  return [a,b,c];
}
const BADC='I could not read that. Type it like (x + 1)(x - 2)(x - 3) = 0.';
function parseCubic(raw){
  let s=normalise(raw); if(!s) throw new Error('Type an equation first.');
  const parts=s.split('=');
  if(parts.length>2) throw new Error(BADC);
  if(parts.length===2&&parts[1]!=='0') throw new Error('Cubics here must be in factorised form equal to 0, like (x + 1)(x - 2)(x - 3) = 0.');
  s=parts[0]; if(!s) throw new Error(BADC);
  let i=0,scale=1,sign=1; const factors=[];
  while(i<s.length){
    const ch=s[i];
    if(ch==='-'||ch==='+'){ if(i!==0) throw new Error(BADC); if(ch==='-') sign=-1; i++; continue; }
    if(/[\d.]/.test(ch)){ const m=s.slice(i).match(/^\d*\.?\d+/); if(!m) throw new Error(BADC); scale*=parseFloat(m[0]); i+=m[0].length; continue; }
    let f;
    if(ch==='('){
      const j=s.indexOf(')',i); if(j<0) throw new Error(BADC);
      const co=parsePoly(s.slice(i+1,j),BADC);
      if(Object.keys(co).some(k=>+k>1)) throw new Error('Each bracket should be linear, like (x + 2). Use three brackets for a cubic.');
      f={a:co[1]||0,b:co[0]||0};
      if(Math.abs(f.a)<E) throw new Error('Each bracket needs an x in it.');
      i=j+1;
    } else if(ch==='x'){ f={a:1,b:0}; i++; }
    else throw new Error(BADC);
    let pow=1;
    if(s[i]==='^'){ const m=s.slice(i+1).match(/^\d+/); if(!m) throw new Error(BADC); pow=parseInt(m[0],10); i+=1+m[0].length; }
    if(pow>3) throw new Error(BADC);
    for(let k=0;k<pow;k++) factors.push({a:f.a,b:f.b});
  }
  if(factors.length!==3) throw new Error(`I found ${factors.length} bracket${factors.length===1?'':'s'}. A cubic needs three, like (x + 1)(x - 2)(x - 3).`);
  return {s:sign*scale,factors};
}

/* ================= model builders ================= */
function mkHelpers(m){
  m.steps=[]; m.idx={};
  m.S=(title,dot,html,prompt,keys)=>{ (keys||[]).forEach(k=>m.idx[k]=m.steps.length); m.steps.push({title,dot,html,prompt}); };
}
const ln=(s,cls)=>`<div class="ln ${cls||''}">${s}</div>`;
const note=s=>`<p class="note">${s}</p>`;
const hl=(c,s)=>`<span class="hl-${c}">${s}</span>`;
const aside=s=>`<span class="aside">${s}</span>`;

function buildQuad(a,b,c){
  const h0=b/(2*a), h=Math.abs(h0)<E?0:h0;
  let k=c-b*b/(4*a); if(Math.abs(k)<E) k=0;
  const tp=[h===0?0:-h,k];
  let r=-k/a; if(Math.abs(r)<E) r=0;
  const a1=one(a);
  const m={type:'quad',a,b,c,h,k,tp,roots:[],rootText:[],yint:[0,c],
    mirror:h!==0?[-2*h,c]:null, f:x=>a*x*x+b*x+c,
    titleHTML:'y = '+quadHTML(a,b,c)};
  mkHelpers(m);

  m.S('Read the equation',null,
    ln('y = '+quadHTML(a,b,c))+
    ln(`a = ${numHTML(a)},&ensp;b = ${numHTML(b)},&ensp;c = ${numHTML(c)}`,'sm')+
    note('The equation is set equal to 0, so the roots are where the curve has y = 0. '+
      (a>0?'a is positive, so the curve is a <b>\u222A</b> shape with a lowest point.':'a is negative, so the curve is a <b>\u2229</b> shape with a highest point.')));

  m.S('Find the y-intercept','int',
    note('The curve crosses the y-axis where <b>x = 0</b>. Every term with an x in it disappears, leaving only the number c.')+
    ln(`y-intercept = (0, ${hl('int',numHTML(c))})`),
    'What is y when x = 0?',['yint']);

  if(Math.abs(b)<E){
    m.S('Completed-square form','tp',
      note('There is no x term, so this is already in completed-square form: the bracket is just x.')+
      ln('y = '+csHTML(a,0,c,'tp')));
  } else {
    let n=1;
    const bb=b/a;
    if(!a1){
      m.S(`Complete the square (${n++})`,null,
        note(`Take a factor of ${numHTML(a)} out of the <b>x<sup>2</sup> and x terms only</b>. Leave the number on its own.`)+
        ln(`y = ${aCoef(a)}[x<sup>2</sup>${coef(bb,false,'x')}]${constTerm(c)}`),
        'What is b \u00F7 a?');
    }
    const inner=`${brk(h,'hl-tp')}<sup>2</sup> ${MINUS} ${numHTML(h*h)}`;
    m.S(`Complete the square (${n++})`,null,
      note(`Halve the number in front of x: half of ${numHTML(bb)} is ${hl('tp',numHTML(h))}. Put it in a bracket with x, then subtract its square so the value does not change.`)+
      ln(`x<sup>2</sup>${coef(bb,false,'x')} = ${inner}`)+
      ln(`y = ${a1?inner:aCoef(a)+'['+inner+']'}${constTerm(c)}`),
      'Half of the number in front of x: what goes in the bracket?');
    const extra=a1?`${numHTML(c)} ${MINUS} ${numHTML(h*h)}`
      :`${numHTML(c)} ${MINUS} ${a<0?'('+numHTML(a)+')':numHTML(a)} \u00D7 ${numHTML(h*h)}`;
    m.S(`Complete the square (${n++})`,'tp',
      note(a1?'Combine the two numbers.':`Multiply the ${numHTML(a)} by the number you subtracted, then combine the numbers.`)+
      ln(`y = ${aCoef(a)}${brk(h)}<sup>2</sup> + (${extra})`)+
      ln('y = '+csHTML(a,h,k,'tp'))+
      note('This is the completed-square form, y = a(x + p)<sup>2</sup> + q.'),
      'How do we combine the numbers outside the bracket?');
  }

  m.S('Find the turning point','tp',
    note(`The bracket is squared, so it is never negative. It equals zero when the bracket itself is zero, which is where the curve is ${a>0?'lowest':'highest'}.`)+
    ln(h===0?'x = 0':`x ${h<0?MINUS:'+'} ${absHTML(h)} = 0 &ensp;\u21D2&ensp; x = ${hl('tp',numHTML(-h))}`)+
    ln(`Then y = ${hl('tp',numHTML(k))}`)+
    ln(`Turning point = (${hl('tp',numHTML(tp[0]))}, ${hl('tp',numHTML(k))})`)+
    note('The sign inside the bracket flips to give the x-coordinate. The number outside keeps its sign for the y-coordinate.'),
    'What value of x makes the bracket equal to 0?',['tp','sym']);

  const lhs=h===0?'x':`x ${h<0?MINUS:'+'} ${absHTML(h)}`;
  const sqBr=`${brk(h)}<sup>2</sup>`;
  m.S('Solve for the roots (1)','root',
    note('The roots are where <b>y = 0</b>. Rearrange so the bracket is on its own.')+
    ln(`${csHTML(a,h,k)} = 0`)+
    ln(`${aCoef(a)}${sqBr} = ${numHTML(-k)}${aside('subtract the number outside')}`)+
    (a1?'':ln(`${sqBr} = ${numHTML(r)}${aside('divide by '+numHTML(a))}`)),
    'Which steps get the squared bracket on its own?');

  if(r>0){
    const sq=Math.sqrt(r), x1=-h-sq, x2=-h+sq;
    const rf=toFrac(r), sqf=toFrac(sq);
    let surd=null; if(rf&&!sqf) surd=surdParts(rf[0],rf[1]);
    const simp=sqf?numHTML(sq):(surd?surdHTML(surd):(Math.round(sq*1000)/1000).toString());
    const showSimp=!surd||surd.k>1||surd.d>1;
    const exH=s=>{const base=h===0?'':numHTML(-h)+' '; return base===''?((s<0?MINUS:'')+surdHTML(surd)):`${base}${s<0?MINUS:'+'} ${surdHTML(surd)}`;};
    const exT=s=>{const base=h===0?'':numText(-h)+' '; return base===''?((s<0?MINUS:'')+surdText(surd)):`${base}${s<0?MINUS:'+'} ${surdText(surd)}`;};
    let body=ln(`${lhs} = \u00B1${radHTML(numHTML(r))}${aside('square root both sides')}`);
    if(showSimp) body+=ln(`${lhs} = \u00B1${simp}`);
    if(h!==0) body+=ln(`x = ${numHTML(-h)} \u00B1 ${simp}${aside('move the number across')}`);
    if(sqf){
      body+=ln(`x = ${hl('root',numHTML(x1))}&ensp;or&ensp;x = ${hl('root',numHTML(x2))}`);
      m.roots=[x1,x2]; m.rootText=[`(${numText(x1)}, 0)`,`(${numText(x2)}, 0)`];
    } else if(surd){
      body+=ln(`x = ${hl('root',exH(-1))} \u2248 ${dec(x1)}`)+ln(`x = ${hl('root',exH(1))} \u2248 ${dec(x2)}`)+
        note('Keep the exact (surd) answer. The decimal helps you place the point on the sketch.');
      m.roots=[x1,x2]; m.rootText=[`(${exT(-1)}, 0)`,`(${exT(1)}, 0)`];
    } else {
      body+=ln(`x \u2248 ${hl('root',dec(x1))}&ensp;or&ensp;x \u2248 ${hl('root',dec(x2))}`);
      m.roots=[x1,x2]; m.rootText=[`(${dec(x1)}, 0)`,`(${dec(x2)}, 0)`];
    }
    body+=note('The \u00B1 gives one root on each side of the turning point.');
    m.S('Solve for the roots (2)','root',body,'Why do we get two answers from a square root?',['roots']);
  } else if(r===0){
    m.roots=[tp[0]]; m.rootText=[`(${numText(tp[0])}, 0)`];
    m.S('Solve for the roots (2)','root',
      ln(`${lhs} = 0`)+ln(`x = ${hl('root',numHTML(-h))}`)+
      note('There is only one root. The turning point sits on the x-axis, so the curve touches the axis without crossing it.'),
      'What happens if the bracket squared equals 0?',['roots']);
  } else {
    m.S('Solve for the roots (2)','root',
      ln(`${sqBr} = ${numHTML(r)}`)+
      note(`A squared number is never negative, so there is <b>no real root</b>. The turning point is ${k>0?'above':'below'} the x-axis and the curve opens ${a>0?'upwards':'downwards'}, so it never reaches y = 0.`),
      'Can a squared number equal a negative?',['roots']);
  }

  const items=[
    `<li><span class="chip int"></span>y-intercept (0, ${numText(c)})</li>`,
    `<li><span class="chip tp"></span>turning point (${numText(tp[0])}, ${numText(k)})</li>`,
    `<li><span class="chip root"></span>${m.roots.length?(m.roots.length===1?'root ':'roots ')+m.rootText.join(' and '):'no roots (never crosses the x-axis)'}</li>`
  ];
  m.S('Sketch the curve',null,
    `<ul class="sum">${items.join('')}</ul>`+
    note(`Plot these points, draw the dashed line of symmetry through the turning point, then join them with one smooth ${a>0?'\u222A':'\u2229'} curve.`+
      (m.mirror?` The y-intercept has a mirror image at (${numText(m.mirror[0])}, ${numText(c)}), the same distance on the other side of the line of symmetry.`:'')),
    'Can you sketch it from the points before you press Next?',['curve','mirror']);
  finalize(m);
  return m;
}

function factorBody(f){ return `${aCoef(f.a)}x${Math.abs(f.b)<E?'':` ${f.b<0?MINUS:'+'} ${absHTML(f.b)}`}`; }
function factorHTML(f){ return (Math.abs(f.b)<E&&one(f.a))?'x':`(${factorBody(f)})`; }
function at0(f){
  if(one(f.a)) return Math.abs(f.b)<E?'(0)':`(0 ${f.b<0?MINUS:'+'} ${absHTML(f.b)})`;
  return `(${aCoef(f.a)}(0)${Math.abs(f.b)<E?'':` ${f.b<0?MINUS:'+'} ${absHTML(f.b)}`})`;
}

function buildCubic(p){
  const {s,factors}=p;
  const lead=s*factors.reduce((t,f)=>t*f.a,1);
  const y0raw=s*factors.reduce((t,f)=>t*f.b,1), y0=Math.abs(y0raw)<E?0:y0raw;
  const rs=factors.map(f=>-f.b/f.a).map(r=>Math.abs(r)<E?0:r).sort((x,y)=>x-y);
  const groups=[]; rs.forEach(r=>{const g=groups[groups.length-1]; if(g&&Math.abs(g.r-r)<1e-7) g.mult++; else groups.push({r,mult:1});});
  const sPre=one(s)?'':(one(-s)?MINUS:numHTML(s)+' \u00D7 ');
  const eq='y = '+sPre.replace(' \u00D7 ','')+factors.map(factorHTML).join('');
  const m={type:'cubic',lead,yint:[0,y0],roots:groups.map(g=>g.r),rootText:groups.map(g=>`(${numText(g.r)}, 0)`),
    f:x=>s*factors.reduce((t,fc)=>t*(fc.a*x+fc.b),1), titleHTML:eq, groups};
  mkHelpers(m);

  m.S('Read the factorised form',null,
    ln(eq)+
    note('Three brackets are multiplied together. The whole thing is zero as soon as <b>any one bracket is zero</b>. If you multiplied them out, the biggest power would be x<sup>3</sup>, so this is a cubic.'));

  let rb='';
  groups.forEach(g=>{
    const f=factors.find(ff=>Math.abs(-ff.b/ff.a-g.r)<1e-7)||factors[0];
    const body=factorBody(f);
    const rep=g.mult>1?aside(`this bracket appears ${g.mult===2?'twice':'three times'}`):'';
    rb+=body==='x'?ln(`x = ${hl('root',numHTML(g.r))}${rep}`):ln(`${body} = 0 &ensp;\u21D2&ensp; x = ${hl('root',numHTML(g.r))}${rep}`);
  });
  m.S('Find the roots','root',
    note('Set each bracket equal to zero and solve. '+(factors.every(f=>one(f.a))?'The root is the <b>opposite sign</b> to the number in the bracket.':''))+rb,
    'Which values of x make a bracket equal to zero?',['roots']);

  m.S('Find the y-intercept','int',
    note('The curve crosses the y-axis where <b>x = 0</b>. Put 0 in for every x, then multiply.')+
    ln(`y = ${sPre.replace(' \u00D7 ','')}${factors.map(at0).join('')}`)+
    ln(`y = ${sPre.replace(' \u00D7 ','')}${factors.map(f=>`(${numHTML(f.b)})`).join('')} = ${hl('int',numHTML(y0))}`)+
    (y0===0?note('One bracket is 0, so the curve passes through the origin. The y-intercept is the same point as the root x = 0.'):''),
    'What do you get when x = 0 in each bracket?',['yint']);

  const leadStr=one(lead)?'':(one(-lead)?MINUS:numHTML(lead));
  m.S('Find the end behaviour','end',
    note('Only the x terms matter for the ends. Multiplying the x from each bracket gives the leading term.')+
    ln(`Leading term = ${hl('end',leadStr+'x<sup>3</sup>')}`)+
    note(lead>0?'The number in front of x<sup>3</sup> is positive, so the curve starts at the <b>bottom left</b> and finishes at the <b>top right</b> (\u2197), like y = x<sup>3</sup>.'
                :'The number in front of x<sup>3</sup> is negative, so the curve starts at the <b>top left</b> and finishes at the <b>bottom right</b> (\u2198), like y = \u2212x<sup>3</sup>.'),
    'Is the number in front of x\u00B3 positive or negative?',['ends']);

  let bh='';
  groups.forEach(g=>{
    bh+=ln(`x = ${hl('root',numHTML(g.r))}&ensp;${g.mult===1?'single root: <b>crosses</b> the axis':g.mult===2?'repeated twice: <b>touches</b> the axis and turns back':'repeated three times: <b>flattens</b> as it crosses'}`,'sm');
  });
  m.S('How it behaves at each root','root',
    note(groups.length===3?'Every root is different, so the curve crosses the x-axis at each one.':'A repeated bracket changes what happens at that root.')+bh,
    'Does the curve cross or touch at each root?');

  const items=[
    `<li><span class="chip root"></span>roots ${m.rootText.join(', ')}</li>`,
    `<li><span class="chip int"></span>y-intercept (0, ${numText(y0)})</li>`,
    `<li><span class="chip end"></span>${lead>0?'bottom left \u2197 top right':'top left \u2198 bottom right'}</li>`
  ];
  m.S('Sketch the curve',null,
    `<ul class="sum">${items.join('')}</ul>`+
    note('Start at the correct end, pass through each root in the way you worked out, and make sure the curve goes through the y-intercept. The turning points do not need to be exact.'),
    'Can you sketch it before you press Next?',['curve']);
  finalize(m);
  return m;
}

/* ================= graph window + samples ================= */
function finalize(m){
  let win;
  if(m.type==='quad'){
    const xs=[0,m.tp[0],2*m.tp[0],...m.roots];
    let xmin=Math.min(...xs), xmax=Math.max(...xs);
    const span=Math.max(xmax-xmin,2), pad=span*0.3; xmin-=pad; xmax+=pad;
    const ys=[0,m.c,m.tp[1]];
    let ymin=Math.min(...ys), ymax=Math.max(...ys);
    const ysp=Math.max(ymax-ymin,2), cap=ysp*0.6;
    [m.f(xmin),m.f(xmax)].forEach(e=>{ if(e>ymax) ymax=Math.min(e,ymax+cap); if(e<ymin) ymin=Math.max(e,ymin-cap); });
    const sp2=ymax-ymin; ymin-=sp2*0.18; ymax+=sp2*0.18;
    win={xmin,xmax,ymin,ymax};
  } else {
    const rs=m.roots, lo=Math.min(...rs,0), hi=Math.max(...rs,0), span=Math.max(hi-lo,2);
    const xmin=lo-span*0.55-0.4, xmax=hi+span*0.55+0.4;
    const c1=lo-span*0.25, c2=hi+span*0.25;
    let ymin=Math.min(0,m.yint[1]), ymax=Math.max(0,m.yint[1]);
    for(let i=0;i<=200;i++){const y=m.f(c1+(c2-c1)*i/200); if(y<ymin)ymin=y; if(y>ymax)ymax=y;}
    const sp=Math.max(ymax-ymin,2); ymin-=sp*0.22; ymax+=sp*0.22;
    win={xmin,xmax,ymin,ymax};
  }
  m.win=win;
  m.samples=[]; const N=320;
  for(let i=0;i<=N;i++){const x=win.xmin+(win.xmax-win.xmin)*i/N; m.samples.push([x,m.f(x)]);}
}

function behaviourPos(m,x,y){
  const d=(m.win.xmax-m.win.xmin)*0.035, e=1e-9*(1+Math.abs(y));
  const yl=m.f(x-d)-y, yr=m.f(x+d)-y;
  const L=yl>e?1:yl<-e?-1:0, R=yr>e?1:yr<-e?-1:0;
  if(L<0&&R>0) return 'upleft';
  if(L>0&&R<0) return 'lowleft';
  if(L>0&&R>0) return 'below';
  if(L<0&&R<0) return 'above';
  return 'upleft';
}
const POS={upleft:[-11,-12,'end'],lowleft:[-11,24,'end'],below:[0,26,'middle'],above:[0,-16,'middle'],left:[-12,5,'end'],right:[12,5,'start']};

/* ================= drawing ================= */
function drawGraph(m,upto,animate){
  const svg=document.getElementById('svg');
  if(!m){svg.innerHTML='';return;}
  const VW=640,VH=520,ml=34,mr=34,mt=30,mb=34,W=VW-ml-mr,H=VH-mt-mb,win=m.win;
  const sx=x=>ml+(x-win.xmin)/(win.xmax-win.xmin)*W;
  const sy=y=>mt+(win.ymax-y)/(win.ymax-win.ymin)*H;
  const show=k=>m.idx[k]!==undefined&&upto>=m.idx[k];
  const fresh=k=>animate&&m.idx[k]===upto;
  const X0=sx(0), Y0=sy(0);
  let o=`<defs><clipPath id="clip"><rect x="${ml}" y="${mt}" width="${W}" height="${H}"/></clipPath>
    <marker id="arrE" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--end)"/></marker></defs>`;
  // axes
  o+=`<line class="axis" x1="8" y1="${Y0}" x2="${VW-14}" y2="${Y0}"/><polygon points="${VW-6},${Y0} ${VW-18},${Y0-6} ${VW-18},${Y0+6}" style="fill:var(--ink)"/>`;
  o+=`<line class="axis" x1="${X0}" y1="${VH-8}" x2="${X0}" y2="14"/><polygon points="${X0},6 ${X0-6},18 ${X0+6},18" style="fill:var(--ink)"/>`;
  o+=`<text class="lbl t-ink" x="${VW-10}" y="${Y0+24}" text-anchor="end" style="font-style:italic">x</text>`;
  o+=`<text class="lbl t-ink" x="${X0+14}" y="20" style="font-style:italic">y</text>`;
  // symmetry
  if(m.type==='quad'&&show('sym')){
    const xs=sx(m.tp[0]);
    o+=`<line x1="${xs}" y1="${mt}" x2="${xs}" y2="${mt+H}" stroke-dasharray="7 6" stroke-width="2" style="stroke:var(--tp)" opacity=".7"/>`;
    o+=`<text class="lbl t-tp" x="${xs+8}" y="${mt+16}">x = ${numText(m.tp[0])}</text>`;
  }
  // curve
  if(show('curve')){
    const lim=(win.ymax-win.ymin)*25; let d='';
    m.samples.forEach(([x,y],i)=>{const yy=Math.max(Math.min(y,win.ymax+lim),win.ymin-lim); d+=(i?'L':'M')+sx(x).toFixed(1)+' '+sy(yy).toFixed(1);});
    o+=`<path class="curve ${fresh('curve')?'draw':''}" pathLength="1" d="${d}" clip-path="url(#clip)"/>`;
  }
  // end arrows
  if(m.type==='cubic'&&show('ends')){
    const P=m.samples, inR=p=>p[1]>=win.ymin&&p[1]<=win.ymax;
    let iL=P.findIndex(inR), iR=-1; for(let i=P.length-1;i>=0;i--){ if(inR(P[i])){iR=i;break;} }
    const seg=(a,b)=>{ if(a<0||b<0||a>=P.length||b>=P.length||a===b) return ''; return `<path d="M${sx(P[a][0]).toFixed(1)} ${sy(P[a][1]).toFixed(1)} L${sx(P[b][0]).toFixed(1)} ${sy(P[b][1]).toFixed(1)}" fill="none" stroke-width="6" stroke-linecap="round" marker-end="url(#arrE)" style="stroke:var(--end)" class="${fresh('ends')?'pop':''}"/>`; };
    if(iL>=0) o+=seg(Math.min(iL+16,P.length-1),iL);
    if(iR>=0) o+=seg(Math.max(iR-16,0),iR);
  }
  // points
  const circ=(x,y,cls,r,ring,isFresh)=>`<circle class="${isFresh?'pop':''}" cx="${sx(x)}" cy="${sy(y)}" r="${r}" ${ring?`fill="none" stroke-width="3" style="stroke:var(--${cls})"`:`style="fill:var(--${cls});stroke:var(--paper)" stroke-width="3"`}/>`;
  const lab=(x,y,txt,cls,pos)=>{const [dx,dy,an]=POS[pos]; return `<text class="lbl t-${cls==='int'?'int':cls==='tp'?'tp':'root'}" x="${(sx(x)+dx).toFixed(1)}" y="${(sy(y)+dy).toFixed(1)}" text-anchor="${an}">${txt}</text>`;};
  const rootsVis=show('roots')&&m.roots.length>0;
  const tpVis=m.type==='quad'&&show('tp');
  if(show('mirror')&&m.mirror){
    o+=`<circle cx="${sx(m.mirror[0])}" cy="${sy(m.mirror[1])}" r="7" fill="none" stroke-width="3" stroke-dasharray="4 3" style="stroke:var(--int)" class="${fresh('mirror')?'pop':''}"/>`;
    o+=lab(m.mirror[0],m.mirror[1],`(${numText(m.mirror[0])}, ${numText(m.mirror[1])})`,'int',behaviourPos(m,m.mirror[0],m.mirror[1]));
  }
  if(show('yint')){
    const coincide=(rootsVis&&Math.abs(m.yint[1])<E&&m.roots.some(r=>Math.abs(r)<E))||(tpVis&&Math.abs(m.tp[0])<E);
    o+=circ(0,m.yint[1],'int',coincide?12:8,coincide,fresh('yint'));
    if(!coincide) o+=lab(0,m.yint[1],`(0, ${numText(m.yint[1])})`,'int',behaviourPos(m,0,m.yint[1]));
  }
  if(rootsVis){
    m.roots.forEach((r,i)=>{ o+=circ(r,0,'root',8,false,fresh('roots')); o+=lab(r,0,m.rootText[i],'root',behaviourPos(m,r,0)); });
  }
  if(m.type==='quad'&&show('roots')&&m.roots.length===0){
    o+=`<text class="lbl t-root" x="${VW-ml}" y="${Y0-12}" text-anchor="end">never crosses the x-axis</text>`;
  }
  if(tpVis){
    o+=circ(m.tp[0],m.tp[1],'tp',8,false,fresh('tp'));
    o+=lab(m.tp[0],m.tp[1],`(${numText(m.tp[0])}, ${numText(m.tp[1])})`,'tp',behaviourPos(m,m.tp[0],m.tp[1]));
  }
  svg.innerHTML=o;
  svg.setAttribute('aria-label','Sketch of '+(m.type==='quad'?'a quadratic':'a cubic')+' graph');
}

/* ================= app state ================= */
const SAMPLES={
  quad:['x\u00B2 \u2212 6x + 5 = 0','x\u00B2 \u2212 4x + 1 = 0','2x\u00B2 + 12x + 10 = 0','\u2212x\u00B2 + 2x + 8 = 0','x\u00B2 + 6x + 11 = 0'],
  cubic:['(x + 1)(x \u2212 2)(x \u2212 3) = 0','(x + 3)(x + 1)(x \u2212 2) = 0','x(x + 2)(x \u2212 3) = 0','(x + 2)(x \u2212 1)(x \u2212 1) = 0','\u2212(x + 2)(x \u2212 1)(x \u2212 3) = 0']
};
const LEGEND={
  quad:[['int','y-intercept'],['tp','turning point'],['root','roots']],
  cubic:[['root','roots'],['int','y-intercept'],['end','end behaviour']]
};
const HINT={quad:'Type x^2 for x\u00B2. Example: 3x^2 - 12x + 7 = 0',cubic:'Three brackets, equal to 0. Example: (x + 2)(x - 1)(x - 4) = 0'};

const $=id=>document.getElementById(id);
let mode='quad', model=null, cur=0, animate=false, lastText='';
const reduced=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function showErr(msg){const e=$('err'); e.textContent=msg||''; e.hidden=!msg;}

function loadText(t){
  try{
    model=mode==='quad'?buildQuad(...parseQuadratic(t)):buildCubic(parseCubic(t));
    cur=0; animate=false; lastText=t; showErr(''); renderAll(); return true;
  }catch(e){ showErr(e.message||'I could not read that equation.'); return false; }
}

function setMode(md){
  mode=md;
  $('tabQ').setAttribute('aria-pressed',md==='quad');
  $('tabC').setAttribute('aria-pressed',md==='cubic');
  const sel=$('eqSel');
  sel.innerHTML=SAMPLES[md].map((t,i)=>`<option value="${i}">${t}</option>`).join('')+'<option value="own">Enter your own\u2026</option>';
  sel.value='0';
  $('ownWrap').hidden=true; $('ownInput').value='';
  $('ownInput').placeholder=md==='quad'?'e.g. 3x^2 - 12x + 7 = 0':'e.g. (x + 2)(x - 1)(x - 4) = 0';
  $('hint').textContent=HINT[md];
  $('legend').innerHTML=LEGEND[md].map(([c,t])=>`<span><span class="chip ${c}"></span>${t}</span>`).join('');
  showErr('');
  loadText(SAMPLES[md][0]);
}

function cardHTML(s,i,n,isCur){
  return `<article class="card ${isCur?'cur':'old'}"><header class="ct"><span class="dot ${s.dot||''}"></span><h2>${s.title}</h2><span class="cnt">${i+1}/${n}</span></header>${s.html}</article>`;
}

function renderAll(){
  const el=$('steps');
  const back=$('backBtn'),next=$('nextBtn'),all=$('allBtn');
  if(!model){
    el.innerHTML='<div class="empty">Type an equation above, then press <b>Show working</b>.</div>';
    $('cap').innerHTML=''; $('prog').textContent=''; drawGraph(null);
    back.disabled=next.disabled=all.disabled=true; return;
  }
  const n=model.steps.length;
  let html=model.steps.slice(0,cur+1).map((s,i)=>cardHTML(s,i,n,i===cur)).join('');
  if(cur<n-1&&model.steps[cur+1].prompt) html+=`<div class="pause"><b>Before you press Next:</b> ${model.steps[cur+1].prompt}</div>`;
  if(cur===n-1) html+=`<div class="pause"><b>Your turn:</b> choose \u201CEnter your own\u201D, type an equation, and try the steps yourself before you reveal each one.</div>`;
  el.innerHTML=html;
  el.scrollTo({top:el.scrollHeight,behavior:(reduced||!animate)?'auto':'smooth'});
  $('cap').innerHTML=`Sketch of ${model.titleHTML}<small>not to scale</small>`;
  $('prog').textContent=`Step ${cur+1} of ${n}`;
  back.disabled=cur===0; next.disabled=cur===n-1; all.disabled=cur===n-1;
  next.textContent=cur===n-1?'All steps shown':'Next step';
  drawGraph(model,cur,animate);
}

$('tabQ').addEventListener('click',()=>{ if(mode!=='quad') setMode('quad'); });
$('tabC').addEventListener('click',()=>{ if(mode!=='cubic') setMode('cubic'); });
$('eqSel').addEventListener('change',e=>{
  const v=e.target.value;
  if(v==='own'){
    $('ownWrap').hidden=false;
    if(!$('ownInput').value) $('ownInput').value=lastText.replace(/\s*=\s*0$/,' = 0');
    $('ownInput').focus(); $('ownInput').select();
  } else { $('ownWrap').hidden=true; loadText(SAMPLES[mode][+v]); }
});
$('goBtn').addEventListener('click',()=>{ loadText($('ownInput').value); });
$('ownInput').addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); loadText($('ownInput').value); } });
$('nextBtn').addEventListener('click',()=>{ if(model&&cur<model.steps.length-1){cur++;animate=true;renderAll();} });
$('backBtn').addEventListener('click',()=>{ if(model&&cur>0){cur--;animate=false;renderAll();} });
$('allBtn').addEventListener('click',()=>{ if(model){cur=model.steps.length-1;animate=true;renderAll();} });
document.addEventListener('keydown',e=>{
  const t=e.target.tagName; if(t==='INPUT'||t==='SELECT'||t==='TEXTAREA') return;
  if(e.key==='ArrowRight') $('nextBtn').click();
  if(e.key==='ArrowLeft') $('backBtn').click();
});

setMode('quad');
})();
</script>
</body>
</html>
