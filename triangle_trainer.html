<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Triangle Rule Trainer</title>
<style>
:root{
  --bg:#e8eef5;--card:#fff;--border:#c8d4e0;--text:#1a2a3a;--text2:#6a7f96;
  --btn-bg:#dde6f0;--btn-border:#b0c4d8;--btn-text:#2a4060;
  --active-bg:#1a3a5c;--active-text:#fff;
  --input-bg:#f5f8fc;--input-text:#1a2a3a;
  --worked-text:#3a5070;--worked-math-bg:#dde6f0;--worked-math-text:#1a2a3a;
  --grid:rgba(100,140,180,0.2);--ok:#1a8a5a;--no:#c0392b;
}
body.dark{
  --bg:#2b2b2b;--card:#3a3a3a;--border:#444;--text:#e0e0e0;--text2:#999;
  --btn-bg:#3a3a3a;--btn-border:#555;--btn-text:#ddd;
  --active-bg:#f0f0f0;--active-text:#2b2b2b;
  --input-bg:#2b2b2b;--input-text:#f0f0f0;
  --worked-text:#bbb;--worked-math-bg:#2b2b2b;--worked-math-text:#e0e0e0;
  --grid:rgba(255,255,255,0.07);--ok:#2ec98a;--no:#e05555;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;font-family:system-ui,sans-serif;background:var(--bg);color:var(--text);transition:background .3s,color .3s}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px;pointer-events:none;z-index:0}
#app{position:relative;z-index:1;display:flex;flex-direction:column;height:100vh;padding:10px 14px;gap:10px}
#header{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-shrink:0}
h2{font-size:17px;font-weight:600;white-space:nowrap}
.rule-btns{display:flex;gap:6px}
.rule-btns button{padding:5px 14px;border-radius:20px;border:1.5px solid var(--btn-border);background:var(--btn-bg);cursor:pointer;font-size:13px;color:var(--btn-text)}
.rule-btns button.active{background:var(--active-bg);color:var(--active-text);border-color:var(--active-bg)}
.scores{display:flex;gap:8px}
.score-box{background:var(--card);border-radius:8px;border:1px solid var(--border);padding:4px 14px;text-align:center;min-width:70px}
.score-box .slabel{font-size:11px;color:var(--text2)}
.score-box .sval{font-size:22px;font-weight:600}
#score-correct .sval{color:var(--ok)}
#score-wrong .sval{color:var(--no)}
#toggle-btn{background:var(--btn-bg);border:1px solid var(--btn-border);color:var(--btn-text);border-radius:50%;width:36px;height:36px;font-size:17px;cursor:pointer;flex-shrink:0}
#body-row{display:flex;gap:10px;flex:1;overflow:hidden}
#left-col{flex:3;display:flex;flex-direction:column;overflow:hidden}
#diagram-card{flex:1;background:var(--card);border-radius:10px;border:1px solid var(--border);padding:10px 12px;display:flex;flex-direction:column;overflow:hidden}
#q-label{text-align:center;font-size:15px;font-weight:600;margin-bottom:6px;flex-shrink:0}
#canvas-wrap{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden}
canvas{background:#fff;border-radius:6px;display:block}
#right-col{flex:2;display:flex;flex-direction:column;gap:8px;overflow-y:auto}
#controls-card{background:var(--card);border-radius:10px;border:1px solid var(--border);padding:12px}
.input-row{display:flex;gap:8px;align-items:center;justify-content:center;margin-bottom:8px}
#ans-input{width:110px;padding:8px 10px;border:1px solid var(--btn-border);border-radius:8px;font-size:16px;text-align:center;background:var(--input-bg);color:var(--input-text)}
button.action{padding:8px 18px;border-radius:8px;border:1px solid var(--btn-border);background:var(--btn-bg);cursor:pointer;font-size:14px;color:var(--btn-text)}
#response{text-align:center;font-size:16px;font-weight:600;min-height:24px;margin-bottom:6px}
.ok{color:var(--ok)}.no{color:var(--no)}
#worked-toggle,#next-btn{display:block;width:100%;padding:9px 16px;border-radius:8px;border:1px solid var(--btn-border);background:var(--btn-bg);cursor:pointer;font-size:14px;color:var(--btn-text);text-align:center;margin-bottom:6px}
#next-btn{font-weight:600;margin-bottom:0}
#worked-box{display:none;font-size:13px;line-height:1.75;color:var(--worked-text);border-top:1px solid var(--border);padding-top:8px;margin-top:4px}
#worked-box .math{font-family:monospace;background:var(--worked-math-bg);color:var(--worked-math-text);padding:1px 5px;border-radius:3px;display:inline-block}
</style>
</head>
<body>
<div id="app">
  <div id="header">
    <h2>Triangle Rule Trainer</h2>
    <div class="rule-btns">
      <button id="btn-sine" class="active" onclick="setMode('sine')">Sine rule</button>
      <button id="btn-cosine" onclick="setMode('cosine')">Cosine rule</button>
      <button id="btn-both" onclick="setMode('both')">Both</button>
    </div>
    <div class="scores">
      <div class="score-box" id="score-correct"><div class="slabel">Correct</div><div class="sval" id="n-correct">0</div></div>
      <div class="score-box" id="score-wrong"><div class="slabel">Incorrect</div><div class="sval" id="n-wrong">0</div></div>
    </div>
    <button id="toggle-btn" onclick="toggleTheme()">🌙</button>
  </div>
  <div id="body-row">
    <div id="left-col">
      <div id="diagram-card">
        <div id="q-label"></div>
        <div id="canvas-wrap"><canvas id="c"></canvas></div>
      </div>
    </div>
    <div id="right-col">
      <div id="controls-card">
        <div class="input-row">
          <label style="font-size:14px;color:var(--text2)">Answer:</label>
          <input id="ans-input" type="number" step="0.1" placeholder="0.0"/>
          <button class="action" onclick="checkAnswer()">Check</button>
        </div>
        <div id="response"></div>
        <button id="worked-toggle" onclick="toggleWorked()">Show worked solution</button>
        <div id="worked-box"></div>
        <button id="next-btn" onclick="newQuestion()">Next question →</button>
      </div>
    </div>
  </div>
</div>
<script>
function toRad(d){return d*Math.PI/180;}
function toDeg(r){return r*180/Math.PI;}
function rnd(a,b,dp){if(dp===undefined){dp=1;}return parseFloat((Math.random()*(b-a)+a).toFixed(dp));}
function f1(v){return parseFloat(v.toFixed(1));}

var mode='sine',Q=null,nCorrect=0,nWrong=0,answered=false,dark=false;

function toggleTheme(){
  dark=!dark;
  document.body.classList.toggle('dark',dark);
  document.getElementById('toggle-btn').textContent=dark?'☀️':'🌙';
  if(Q){drawTriangle(Q);}
}

function setMode(m){
  mode=m;
  var ids=['sine','cosine','both'];
  for(var i=0;i<ids.length;i++){document.getElementById('btn-'+ids[i]).classList.remove('active');}
  document.getElementById('btn-'+m).classList.add('active');
  newQuestion();
}

function genSine(){
  if(Math.random()<0.28){return genAmb();}
  var A=rnd(30,80,0),B=rnd(30,80,0);
  while(A+B>160||A===B){A=rnd(30,80,0);B=rnd(30,80,0);}
  var a=rnd(4,12,1);
  var sinA=f1(Math.sin(toRad(A)));
  var sinB=f1(Math.sin(toRad(B)));
  if(Math.random()<0.5){
    var bans=f1(a*sinB/sinA);
    return {angA:A,angB:B,angC:null,sideA:a,sideB:null,sideC:null,unk:'b',answers:[bans],label:'Find x',
      worked:'<b>Sine rule:</b> <span class="math">a / sin A = b / sin B</span><br>'
        +'<span class="math">'+a+' / sin'+A+'° = x / sin'+B+'°</span><br>'
        +'<span class="math">x = '+a+' × sin'+B+'° / sin'+A+'°</span><br>'
        +'<span class="math">x = '+a+' × '+sinB+' / '+sinA+'</span><br>'
        +'<span class="math">x = <b>'+bans+'</b></span>'};
  }
  var b=f1(a*Math.sin(toRad(B))/Math.sin(toRad(A)));
  var sinB2=f1(b*sinA/a);
  var Bans=f1(toDeg(Math.asin(sinB2)));
  return {angA:A,angB:null,angC:null,sideA:a,sideB:b,sideC:null,unk:'B',answers:[Bans],label:'Find x',
    worked:'<b>Sine rule:</b> <span class="math">sin B / b = sin A / a</span><br>'
      +'<span class="math">sin x = '+b+' × sin'+A+'° / '+a+'</span><br>'
      +'<span class="math">sin x = '+b+' × '+sinA+' / '+a+'</span><br>'
      +'<span class="math">sin x = '+sinB2+'</span><br>'
      +'<span class="math">x = sin⁻¹('+sinB2+') = <b>'+Bans+'°</b></span>'};
}

function genAmb(){
  var A=rnd(20,55,0),b=rnd(5,10,1);
  var sA=Math.sin(toRad(A));
  var aMin=f1(b*sA+0.3),aMax=f1(b-0.3);
  if(aMin>=aMax){return genSine();}
  var a=rnd(aMin,aMax,1);
  var sB=b*sA/a;
  if(sB>=1){return genSine();}
  var B1=f1(toDeg(Math.asin(sB)));
  var B2=f1(180-B1);
  var valid2=(A+B2)<180;
  var sinA=f1(sA),sBr=f1(sB);
  var w='<b>Ambiguous case (SSA):</b><br>'
    +'<span class="math">sin x = '+b+' × sin'+A+'° / '+a+'</span><br>'
    +'<span class="math">sin x = '+b+' × '+sinA+' / '+a+' = '+sBr+'</span><br>'
    +'<span class="math">x = sin⁻¹('+sBr+') = '+B1+'°</span><br>';
  if(valid2){
    w+='Also <span class="math">x = 180° − '+B1+'° = '+B2+'°</span>, and '+A+'°+'+B2+'°='+(A+B2)+'° &lt; 180° ✓<br><b>Two solutions: '+B1+'° or '+B2+'°</b>';
  } else {
    w+='<span class="math">180° − '+B1+'° = '+B2+'°</span> but '+A+'°+'+B2+'°='+(A+B2)+'° ≥ 180° — one solution.<br><b>x = '+B1+'°</b>';
  }
  return {angA:A,angB:null,angC:null,sideA:a,sideB:b,sideC:null,unk:'B',
    answers:valid2?[B1,B2]:[B1],
    label:'Ambiguous case — find x'+(valid2?' (2 solutions, enter either)':''),worked:w};
}

function genCosine(){
  if(Math.random()<0.5){
    var A=rnd(25,135,0),b=rnd(4,11,1),c=rnd(4,11,1);
    var a=f1(Math.sqrt(b*b+c*c-2*b*c*Math.cos(toRad(A))));
    if(a<=0){return genCosine();}
    var b2=f1(b*b),c2=f1(c*c),twobc=f1(2*b*c),cosA=f1(Math.cos(toRad(A)));
    var twobccosA=f1(twobc*cosA),a2val=f1(b2+c2-twobccosA);
    return {angA:A,angB:null,angC:null,sideA:null,sideB:b,sideC:c,unk:'a',answers:[a],label:'Find x',
      worked:'<b>Cosine rule:</b> <span class="math">a² = b² + c² − 2bc cos A</span><br>'
        +'<span class="math">x² = '+b+'² + '+c+'² − 2 × '+b+' × '+c+' × cos'+A+'°</span><br>'
        +'<span class="math">x² = '+b2+' + '+c2+' − '+twobc+' × '+cosA+'</span><br>'
        +'<span class="math">x² = '+b2+' + '+c2+' − '+twobccosA+'</span><br>'
        +'<span class="math">x² = '+a2val+'</span><br>'
        +'<span class="math">x = <b>'+a+'</b></span>'};
  }
  var b=rnd(4,11,1),c=rnd(4,11,1),A=rnd(25,135,0);
  var a=f1(Math.sqrt(b*b+c*c-2*b*c*Math.cos(toRad(A))));
  if(a<=0){return genCosine();}
  var a2=f1(a*a),b2=f1(b*b),c2=f1(c*c),twobc=f1(2*b*c);
  var num=f1(b2+c2-a2),cosVal=f1(num/twobc);
  var Aans=f1(toDeg(Math.acos(cosVal)));
  return {angA:null,angB:null,angC:null,sideA:a,sideB:b,sideC:c,unk:'A',answers:[Aans],label:'Find x',
    worked:'<b>Cosine rule:</b> <span class="math">cos A = (b² + c² − a²) / 2bc</span><br>'
      +'<span class="math">cos x = ('+b+'² + '+c+'² − '+a+'²) / (2 × '+b+' × '+c+')</span><br>'
      +'<span class="math">cos x = ('+b2+' + '+c2+' − '+a2+') / '+twobc+'</span><br>'
      +'<span class="math">cos x = '+num+' / '+twobc+'</span><br>'
      +'<span class="math">cos x = '+cosVal+'</span><br>'
      +'<span class="math">x = cos⁻¹('+cosVal+') = <b>'+Aans+'°</b></span>'};
}

function getColors(){
  return dark
    ?{vtx:'#111',knw:'#333',arc:'#555',unk:'#900020'}
    :{vtx:'#1a2a3a',knw:'#1a2a3a',arc:'#5a7a9a',unk:'#900020'};
}

function sizeCanvas(){
  var wrap=document.getElementById('canvas-wrap');
  var c=document.getElementById('c');
  var w=wrap.clientWidth;
  var h=wrap.clientHeight;
  if(w<10||h<10){return false;}
  var scale=Math.min(w/540,h/330);
  c.width=Math.round(540*scale);
  c.height=Math.round(330*scale);
  c.dataset.scale=scale;
  return true;
}

function drawTriangle(q){
  if(!sizeCanvas()){
    setTimeout(function(){drawTriangle(q);},50);
    return;
  }
  var canvas=document.getElementById('c');
  var ctx=canvas.getContext('2d');
  var scale=parseFloat(canvas.dataset.scale)||1;
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.save();
  ctx.scale(scale,scale);
  var pts={A:{x:90,y:262},B:{x:450,y:262},C:{x:315,y:68}};
  var col=getColors();
  ctx.beginPath();
  ctx.moveTo(pts.A.x,pts.A.y);
  ctx.lineTo(pts.B.x,pts.B.y);
  ctx.lineTo(pts.C.x,pts.C.y);
  ctx.closePath();
  ctx.strokeStyle=col.knw;
  ctx.lineWidth=2.5;
  ctx.stroke();

  function lbl(text,x,y,color,size,bold){
    ctx.font=(bold?'bold ':'')+size+'px system-ui,sans-serif';
    ctx.fillStyle=color;ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(text,x,y);
  }
  function drawX(x,y){
    ctx.font='bold 24px system-ui,sans-serif';
    ctx.fillStyle=col.unk;ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('x',x,y);
  }
  var cx2=(pts.A.x+pts.B.x+pts.C.x)/3,cy2=(pts.A.y+pts.B.y+pts.C.y)/3;

  lbl('A',pts.A.x-22,pts.A.y+20,col.vtx,18,true);
  lbl('B',pts.B.x+22,pts.B.y+20,col.vtx,18,true);
  lbl('C',pts.C.x,pts.C.y-22,col.vtx,18,true);

  function mid(p1,p2,d){
    var mx=(p1.x+p2.x)/2,my=(p1.y+p2.y)/2;
    var dx=p2.x-p1.x,dy=p2.y-p1.y,len=Math.sqrt(dx*dx+dy*dy);
    var nx=-dy/len,ny=dx/len;
    if((mx+nx*5-cx2)*nx+(my+ny*5-cy2)*ny<0){nx=-nx;ny=-ny;}
    return {x:mx+nx*d,y:my+ny*d};
  }
  var SO=28,FS=19;
  var ma=mid(pts.B,pts.C,SO);
  if(q.unk==='a'){drawX(ma.x,ma.y);}else if(q.sideA!=null){lbl(''+q.sideA,ma.x,ma.y,col.knw,FS,false);}
  var mb=mid(pts.C,pts.A,SO);
  if(q.unk==='b'){drawX(mb.x,mb.y);}else if(q.sideB!=null){lbl(''+q.sideB,mb.x,mb.y,col.knw,FS,false);}
  var mc=mid(pts.A,pts.B,SO);
  if(q.unk==='c'){drawX(mc.x,mc.y);}else if(q.sideC!=null){lbl(''+q.sideC,mc.x,mc.y,col.knw,FS,false);}

  function drawAngle(vtx,p1,p2,val,isUnk){
    if(val==null&&!isUnk){return;}
    var a1=Math.atan2(p1.y-vtx.y,p1.x-vtx.x);
    var a2=Math.atan2(p2.y-vtx.y,p2.x-vtx.x);
    var diff=a2-a1;
    while(diff>Math.PI){diff-=2*Math.PI;}
    while(diff<-Math.PI){diff+=2*Math.PI;}
    var midAng=a1+diff/2;
    var tx=vtx.x+Math.cos(midAng)*30,ty=vtx.y+Math.sin(midAng)*30;
    if((cx2-vtx.x)*(tx-vtx.x)+(cy2-vtx.y)*(ty-vtx.y)<0){diff=diff>0?diff-2*Math.PI:diff+2*Math.PI;}
    var maf=a1+diff/2;
    ctx.beginPath();ctx.arc(vtx.x,vtx.y,30,a1,a1+diff,diff<0);
    ctx.strokeStyle=isUnk?col.unk:col.arc;ctx.lineWidth=1.5;ctx.stroke();
    var lx=vtx.x+Math.cos(maf)*52,ly=vtx.y+Math.sin(maf)*52;
    if(isUnk){drawX(lx,ly);}else{lbl(val+'°',lx,ly,col.knw,FS,false);}
  }
  drawAngle(pts.A,pts.B,pts.C,q.angA,q.unk==='A');
  drawAngle(pts.B,pts.A,pts.C,q.angB,q.unk==='B');
  drawAngle(pts.C,pts.A,pts.B,q.angC,q.unk==='C');
  ctx.restore();
}

function newQuestion(){
  var q;
  if(mode==='sine'){q=genSine();}
  else if(mode==='cosine'){q=genCosine();}
  else{q=Math.random()<0.5?genSine():genCosine();}
  Q=q;answered=false;
  document.getElementById('ans-input').value='';
  document.getElementById('response').textContent='';
  document.getElementById('response').className='';
  document.getElementById('worked-box').style.display='none';
  document.getElementById('worked-box').innerHTML='';
  document.getElementById('worked-toggle').textContent='Show worked solution';
  document.getElementById('q-label').textContent=q.label;
  drawTriangle(q);
}

function checkAnswer(){
  if(answered){return;}
  var raw=parseFloat(document.getElementById('ans-input').value);
  var v=parseFloat(raw.toFixed(1));
  var r=document.getElementById('response');
  if(isNaN(v)){r.textContent='Please enter a number.';r.className='';return;}
  var ok=false;
  for(var i=0;i<Q.answers.length;i++){if(Math.abs(v-f1(Q.answers[i]))<=0.05){ok=true;break;}}
  answered=true;
  if(ok){nCorrect++;document.getElementById('n-correct').textContent=nCorrect;r.textContent='✓ Correct!';r.className='ok';}
  else{nWrong++;document.getElementById('n-wrong').textContent=nWrong;r.textContent='✗ Incorrect — check the worked solution.';r.className='no';}
}

function toggleWorked(){
  var wb=document.getElementById('worked-box');
  var btn=document.getElementById('worked-toggle');
  if(wb.style.display==='block'){wb.style.display='none';btn.textContent='Show worked solution';}
  else{wb.innerHTML=Q.worked;wb.style.display='block';btn.textContent='Hide worked solution';}
}

document.getElementById('ans-input').addEventListener('keydown',function(e){if(e.key==='Enter'){checkAnswer();}});
window.addEventListener('resize',function(){if(Q){drawTriangle(Q);}});
newQuestion();
</script>
</body>
</html>
